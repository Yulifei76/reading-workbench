<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 安卓 Chrome 要求的标准写法；缺失会打印弃用告警（苹果私有 meta 只在 iOS 生效） -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7C3AED">
<link rel="manifest" href="manifest.json">
<!-- 图标改用真实 PNG。
     原先是 data:image/svg+xml 内联图标 —— iOS Safari 不支持 data: URI 作为主屏图标，
     导致"添加到主屏幕"后显示的是网页截图；部分安卓浏览器同样拒绝。
     现由项目自带的 icon-512.jpg 派生 32/180/192/512 四档 PNG。 -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="伴读教练">
<title>英语启蒙家长伴读教练</title>
<!-- ⚠️ CDN 库不再同步加载（见下方 LibLoader）。
     原先这两个 CDN 脚本以同步标签写在 head 里，会阻塞首屏渲染；而 jsdelivr 在国内经常极慢甚至被墙，
     结果是首屏卡在"正在加载…"十几秒。tesseract.js（拍照 OCR）与 xlsx（Excel 导入）
     都是极少用到的边缘功能，不该让 100% 的用户承担加载成本。
     现在改成"进入对应页面时才动态加载"，并在失败时给出明确提示。 -->
<style>
/* ===== CSS Variables ===== */
:root{--surface:#F7F7F8;--surface-muted:#EFEFF2;--text:#171717;--text-muted:#52525B;--border:rgba(23,23,23,.12);--brand:#7C3AED;--brand-soft:#F5F3FF;--brand-soft-strong:#EDE9FE;--brand-text:#5B21B6;--brand-dark:#6D28D9;--brand-gradient:linear-gradient(135deg,#7C3AED,#4F46E5);--accent:#27D2BF;--accent-soft:#EAFBF8;--accent-text:#0F766E;--success:#1DC981;--warning:#EFAA17;--danger:#E8463A;--radius:8px;--radius-card:12px;--radius-full:999px;--font-sans:"SF Pro Text","PingFang SC",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--font-sans);color:var(--text);background:var(--surface);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:0;height:0}

/* ===== App Container ===== */
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:calc(var(--vh,1vh)*100);min-height:100dvh;background:var(--surface);position:relative;padding-bottom:60px}
.page{display:none;min-height:100vh;min-height:calc(var(--vh,1vh)*100);min-height:100dvh;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ===== Bottom Nav ===== */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--text-muted);font-size:10px;transition:color .2s}
.nav-item.active{color:var(--brand)}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item .nav-label{font-size:10px}

/* ===== 微信内置浏览器引导横幅 ===== */
/* 微信 webview 没有"添加到桌面"入口，且 SW 行为不稳定；而微信是本产品最主要的传播渠道。
   检测到微信环境时顶部滑入一条可关闭的引导，提示用户改用系统浏览器打开。 */
#wx-guide{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-130%);width:100%;max-width:430px;z-index:9999;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;pointer-events:none;transition:transform .3s cubic-bezier(.22,1,.36,1)}
#wx-guide.show{transform:translateX(-50%) translateY(0)}
.wx-guide-inner{display:flex;align-items:flex-start;gap:10px;background:var(--brand-gradient);color:#fff;border-radius:var(--radius-card);padding:11px 12px;box-shadow:0 6px 20px rgba(79,70,229,.35);pointer-events:auto}
.wx-guide-text{flex:1;min-width:0}
.wx-guide-title{font-size:13px;font-weight:700;margin-bottom:2px}
.wx-guide-sub{font-size:11.5px;line-height:1.5;opacity:.93}
.wx-guide-close{flex-shrink:0;width:24px;height:24px;border-radius:var(--radius-full);background:rgba(255,255,255,.22);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.wx-guide-close:active{background:rgba(255,255,255,.42)}

/* ===== Common Components ===== */
.section-title{font-size:15px;font-weight:600;padding:12px 16px 6px;display:flex;align-items:center;justify-content:space-between}
.section-title .st-right{font-size:12px;color:var(--text-muted);font-weight:400}
.card{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:0 16px 8px;overflow:hidden}
.card-pad{padding:12px 14px}
.badge{display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:2px 8px;border-radius:var(--radius-full);font-weight:500}
.badge-brand{background:var(--brand-soft);color:var(--brand-text)}
.badge-accent{background:var(--accent-soft);color:var(--accent-text)}
.badge-success{background:rgba(29,201,129,.15);color:var(--success)}
.badge-warning{background:rgba(239,170,23,.15);color:var(--warning)}
.badge-danger{background:rgba(232,70,58,.15);color:var(--danger)}
.badge-muted{background:var(--surface-muted);color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--radius-full);font-size:14px;font-weight:600;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.96)}
.btn-brand{background:var(--brand);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-ghost{background:var(--surface-muted);color:var(--text-muted);border:1px solid var(--border)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-block{display:flex;width:100%}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--radius-full);background:var(--brand-soft-strong);color:var(--brand);font-size:14px;flex-shrink:0;transition:background .2s}
.speak-btn:active{background:var(--brand);color:#fff}
.speak-btn.dark{background:rgba(255,255,255,.2);color:#fff}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state .es-icon{font-size:48px;margin-bottom:8px}
.empty-state .es-text{font-size:14px}
.spinner{width:32px;height:32px;border:3px solid var(--brand-soft-strong);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.highlight-en{background:var(--brand-soft);border-radius:4px;padding:1px 4px}

/* ===== Page: Today ===== */
.today-header{background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:20px 16px 14px}
.today-header .th-top{display:flex;align-items:center;justify-content:space-between}
.today-header .th-title{font-size:18px;font-weight:600}
.today-header .th-streak{font-size:12px;opacity:.9;display:flex;align-items:center;gap:4px}
.today-stats{display:flex;gap:0;margin-top:12px}
.today-stats .ts-item{text-align:center;flex:1}
.today-stats .ts-val{font-size:20px;font-weight:700}
.today-stats .ts-label{font-size:10px;opacity:.8}
.today-stats .ts-div{width:1px;background:rgba(255,255,255,.2)}
.task-card{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:0 16px 8px;padding:12px 14px;display:flex;align-items:center;gap:10px;transition:border-color .2s}
.task-card.done{opacity:.5}
.task-card .tc-check{width:24px;height:24px;border-radius:var(--radius-full);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.task-card.done .tc-check{background:var(--success);border-color:var(--success);color:#fff}
.task-card .tc-info{flex:1;min-width:0}
.task-card .tc-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-card .tc-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.task-card .tc-tag{font-size:10px;padding:2px 8px;border-radius:var(--radius-full);flex-shrink:0}
.task-card .tc-tag.new{background:var(--brand);color:#fff}
.task-card .tc-tag.review{background:var(--accent-soft);color:var(--accent-text)}
.task-card .tc-arrow{color:var(--text-muted);font-size:16px}
.listen-card{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:0 16px 8px;padding:14px}
.listen-card .lc-top{display:flex;align-items:center;justify-content:space-between}
.listen-card .lc-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.listen-card .lc-time{font-size:13px;color:var(--brand);font-weight:600}
.listen-card .lc-bar{height:6px;background:var(--surface-muted);border-radius:var(--radius-full);margin-top:8px;overflow:hidden}
.listen-card .lc-fill{height:100%;background:var(--brand);border-radius:var(--radius-full);transition:width .3s}
.pattern-card{background:var(--brand-soft);border-radius:var(--radius-card);border:1px solid var(--brand-soft-strong);margin:0 16px 8px;padding:14px}
.pattern-card .pc-en{font-size:15px;font-weight:600;color:var(--brand-text);display:flex;align-items:center;gap:8px}
.pattern-card .pc-cn{font-size:13px;color:var(--text-muted);margin-top:4px}
.progress-bar{height:8px;background:var(--surface-muted);border-radius:var(--radius-full);overflow:hidden}
.avatar-entry{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px}
.review-banner{display:flex;align-items:center;gap:10px;background:#FEF3C7;border:1px solid #FCD34D;border-radius:var(--radius-card);margin:8px 16px;padding:12px 14px}
/* 授权提示条（试用将尽 / 已到期）。与复习条同构，仅配色不同以便一眼区分优先级。 */
.lic-banner{display:flex;align-items:center;gap:10px;border-radius:var(--radius-card);margin:8px 16px;padding:12px 14px;cursor:pointer}
.lic-banner.trial{background:#FFF7ED;border:1px solid #FED7AA}
.lic-banner.expired{background:#FEF2F2;border:1px solid #FECACA}
.lic-banner .lb-icon{font-size:22px}
.lic-banner .lb-text{flex:1;min-width:0}
.lic-banner .lb-t{font-size:13px;font-weight:700;color:#9A3412}
.lic-banner.expired .lb-t{color:#991B1B}
.lic-banner .lb-d{font-size:11px;color:#B45309;margin-top:2px;line-height:1.5}
.lic-banner.expired .lb-d{color:#B91C1C}
.lic-banner .lb-btn{font-size:12px;font-weight:700;color:#fff;background:#F97316;border-radius:999px;padding:6px 12px;white-space:nowrap}
.lic-banner.expired .lb-btn{background:#DC2626}
.review-banner .rb-icon{font-size:24px}
.review-banner .rb-text{flex:1;min-width:0}
.review-banner .rb-t{font-size:13px;font-weight:600;color:#92400E}
.review-banner .rb-d{font-size:11px;color:#B45309;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review-banner .rb-btn{background:#F59E0B;color:#fff;padding:6px 14px;border-radius:var(--radius-full);font-size:12px;font-weight:600;white-space:nowrap}
.cal-stats{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
.cal-stat{text-align:center;flex:1}
.cal-stat-num{font-size:18px;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-card{background:#fff;width:100%;max-width:430px;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-close{font-size:20px;color:var(--text-muted);cursor:pointer;padding:4px 8px}
.modal-body{padding:16px}
.checkin-status-btn,.checkin-time-btn,.checkin-word-btn,.checkin-mode-btn{background:var(--surface-muted);color:var(--text);border:1px solid var(--border)}
.checkin-status-btn.btn-brand,.checkin-time-btn.btn-brand,.checkin-word-btn.btn-brand,.checkin-mode-btn.btn-brand{background:var(--brand);color:#fff;border-color:var(--brand)}
.progress-bar .pb-fill{height:100%;background:var(--brand);border-radius:var(--radius-full);transition:width .3s}

/* ===== Page: Library ===== */
.lib-header{background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:20px 16px 14px}
.lib-header .lh-title{font-size:18px;font-weight:600}
.lib-header .lh-sub{font-size:12px;opacity:.8;margin-top:2px}
.lib-tabs{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--border)}
.lib-tab{flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s}
.lib-tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.lib-search{padding:8px 16px}
.lib-search .ls-input{width:100%;padding:10px 14px 10px 36px;border-radius:var(--radius-full);border:1px solid var(--border);background:#fff;font-size:13px;position:relative}
.lib-search .ls-wrap{position:relative}
.lib-search .ls-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;z-index:1}
.lib-filters{display:flex;gap:6px;padding:4px 16px 8px;overflow-x:auto}
.lib-filter{font-size:12px;padding:5px 14px;border-radius:var(--radius-full);white-space:nowrap;flex-shrink:0;border:1px solid var(--border);background:#fff;color:var(--text-muted)}
.lib-filter.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.series-group{margin:0 16px 12px}
.series-header{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.series-header .sh-name{font-size:14px;font-weight:600}
.series-header .sh-stats{font-size:11px;color:var(--text-muted)}
.book-row{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin-bottom:6px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.book-row .br-info{flex:1;min-width:0}
.book-row .br-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-row .br-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.book-row .br-status{font-size:10px;padding:2px 8px;border-radius:var(--radius-full);flex-shrink:0}
.fab{position:fixed;bottom:72px;right:20px;width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(75,63,227,.4);z-index:50;transition:transform .2s}
.fab:active{transform:scale(.9)}

/* ===== Library: Three-level Collapsible Tree ===== */
.lib-toolbar{display:flex;align-items:center;gap:8px;padding:6px 16px 8px}
.lib-toolbar .ls-wrap{position:relative;flex:1}
.lib-toolbar .ls-input{width:100%;padding:8px 12px 8px 32px;border-radius:var(--radius-full);border:1px solid var(--border);background:#fff;font-size:13px}
.lib-toolbar .ls-wrap::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;z-index:1}
.lib-tool-btn{font-size:12px;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:#fff;color:var(--text-muted);cursor:pointer;white-space:nowrap;flex-shrink:0}
.lib-tool-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* Series Node (Level 1) */
.series-node{margin:0 12px 8px;background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}
.series-head{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none}
.series-head:active{background:var(--surface-muted)}
.series-icon{font-size:20px;flex-shrink:0}
.series-info{flex:1;min-width:0}
.series-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.series-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.series-arrow{font-size:14px;color:var(--text-muted);transition:transform .2s;flex-shrink:0}
.series-node.expanded .series-arrow{transform:rotate(90deg)}
.series-progress{width:60px;flex-shrink:0}
.sp-bar{height:4px;border-radius:2px;background:#E5E7EB;overflow:hidden;display:flex}
.sp-fill-m{background:#10B981}
.sp-fill-l{background:#3B82F6}
.sp-fill-u{background:#D1D5DB}
.sp-text{font-size:10px;color:var(--text-muted);text-align:center;margin-top:2px}

/* Level Node (Level 2) */
.level-node{margin:0 12px 4px 24px;background:var(--surface-muted);border-radius:var(--radius);overflow:hidden;border-left:4px solid var(--brand)}
.level-node[data-level="A"]{border-left-color:#7C3AED}
.level-node[data-level="B"]{border-left-color:#3B82F6}
.level-node[data-level="C"]{border-left-color:#10B981}
.level-node[data-level="D"]{border-left-color:#F59E0B}
.level-head{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none}
.level-head:active{background:rgba(0,0,0,.03)}
.level-badge{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;position:relative}
.level-badge[data-level="A"]{background:#7C3AED}
.level-badge[data-level="B"]{background:#3B82F6}
.level-badge[data-level="C"]{background:#10B981}
.level-badge[data-level="D"]{background:#F59E0B}
.level-badge .lb-src{position:absolute;bottom:-2px;right:-2px;font-size:8px;background:#fff;border-radius:50%;width:12px;height:12px;display:flex;align-items:center;justify-content:center}
.level-info{flex:1;min-width:0}
.level-name{font-size:13px;font-weight:600}
.level-sub{font-size:10px;color:var(--text-muted);margin-top:1px}
.level-arrow{font-size:12px;color:var(--text-muted);transition:transform .2s;flex-shrink:0}
.level-node.expanded .level-arrow{transform:rotate(90deg)}
.level-progress{width:50px;flex-shrink:0}

/* Book Row (Level 3 - collapsed) */
.book-tree-row{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 36px;cursor:pointer;user-select:none;background:#fff;border-radius:var(--radius);margin:0 12px 0 36px}
.book-tree-row:active{background:var(--surface-muted)}
.book-tree-row.expanded{border-radius:var(--radius) var(--radius) 0 0;margin-bottom:0}
.btr-bar{width:4px;height:24px;border-radius:2px;flex-shrink:0}
.btr-bar.mastered{background:#10B981}
.btr-bar.learning{background:#3B82F6}
.btr-bar.unlearned{background:#D1D5DB}
.btr-info{flex:1;min-width:0}
.btr-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btr-meta{font-size:11px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btr-status{font-size:10px;flex-shrink:0}
.btr-arrow{font-size:12px;color:var(--text-muted);transition:transform .2s;flex-shrink:0}
.book-tree-row.expanded .btr-arrow{transform:rotate(90deg)}

/* Book Info Card (Level 3 - expanded) */
.book-info-card{margin:0 12px 0 36px;background:var(--surface-muted);border-radius:0 0 var(--radius) var(--radius);padding:12px;border-top:1px solid var(--border)}
.bic-preview{font-size:12px;color:var(--text-muted);background:#fff;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px;line-height:1.5;max-height:60px;overflow:hidden}
.bic-data{display:flex;flex-wrap:wrap;gap:4px 8px;margin-bottom:8px}
.bic-tag{font-size:10px;padding:2px 8px;border-radius:var(--radius-full);background:#fff;border:1px solid var(--border);color:var(--text-muted)}
.bic-tag.brand{color:var(--brand-text);border-color:#DDD6FE}
.bic-actions{display:flex;gap:6px}
.bic-action{flex:1;text-align:center;padding:8px 4px;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text)}
.bic-action.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.bic-action:active{transform:scale(.97)}

/* ===== Page: Book Detail ===== */
.detail-cover{background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:16px 20px 14px}
.detail-cover .dc-top{display:flex;align-items:center;gap:10px}
.detail-cover .dc-back{font-size:20px;opacity:.8}
.detail-cover .dc-title{font-size:20px;font-weight:600;flex:1}
.detail-cover .dc-tts{font-size:18px;opacity:.9}
.detail-cover .dc-badges{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.detail-cover .dc-badge{font-size:10px;padding:3px 10px;border-radius:var(--radius-full);background:rgba(255,255,255,.2)}
.detail-cover .dc-badge.active{background:rgba(255,255,255,.35)}
.detail-stats{display:flex;background:#fff;border-bottom:1px solid var(--border)}
.detail-stats .ds-item{text-align:center;flex:1;padding:10px 0}
.detail-stats .ds-val{font-size:16px;font-weight:700;color:var(--brand-text)}
.detail-stats .ds-label{font-size:10px;color:var(--text-muted);margin-top:2px}
.detail-stats .ds-div{width:1px;background:var(--border)}
.detail-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto}
.detail-tab{font-size:13px;padding:10px 14px;color:var(--text-muted);white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.detail-tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.detail-content{padding:10px 0}
.raw-line{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border)}
.raw-line:last-child{border-bottom:none}
.raw-line.playing{background:var(--brand-soft)}
.raw-line .rl-num{font-size:10px;color:var(--text-muted);width:18px;text-align:center;flex-shrink:0}
.raw-line .rl-content{flex:1;min-width:0}
.raw-line .rl-words{display:flex;flex-wrap:wrap;gap:2px;align-items:baseline}
.raw-line .rl-word{font-size:14px;cursor:pointer;padding:1px 3px;border-radius:3px;transition:background .15s}
.raw-line .rl-word:hover{background:var(--brand-soft-strong)}
.raw-line .rl-word.active{background:var(--brand);color:#fff}
.raw-line .rl-cn{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.5}
.raw-line .rl-text{flex:1;font-size:14px}
.raw-line .rl-spk{font-size:14px;opacity:.5;cursor:pointer;flex-shrink:0;padding:4px}
.raw-line .rl-spk:hover{opacity:1}
.play-all-bar{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--brand-soft-strong)}
.play-all-bar .pa-btn{font-size:12px;padding:5px 14px;border-radius:var(--radius-full);background:var(--brand);color:#fff;font-weight:500}
.play-all-bar .speed-btn{font-size:10px;padding:3px 10px;border-radius:var(--radius-full);background:#fff;color:var(--text-muted);border:1px solid var(--border)}
.play-all-bar .auto-next{font-size:10px;color:var(--text-muted);margin-left:auto;display:flex;align-items:center;gap:4px}
.toggle{width:24px;height:14px;border-radius:var(--radius-full);background:var(--border);position:relative;transition:background .2s}
.toggle.on{background:var(--success)}
.toggle::after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s}
.toggle.on::after{left:12px}
.vocab-card{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:0 16px 6px;padding:10px 14px}
.vocab-card .vc-top{display:flex;align-items:center;gap:8px}
.vocab-card .vc-word{font-size:15px;font-weight:600;color:var(--brand-text)}
.vocab-card .vc-phon{font-size:11px;color:var(--text-muted)}
.vocab-card .vc-pos{font-size:10px;padding:1px 6px;border-radius:var(--radius-full);background:var(--brand-soft);color:var(--brand-text)}
.vocab-card .vc-cn{font-size:13px;color:var(--text-muted);margin-top:2px;margin-left:36px}
.vocab-card .vc-ex{font-size:12px;margin-top:4px;margin-left:36px;padding:5px 8px;background:var(--surface);border-radius:6px;border:1px solid var(--border)}
.vocab-card .vc-tags{display:flex;gap:4px;margin-top:4px;margin-left:36px;flex-wrap:wrap}
.vocab-card .vc-tag{font-size:9px;padding:1px 5px;border-radius:var(--radius-full)}
.ext-cat{margin:0 16px 10px}
.ext-cat-label{font-size:12px;font-weight:600;color:var(--accent-text);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.ext-item{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;background:#fff;border:1px solid var(--border);margin-bottom:4px}
.ext-item .ei-en{font-size:13px;font-weight:500;flex:1}
.ext-item .ei-cn{font-size:11px;color:var(--text-muted)}
.ext-item .ei-diff{font-size:9px;padding:1px 5px;border-radius:var(--radius-full)}
.diff-1{background:rgba(29,201,129,.15);color:var(--success)}
.diff-2{background:var(--brand-soft-strong);color:var(--brand-text)}
.diff-3{background:rgba(239,170,23,.15);color:var(--warning)}
.script-step{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:0 16px 6px;overflow:hidden}
.script-step.current{border-color:var(--brand);border-left:3px solid var(--brand)}
.script-step .ss-header{display:flex;align-items:center;gap:6px;padding:8px 14px 4px}
.script-step .ss-num{width:22px;height:22px;border-radius:50%;background:var(--brand-soft-strong);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.script-step.current .ss-num{background:var(--brand);color:#fff}
.script-step .ss-name{font-size:13px;font-weight:600;flex:1}
.script-step .ss-time{font-size:10px;color:var(--text-muted)}
.script-step .ss-body{padding:0 14px 8px 36px}
.script-step .ss-en{font-size:13px;color:var(--brand-text);font-weight:500;display:flex;align-items:center;gap:4px}
.script-step .ss-cn{font-size:12px;color:var(--text-muted);margin-top:2px}
.script-step .ss-action{font-size:11px;color:var(--accent-text);margin-top:4px;padding:3px 8px;background:var(--accent-soft);border-radius:6px;display:inline-block}
.script-step .ss-tip{font-size:11px;color:var(--text-muted);margin-top:4px;font-style:italic}
.game-card{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:0 16px 6px;padding:10px 14px}
.game-card .gc-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.game-card .gc-name{font-size:13px;font-weight:600;flex:1}
.game-card .gc-desc{font-size:12px;color:var(--text-muted);line-height:1.6}
.game-card .gc-steps{font-size:11px;margin-top:4px;padding:6px 8px;background:var(--surface);border-radius:6px;border:1px solid var(--border)}
.rel-book{display:flex;align-items:center;gap:8px;background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:0 16px 4px;padding:8px 14px}
.rel-book .rb-info{flex:1;min-width:0}
.rel-book .rb-title{font-size:12px;font-weight:500}
.rel-book .rb-meta{font-size:10px;color:var(--text-muted)}
.detail-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;gap:8px;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.detail-bottom .btn{flex:1}

/* ===== Page: Schedule ===== */
.sched-header{background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:20px 16px 14px}
.sched-header .sh-title{font-size:18px;font-weight:600}
.sched-header .sh-sub{font-size:12px;opacity:.8;margin-top:2px}
.stage-card{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:8px 16px;padding:14px}
.stage-card .sc-top{display:flex;align-items:center;justify-content:space-between}
.stage-card .sc-name{font-size:14px;font-weight:600}
.stage-card .sc-progress{font-size:12px;color:var(--text-muted)}
.week-card{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:0 16px 10px;overflow:hidden}
.week-card .wc-header{padding:10px 14px;background:var(--surface-muted);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.day-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px}
.day-row:last-child{border-bottom:none}
.day-row .dr-day{font-weight:600;min-width:72px;font-size:11px;flex-shrink:0}
.day-row .dr-books{flex:1;color:var(--text-muted);font-size:11px}
.day-row .dr-tag{font-size:9px;padding:1px 6px;border-radius:var(--radius-full)}
.day-row.done{opacity:.5}
.day-row.today{background:var(--brand-soft)}
.day-row .dr-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}

/* ===== Page: Patterns ===== */
.pat-group{margin:0 16px 12px}
.pat-group .pg-title{font-size:13px;font-weight:600;padding:8px 0}
.pat-item{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin-bottom:6px;padding:12px 14px}
.pat-item .pi-en{font-size:14px;font-weight:600;color:var(--brand-text);display:flex;align-items:center;gap:6px}
.pat-item .pi-cn{font-size:12px;color:var(--text-muted);margin-top:2px}
.pat-item .pi-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pat-item .pi-chip{font-size:10px;padding:2px 8px;border-radius:var(--radius-full);background:var(--brand-soft);color:var(--brand-text)}

/* ===== Page: Checkin ===== */
.checkin-header{background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:20px 16px 14px}
.checkin-header .ch-title{font-size:18px;font-weight:600}
.checkin-header .ch-streak{font-size:13px;opacity:.9;margin-top:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 16px}
.cal-day{text-align:center;padding:6px 0;font-size:11px;border-radius:6px;position:relative}
.cal-day .cd-num{font-size:13px;font-weight:500}
.cal-day .cd-dot{width:5px;height:5px;border-radius:50%;background:var(--success);margin:2px auto 0}
.cal-day.empty{opacity:0}
.cal-day.today{background:var(--brand);color:#fff;border-radius:8px}
.cal-day.checked{color:var(--success)}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:8px 16px 0;font-size:10px;color:var(--text-muted)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 16px}
.stat-box{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);padding:14px;text-align:center}
.stat-box .sb-val{font-size:24px;font-weight:700;color:var(--brand)}
.stat-box .sb-label{font-size:11px;color:var(--text-muted);margin-top:2px}
.achievement{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin:0 16px 6px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.achievement.locked{opacity:.4}
.achievement .ach-icon{font-size:28px}
.achievement .ach-info{flex:1}
.achievement .ach-name{font-size:13px;font-weight:600}
.achievement .ach-desc{font-size:11px;color:var(--text-muted)}

/* ===== Page: Phrases ===== */
.phrase-group{margin:0 16px 12px}
.phrase-group .pg-label{font-size:13px;font-weight:600;padding:8px 0}
.phrase-item{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin-bottom:6px;padding:10px 14px}
.phrase-item .pi-top{display:flex;align-items:center;gap:8px}
.phrase-item .pi-en{font-size:14px;font-weight:500;flex:1;color:var(--brand-text)}
.phrase-item .pi-cn{font-size:12px;color:var(--text-muted);margin-top:2px}

/* ===== Page: Add Book ===== */
.add-header{background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:20px 16px 14px}
.add-header .ah-title{font-size:18px;font-weight:600}
.add-methods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 16px}
.add-method{position:relative;background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);padding:14px;text-align:center;cursor:pointer;transition:transform .1s}
.add-method:active{transform:scale(.96)}
.add-method .am-icon{font-size:28px;margin-bottom:4px}
.add-method .am-name{font-size:13px;font-weight:600}
.add-method .am-desc{font-size:10px;color:var(--text-muted);margin-top:2px}
.add-form{padding:8px 16px}
.add-form .af-label{font-size:12px;color:var(--text-muted);font-weight:500;margin-bottom:4px}
.add-form .af-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-muted);font-size:13px;margin-bottom:10px}
.add-form .af-textarea{min-height:120px;line-height:1.8;resize:vertical}
.analyzing{padding:20px 16px;text-align:center}
.analyzing .az-steps{text-align:left;margin-top:16px}
.analyzing .az-step{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.analyzing .az-step .az-ic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.analyzing .az-step.done .az-ic{background:var(--success);color:#fff}
.analyzing .az-step.active .az-ic{background:var(--brand);color:#fff}
.analyzing .az-step.pending .az-ic{background:var(--border)}
.analyzing .az-step.pending{opacity:.4}

/* ===== Teaching Mode ===== */
.teach-overlay{position:fixed;inset:0;background:var(--surface);z-index:200;display:none;flex-direction:column;max-width:430px;margin:0 auto}
.teach-overlay.active{display:flex}

/* ===== Preview Mode (备课预习) ===== */
.preview-overlay{position:fixed;inset:0;background:var(--surface);z-index:200;display:none;flex-direction:column;max-width:430px;margin:0 auto}
.preview-overlay.active{display:flex}
.preview-header{background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.preview-header .ph-close{font-size:20px;opacity:.8}
.preview-header .ph-title{font-size:16px;font-weight:600;flex:1}
.preview-header .ph-step{font-size:11px;opacity:.8;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:var(--radius-full)}
.preview-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.preview-section{margin:0 16px 16px}
.preview-sec-head{font-size:14px;font-weight:700;color:#6D28D9;padding:14px 0 8px;display:flex;align-items:center;gap:6px}
.preview-sec-head .psh-icon{font-size:18px}
.preview-sec-head .psh-num{width:24px;height:24px;border-radius:50%;background:var(--brand-soft-strong);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.preview-sec-head .psh-hint{font-size:11px;color:var(--text-muted);font-weight:400;margin-left:auto}
.preview-progress{display:flex;gap:4px;padding:8px 16px 4px;overflow-x:auto;scrollbar-width:none}
.preview-progress::-webkit-scrollbar{display:none}
.preview-progress .pp-dot{width:32px;height:4px;border-radius:2px;background:var(--border);flex-shrink:0}
.preview-progress .pp-dot.done{background:var(--success)}
.preview-progress .pp-dot.current{background:var(--brand)}
.preview-cta{position:sticky;bottom:0;padding:12px 16px;background:#fff;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.preview-cta .btn{flex:1}
.practice-row{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:#fff;border:1px solid var(--border);margin-bottom:4px}
.practice-row .pr-text{flex:1;font-size:13px}
.practice-row .pr-cn{font-size:11px;color:var(--text-muted)}
.practice-row .pr-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;cursor:pointer}
.practice-row .pr-check.checked{background:var(--success);border-color:var(--success);color:#fff}
.lesson-tip{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-radius:10px;padding:10px 14px;margin:8px 0;border-left:4px solid #D97706;font-size:12px;color:#92400E;line-height:1.7}
.lesson-tip strong{color:#78350F}

/* Detail page dual-mode buttons */
.detail-bottom-dual{display:flex;gap:8px}
.detail-bottom-dual .btn{flex:1}
.mode-card{border-radius:var(--radius-card);border:1px solid var(--border);padding:16px;margin:0 16px 8px;text-align:center;cursor:pointer;transition:transform .1s,border-color .2s}
.mode-card:active{transform:scale(.97)}
.mode-card.preview{background:linear-gradient(135deg,#F5F3FF,#EDE9FE);border-color:#C4B5FD}
.mode-card.companion{background:linear-gradient(135deg,#ECFDF5,#D1FAE5);border-color:#6EE7B7}
.mode-card .mc-icon{font-size:32px;margin-bottom:6px}
.mode-card .mc-title{font-size:15px;font-weight:700;margin-bottom:2px}
.mode-card .mc-desc{font-size:11px;color:var(--text-muted)}
.mode-card.preview .mc-title{color:#5B21B6}
.mode-card.companion .mc-title{color:#065F46}
.mode-card .mc-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:var(--radius-full);margin-top:4px}
.mode-card.preview .mc-tag{background:#C4B5FD;color:#fff}
.mode-card.companion .mc-tag{background:#6EE7B7;color:#064E3B}
.teach-header{background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px}
.teach-header .th-close{font-size:20px;opacity:.8}
.teach-header .th-title{font-size:16px;font-weight:600;flex:1}
.teach-header .th-step{font-size:12px;opacity:.8}
.teach-body{flex:1;overflow-y:auto;padding:20px 16px}
.teach-dots{display:flex;gap:6px;justify-content:center;padding:12px 0}
.teach-dots .td-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.teach-dots .td-dot.done{background:var(--success)}
.teach-dots .td-dot.current{background:var(--brand);width:24px;border-radius:4px}
.teach-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:#fff}
.teach-footer .btn{flex:1}

/* ===== Settings ===== */
.setting-group{margin:0 16px 12px}
.setting-item{background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);margin-bottom:6px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.setting-item .si-label{font-size:14px;font-weight:500}
.setting-item .si-value{font-size:12px;color:var(--text-muted)}
.si-input{font-size:13px;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;background:var(--surface-muted);text-align:right;min-width:120px;max-width:160px}
.si-input:focus{outline:none;border-color:var(--brand);background:#fff}

/* ===== Profile ===== */
.profile-header{background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:20px 16px 16px}
.profile-header .ph-row{display:flex;align-items:center;gap:14px}
.profile-header .ph-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.profile-header .ph-info{flex:1;min-width:0}
.profile-header .ph-name{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.profile-header .ph-edit{font-size:14px;opacity:.9;cursor:pointer}
.profile-header .ph-meta{font-size:12px;opacity:.85;margin-top:4px}
.profile-stats{display:flex;justify-content:space-around;padding:12px 8px;background:rgba(255,255,255,.15);border-radius:var(--radius-card);margin-top:14px}
.profile-stats .ps-item{text-align:center;flex:1}
.profile-stats .ps-num{font-size:18px;font-weight:600}
.profile-stats .ps-label{font-size:11px;opacity:.85;margin-top:2px}
.ach-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ach-strip::-webkit-scrollbar{display:none}
.ach-item{flex:0 0 auto;width:64px;text-align:center;padding:8px 4px;border-radius:var(--radius-card);background:#fff;border:1px solid var(--border)}
.ach-item.locked{opacity:.55;filter:grayscale(.8)}
.ach-item .ai-icon{font-size:22px;line-height:1}
.ach-item .ai-name{font-size:10px;color:var(--text-muted);margin-top:4px;white-space:nowrap}
.ach-summary{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;font-size:12px;color:var(--text-muted)}
.ach-summary .as-link{color:var(--brand);font-weight:500;cursor:pointer}
.setting-item.clickable{cursor:pointer;transition:background .15s}
.setting-item.clickable:active{background:var(--surface-muted)}
.setting-item .si-icon{font-size:18px;margin-right:12px;flex-shrink:0}
.setting-item .si-text{flex:1;min-width:0}
.setting-item .si-title{font-size:14px;font-weight:500}
.setting-item .si-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
.setting-item .si-arrow{color:var(--text-muted);font-size:18px;flex-shrink:0;margin-left:8px}

/* ===== Toast ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(23,23,23,.9);color:#fff;padding:8px 20px;border-radius:var(--radius-full);font-size:13px;z-index:300;animation:toastIn .3s ease;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

// ============================================================
// 【本地日期工具】—— 修复 UTC 串天（P0）
// 旧代码全文用 toISOString() 取日期：它按 UTC 换算。在东八区，
// 本地 00:00–08:00 会被算成"昨天"—— 家长早上陪读打卡会记到前一天头上。
// 以下统一按浏览器本地时区取年月日。
// ============================================================
const LDate={
  fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
  today(){return this.fmt(new Date())},
  offset(n){const d=new Date();d.setDate(d.getDate()+n);return this.fmt(d)}
};

// ============================================================
// 【打卡有效性】—— 每天启动会创建一条空打卡记录，统计时必须排除，
// 否则"阅读天数"会虚高、"今日快速打卡"按钮会消失。
// ============================================================
function hasCheckinContent(c){return !!(c&&(((c.books||[]).length>0)||((c.duration||0)>0)))}
function checkinDays(){
  return Object.keys(appData.checkins||{}).filter(d=>hasCheckinContent(appData.checkins[d]));
}

// ============================================================
// 【连续打卡重算】—— 修复"同一天读 2 本，连续天数 +2"（P0）
// 旧代码只判断"昨天有没有打卡"就 +1，同一天多次打卡会重复累加。
// 这里改为：取出"有实际内容的自然日"，从今天（或昨天）往前连续计数。
// ============================================================
function recalcStreak(){
  const days=new Set(checkinDays());
  if(!days.size){appData.streak=0;return 0}
  const d=new Date();
  if(!days.has(LDate.fmt(d)))d.setDate(d.getDate()-1);      // 今天还没读 → 从昨天起算
  if(!days.has(LDate.fmt(d))){appData.streak=0;return 0}    // 昨天也没读 → 连续中断
  let n=0;
  while(days.has(LDate.fmt(d))){n++;d.setDate(d.getDate()-1)}
  appData.streak=n;
  // 回写当天记录里的"第 N 天连续"：旧代码在重算之前就写死了，会差一天
  const tc=appData.checkins[LDate.fmt(new Date())];
  if(tc&&hasCheckinContent(tc))tc.streak=n;
  return n;
}
