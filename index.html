// ==================== ANALYSIS ENGINE ====================
const Analyzer = {
  // 句子切分（v4）
  // 变更点：
  //   ① 接收书名，第一行必须是"真正的书名行"（原始文本里可能在第 2 行）
  //   ② 书名行作为句子列表的第 1 句【保留】，不拆分、不隐藏
  //   ③ 剔除系列名行 / 作者行 / 封面词表行，避免它们冒充书名行
  //   ④ 句末标点切分时尊重引号，避免把对话句切碎
  split(text,title){
    const lines=String(text||'').replace(/\r\n?/g,'\n').split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    if(!lines.length)return[];
    const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    // 去掉冠词后再比较：原文标题行常写 "Going on Vacation"，书名字段是 "Going On A Vacation"
    const loose=s=>String(s||'').toLowerCase().replace(/\b(?:a|an|the)\b/g,'').replace(/[^a-z0-9]/g,'');
    // 元信息行：作者行 / 系列名行 / 封面词表行（中文顿号分隔）
    const isMeta=l=>/^(retold|illustrated|by|series)\b/i.test(l)
      ||/^[\w\s]{1,40}series\s*$/i.test(l)
      ||/[\u3001\u3002]/.test(l);
    // ① 在开头 3 行里找与书名匹配的那一行
    const titleNorm=loose(title);
    let titleIdx=-1;
    if(titleNorm){
      for(let i=0;i<Math.min(3,lines.length);i++){
        const n=loose(lines[i]);
        if(n&&(n===titleNorm||(n.length<=titleNorm.length+6&&n.startsWith(titleNorm)))){titleIdx=i;break}
      }
    }
    // ② 匹配不到时的兜底：**只有「多行文本 + 首行是短句且不带句末标点」才认定它是书名行**
    //    为什么必须加这个限制：批量导入时书名已被放进独立字段，rawText 只剩正文，
    //    且正文是多句拼成一行的长文本。若不限制，整段正文会被误当"书名行"吞掉，
    //    结果是句子切分全废、原文列只剩 1 行被压扁的长句。
    if(titleIdx<0&&lines.length>1){
      const cand=lines[0];
      if(cand.split(/\s+/).length<=8&&!/[.!?]\s*$/.test(cand))titleIdx=0;
    }
    // ③ 兜底后仍无书名行（titleIdx<0）：正文从第 1 行开始，不额外插入书名行
    const titleLine=titleIdx>=0?lines[titleIdx]:'';
    const bodyStart=titleIdx>=0?titleIdx+1:0;
    // ④ 正文 = 书名行之后的内容，清掉元信息行，再把断行合并成完整句
    const body=lines.slice(bodyStart).filter(l=>!isMeta(l)).join('\n')
      .replace(/[\u3001\u3002]/g,' ')
      .replace(/([^.!?\n])\n/g,'$1 ');
    // ⑤ 按句末标点切分；引号内的标点不切
    const sentences=[];
    let buf='';
    let inQuote=false;
    const flush=()=>{
      const s=buf.trim().replace(/[.!?]+$/,'').trim();
      if(s&&/[a-zA-Z]/.test(s))sentences.push(s);
      buf='';
    };
    for(let ci=0;ci<body.length;ci++){
      const ch=body[ci];
      if(ch==='\n'){buf+=' ';continue}
      if(ch==='\u201c'||ch==='"'){inQuote=true;buf+=ch;continue}
      if(ch==='\u201d'){
        inQuote=false;buf+=ch;
        // 引号结束：若后面紧跟说话人标签（said Jill / Jill said）则继续本句，
        // 否则这一句就结束了（例如 Mop.” 后面另起一句 But he did not get the stick.）
        const rest=body.slice(ci+1).replace(/^\s+/,'').toLowerCase();
        if(!/^(said|says)\b/.test(rest)&&!/^[a-z]+\s+(said|says)\b/.test(rest))flush();
        continue;
      }
      buf+=ch;
      if(!inQuote&&/[.!?]/.test(ch))flush();
    }
    flush();
    // ⑥ 书名行固定在第一位
    //    整行原样保留（不拆分、不隐藏）——它就是"绘本原文"列的第 1 行，
    //    由 analyze() 整句翻译后显示中文。
    if(titleLine&&/[a-zA-Z]/.test(titleLine))sentences.unshift(titleLine.replace(/[.!?]+$/,'').trim());
    return sentences.filter(s=>s.length>0);
  },

  extractVocab(text){
    const sentences=this.split(text);
    const words=new Set();
    sentences.forEach(s=>{s.toLowerCase().replace(/[^a-z\s']/g,'').split(/\s+/).forEach(w=>{if(w&&!STOP_WORDS.has(w)&&w.length>1)words.add(w)})});
    const result=[];
    words.forEach(w=>{
      let cn=VOCAB_DB[w];
      let displayWord=w;
      // 复数形式兜底: apples → apple
      if(!cn&&w.length>2&&w.endsWith('s')){
        const singular=w.slice(0,-1);
        if(VOCAB_DB[singular]){cn=VOCAB_DB[singular];displayWord=singular}
      }
      if(cn){
        let theme='其他';
        for(const[t,kws]of Object.entries(THEME_KEYWORDS)){if(kws.includes(displayWord)){theme=t;break}}
        const ph=this.phoneticOf(w);
        result.push({word:w,cn,phonetic:ph?'['+ph+']':'',theme,isNew:true});
      }
    });
    return result;
  },
  // 真实音标查询（数据源 PHONETIC_DB，CMUdict → IPA）。
  // 查不到就返回空串 —— 宁可不显示，也绝不给家长一个错的音标。
  phoneticOf(w){
    const lw=String(w||'').toLowerCase().replace(/[^a-z']/g,'');
    if(!lw)return '';
    if(PHONETIC_DB[lw])return PHONETIC_DB[lw];
    if(lw.endsWith("'s")){const b=lw.slice(0,-2);if(PHONETIC_DB[b])return PHONETIC_DB[b];}
    if(lw.endsWith('s')){const b=lw.slice(0,-1);if(PHONETIC_DB[b])return PHONETIC_DB[b];}
    return '';
  },
  detectPattern(text){
    const sentences=this.split(text).map(s=>s.trim());
    if(sentences.length<2)return sentences.length?sentences[0]:'';
    const patterns={};
    sentences.forEach(s=>{
      const p=s.toLowerCase().replace(/\b[a-z]+\b/g,w=>STOP_WORDS.has(w)||!VOCAB_DB[w]?'WORD':'X').replace(/X+/g,'X').trim();
      if(!patterns[p])patterns[p]={count:0,sentences:[]};
      patterns[p].count++;patterns[p].sentences.push(s);
    });
    let best=null,bestCount=0;
    for(const[p,info]of Object.entries(patterns)){if(info.count>bestCount){best={pattern:info.sentences[0],count:info.count};bestCount=info.count}}
    if(!best)return sentences[0];
    const ref=best.pattern.split(' ');
    const slots=[];
    for(let i=0;i<ref.length;i++){
      const w=ref[i].toLowerCase();
      if(!STOP_WORDS.has(w)&&VOCAB_DB[w]){slots.push(i)}
    }
    let result=ref.map(w=>w);
    slots.forEach((idx,n)=>{result[idx]='___'});
    return result.join(' ').replace(/___ ___ ___/g,'___');
  },
  detectTheme(vocab){
    const counts={};
    vocab.forEach(v=>{counts[v.theme]=(counts[v.theme]||0)+1});
    // 同时对每个词做"词尾去s"再匹配一次,提升复数词命中率
    vocab.forEach(v=>{
      if(v.theme==='其他'&&v.word.length>2&&v.word.endsWith('s')){
        const singular=v.word.slice(0,-1);
        for(const[t,kws]of Object.entries(THEME_KEYWORDS)){
          if(kws.includes(singular)){counts[t]=(counts[t]||0)+1;break}
        }
      }
    });
    let best='其他',bestCount=0;
    for(const[t,c]of Object.entries(counts)){if(c>bestCount){best=t;bestCount=c}}
    return best;
  },
  assessLevel(text,vocab){
    const sentences=this.split(text);
    const wordCount=text.split(/\s+/).filter(w=>w).length;
    const contentWords=vocab.length;
    // 不同句型数
    const patMap={};
    sentences.forEach(s=>{
      const p=s.toLowerCase().replace(/\b[a-z]+\b/g,w=>STOP_WORDS.has(w)||!VOCAB_DB[w]?'W':'X').replace(/X+/g,'X').trim();
      patMap[p]=(patMap[p]||0)+1;
    });
    const patternCount=Object.keys(patMap).length;
    // 平均句长(单词数)
    const avgLen=sentences.length>0?wordCount/sentences.length:wordCount;
    // 生词率: 不在VOCAB_DB也不在STOP_WORDS中的实义词占比
    // 注意: 启蒙绘本大量词都不在VOCAB_DB,不能简单用"未登录"判定为生词
    // 改用: 词长(字母数)作为难度信号 —— 海尼曼GK词短(3-4字母),进阶绘本词长(6+字母)
    const allWords=text.toLowerCase().replace(/[^a-z\s']/g,'').split(/\s+/).filter(w=>w.length>0);
    const contentWordsAll=allWords.filter(w=>!STOP_WORDS.has(w)&&w.length>1);
    const avgWordLen=contentWordsAll.length>0?contentWordsAll.reduce((s,w)=>s+w.length,0)/contentWordsAll.length:4;
    // 生词率(保留但降权): 仅当词明显超出VOCAB_DB且词长>5时才视为生词
    const oov=contentWordsAll.filter(w=>!VOCAB_DB[w]&&w.length>5);
    const newRate=contentWordsAll.length>0?oov.length/contentWordsAll.length:0;
    // 重复度: 重复越高说明是启蒙绘本,应更简单
    const uniq=new Set(allWords);
    const rep=contentWordsAll.length>0?1-(uniq.size/Math.max(allWords.length,1)):0;

    // ===== 启蒙绘本专用评估模型 v2 =====
    // 设计原则: 海尼曼GK(A级)应得低分,进阶绘本得高分
    // 维度选择: 句长(关键) + 词长(关键) + 词汇量 + 句型数 + 生词率
    // 阈值校准基准(海尼曼GK实测):
    //   At the Market: avgLen≈2.5 avgWordLen≈4 vocab=5 pat=1 newRate=0 → 应A级
    //   Rex:           avgLen≈3   avgWordLen≈3 vocab=6 pat=1 newRate=0 → 应A级
    //   Funny Things:  avgLen≈4   avgWordLen≈5 vocab=7 pat=1 newRate=0 → 应A级
    //   复杂绘本:       avgLen≈8   avgWordLen≈6 vocab=20 pat=4 newRate=0.3 → 应C/D级

    // 1. 句长分(30分): avgLen 1-3词=满分, 4-6=中, 7+=高
    //    使用非线性映射: avgLen<=3 给0分(最简单), avgLen>=10 给30分
    let sentenceScore=Math.min(Math.max((avgLen-3)/7,0),1)*30;

    // 2. 词长分(25分): avgWordLen<=3.5 给0分, >=6 给25分
    let wordLenScore=Math.min(Math.max((avgWordLen-3.5)/2.5,0),1)*25;

    // 3. 词汇量分(20分): vocab<=5 给0分, >=15 给20分
    let vocabScore=Math.min(Math.max((contentWords-5)/10,0),1)*20;

    // 4. 句型分(15分): pat=1 给0分, >=4 给15分
    let patternScore=Math.min(Math.max((patternCount-1)/3,0),1)*15;

    // 5. 生词率分(10分): newRate=0 给0分, >=0.5 给10分 (仅当生词多才算难)
    let oovScore=Math.min(Math.max(newRate/0.5,0),1)*10;

    let score=sentenceScore+wordLenScore+vocabScore+patternScore+oovScore;
    // 阈值校准(用海尼曼GK第一辑实测值反推):
    //   A级绘本实测 score ≈ 0-35  → 阈值40分以下判A
    //   B级绘本(score≈45-60) - 句长5-7词,词汇12-18
    //   C级绘本(score≈60-75) - 句长7-9词,词汇15-25
    //   D级绘本(score>80)    - 句长10+词,词汇25+
    if(score<40)return'A';
    if(score<60)return'B';
    if(score<75)return'C';
    return'D';
  },
  // ============================================================
  // 翻译引擎（v4 · 质量专项）
  // ------------------------------------------------------------
  // 三层降级，保证任何一句都能翻成纯中文，不残留英文：
  //   L2   句型模板 patternToCN —— 高频句型，中文最地道
  //   L2.5 通用主谓引擎 clauseCN —— 模板未命中时按语法结构现场组装
  //   L1   逐词兜底 joinL1      —— 最后保底（词库已补全 + 词形还原）
  // ============================================================

  // 词形还原：把 -ing / -es / -s / -ed / 复数 还原成词典原形
  // 只对长度 > 3 的词还原，避免 is→i、has→ha 这类误伤
  lemma(w){
    if(!w||w.length<=3)return w;
    const cand=[w];
    if(w.endsWith('ies'))cand.push(w.slice(0,-3)+'y');
    if(w.endsWith('ing')){
      const s=w.slice(0,-3);
      cand.push(s,s+'e',s.slice(0,-1));
    }
    if(w.endsWith('es'))cand.push(w.slice(0,-2),w.slice(0,-1));
    else if(w.endsWith('s')&&!w.endsWith('ss'))cand.push(w.slice(0,-1));
    if(w.endsWith('ed')){
      const s=w.slice(0,-2);
      cand.push(s,w.slice(0,-1),s.slice(0,-1));
    }
    for(const c of cand){
      if(c&&c.length>1&&(VOCAB_DB[c]!==undefined||VERB_CN[c]!==undefined))return c;
    }
    return w;
  },
  // 取"真正的动词原形"：-ing / -s / -ed / 复数 先还原，再回落到 lemma()
  // 为什么需要它：lemma() 会优先返回"原词自己"（因为 VERB_CN 收录了
  //   going/walking 这些变形），于是 vb==='go' 永远为假、短语表也查不到。
  //   凡是"要用原形做判断 / 查短语表"的地方，一律用 verbBase()。
  verbBase(w){
    const lw=String(w||'').toLowerCase();
    if(!lw)return '';
    if(VERB_IRREG[lw])return VERB_IRREG[lw];   // made → make
    const cand=[];
    if(lw.endsWith('ing')){
      const s=lw.slice(0,-3);
      cand.push(s,s+'e');
      if(/(.)\1$/.test(s))cand.push(s.slice(0,-1));   // hopping → hopp → hop
    }
    if(lw.endsWith('ies'))cand.push(lw.slice(0,-3)+'y');
    if(lw.endsWith('es'))cand.push(lw.slice(0,-2),lw.slice(0,-1));   // loves→lov,love
    else if(lw.endsWith('s')&&!lw.endsWith('ss'))cand.push(lw.slice(0,-1));
    if(lw.endsWith('ed')){
      const s=lw.slice(0,-2);
      cand.push(s,lw.slice(0,-1));
      if(/(.)\1$/.test(s))cand.push(s.slice(0,-1));   // stopped → stopp → stop
    }
    for(const c of cand){
      if(c&&c.length>1&&(VERB_CN[c]!==undefined||VOCAB_DB[c]!==undefined))return c;
    }
    return this.lemma(w);
  },
  // 单词 → 中文。查不到返回空串（调用方自行决定丢弃还是保留原文）
  gloss(w){
    const lw=String(w||'').toLowerCase().replace(/[^a-z']/g,'');
    if(!lw)return '';
    if(VOCAB_DB[lw]!==undefined)return VOCAB_DB[lw];
    if(VERB_CN[lw]!==undefined)return VERB_CN[lw];
    if(FUNC_CN[lw]!==undefined)return FUNC_CN[lw];
    if(PROPER_CN[lw]!==undefined)return PROPER_CN[lw];
    const base=this.lemma(lw);
    if(base!==lw){
      if(VOCAB_DB[base]!==undefined)return VOCAB_DB[base];
      if(VERB_CN[base]!==undefined)return VERB_CN[base];
      if(PROPER_CN[base]!==undefined)return PROPER_CN[base];
    }
    return '';
  },
  // 名词位置专用释义（见 NOUN_CN 说明）
  nounCN(w){
    const lw=String(w||'').toLowerCase();
    // 候选：原形 / 去复数 / 词形还原 —— swings 必须能落到 swing 上
    const cand=[lw];
    if(lw.endsWith('s')&&!lw.endsWith('ss'))cand.push(lw.slice(0,-1));
    cand.push(this.lemma(lw));
    for(const c of cand){if(NOUN_CN[c]!==undefined)return NOUN_CN[c];}
    return this.gloss(lw);
  },
  // 判断是否动词（含 be / 情态动词），用于切分"主语 + 谓语"
  isVerbToken(w){
    if(!w)return false;
    if(['is','are','am','was','were','can','cannot','could','will','would','be','did','does','do','had','have','has'].includes(w))return true;
    if(VERB_CN[w]!==undefined)return true;
    const b=this.lemma(w);
    return b!==w&&VERB_CN[b]!==undefined;
  },
  // 量词选择：按名词给中文量词，没有收录的默认"个"
  classifierOf(noun){
    const CLS={
      '只':['bear','bird','duck','duckling','fish','frog','cat','dog','puppy','kitten','mouse','rabbit','squirrel','skunk','lion','tiger','elephant','monkey','snake','turtle','hen','chick','fox','owl','bat','bee','ant','spider','penguin','shark','deer','horse','cow','pig','piglet','sheep','lamb','giraffe','zebra','ladybug','butterfly','gerbil','goldfish','pet','pets','cub','animal','animals','bug','bunny',
        'seal','whale','dolphin','rooster','turkey','goat','donkey','crab','snail','worm','pony'],
      '辆':['car','bus','bike','boat','train','plane','truck','van','wheelchair','sled','jeep','ship'],
      '件':['shirt','coat','jacket','dress','pajamas','sweater'],
      '双':['shoes','boots','socks','mittens'],
      '顶':['hat','cap'],
      '张':['bed','table','chair','card','ticket','picture','mat','blanket','paper'],
      '把':['knife','fork','spoon','umbrella','brush','toothbrush'],
      '杯':['glass','cup','mug'],
      '碗':['bowl'],
      '块':['cake','cheese','cookie','pizza','brownie','pie','cupcake','rock'],
      '片':['bread'],
      '根':['stick','banana','carrot'],
      '座':['house','building','bridge'],
      '条':['river','road','street','sidewalk','path','rope'],
      '棵':['tree','flower'],
      '个':['apple','orange','egg','ball','balloon','box','bag','basket','pot','pan','clock','lamp','phone','mirror','book','potato','tomato','onion','snowman','room','rattle','puppet','camera','toy','puzzle','slide','swing','puddle','seed','leaf','star','pizza','hug','kiss']
    };
    const table={};
    Object.keys(CLS).forEach(k=>CLS[k].forEach(n=>{table[n]=k}));
    // 量词修正表：优先于自动归类
    // 自动归类只能给个大概，船/飞机/鱼/马 这类必须精确覆盖，否则非常出戏
    const FIX={
      boat:'条', ship:'条', fish:'条', snake:'条', river:'条', road:'条', rope:'条',
      plane:'架', train:'列', horse:'匹', cow:'头', pig:'头', piglet:'头',
      book:'本', flower:'朵', cloud:'朵', scarf:'条', rainbow:'道', wall:'面',
      glass:'杯', cup:'杯', building:'座', sidewalk:'条', street:'条', path:'条'
    };
    const base=this.lemma(noun);
    return FIX[noun]||FIX[base]||table[noun]||table[base]||'个';
  },
  // 名词短语 → 中文（自动带量词）
  // 例：my big bear→我的大熊｜a big nose→一个大鼻子
  //     the baby duckling→这只小鸭子｜the little ducks→这些小鸭子
  phraseCN(input){
    const words=Array.isArray(input)
      ? input.map(w=>String(w).toLowerCase().replace(/[^a-z']/g,'')).filter(Boolean)
      : String(input||'').toLowerCase().replace(/[.!?,]/g,'').trim().split(/\s+/).filter(Boolean);
    if(!words.length)return '';
    const POSS={my:'我的',your:'你的',his:'他的',her:'她的',our:'我们的',their:'他们的',its:'它的'};
    const ART=new Set(['the','a','an']);
    const DEM=['this','that','these','those'];
    const ADJ={big:'大',little:'小',small:'小',funny:'有趣的',silly:'傻傻的',tall:'高的',short:'矮的',
      long:'长的',happy:'开心的',sad:'难过的',good:'好的',hot:'热的',cold:'冷的',wet:'湿的',
      fast:'快的',slow:'慢的',soft:'软的',fat:'胖胖的',yellow:'黄色',red:'红色',blue:'蓝色',
      green:'绿色',orange:'橙色',purple:'紫色',pink:'粉色',brown:'棕色',black:'黑色',
      white:'白色',grey:'灰色',gray:'灰色',old:'旧',new:'新',nice:'漂亮的',pretty:'漂亮的'};
    const SOFT=new Set(['大','小','新','旧','软','胖胖','快','慢']);
    const BABY_ANIMALS=new Set(['chick','duckling','kitten','puppy','lamb','piglet','cub','bunny','calf','foal']);
    const SPECIAL_PLURAL=new Set(['children','people','feet','teeth','mice','men','women','geese']);
    const UNCOUNTABLE=new Set(['milk','water','bread','rice','meat','soup','cheese','juice','snow','rain','hair',
      'grass','sand','food','popcorn','ice','cream','dirt','sauce','dough','sun','moon','sky','wind','mud','music']);
    // ⓪ 固定短语整体对照（a family → 一家人）
    const joined=words.join(' ');
    if(PHRASE_CN[joined])return PHRASE_CN[joined];
    // ① 找核心名词（跳过形容词 / 冠词 / 所有格 / baby）
    let head=null;
    for(let i=words.length-1;i>=0;i--){
      const w=words[i];
      if(POSS[w]||ART.has(w)||ADJ[w]||DEM.includes(w)||w==='baby')continue;
      head=w;break;
    }
    // 兜底：整串只剩"冠词+形容词"时（the orange / the play），
    // 把最后一个实词当名词，否则会退化成"这个橙色""这个玩"
    if(!head){
      for(let i=words.length-1;i>=0;i--){
        const w=words[i];
        if(POSS[w]||ART.has(w)||DEM.includes(w))continue;
        head=w;break;
      }
    }
    const headBase=head?this.lemma(head):'';
    // bus / glass / grass 这类以 s 结尾但本身是单数，不能当复数
    const isPlural=!!head&&((head.endsWith('s')&&!head.endsWith('ss')&&!SINGULAR_S.has(head))||SPECIAL_PLURAL.has(head));
    const isUnc=!!head&&(UNCOUNTABLE.has(head)||UNCOUNTABLE.has(headBase));
    const cls=head?this.classifierOf(headBase||head):'个';
    const headCN=head?this.nounCN(headBase||head):'';
    // ② 逐词组装
    // 名词中文已自带复数时（人们/孩子们），不再叠加"这些/那些"
    const plu=s2=>(/们$/.test(headCN)?'':s2);
    let out='';
    let detDone=false;
    let skipNext=false;
    for(let i=0;i<words.length;i++){
      const w=words[i];
      const next=words[i+1];
      if(skipNext){skipNext=false;continue}   // 已被固定搭配吃掉（little sister）
      if(POSS[w]){out+=POSS[w];continue}
      if(DEM.includes(w)){
        if(w==='these'||w==='those')out+=plu(w==='these'?'这些':'那些');
        else if(isUnc)out+=w==='this'?'这':'那';
        else if(/们$/.test(headCN)){/* 人们 不再加"这" */}
        else out+=(w==='this'?'这':'那')+cls;
        detDone=true;continue;
      }
      if(ART.has(w)){
        if(!detDone){
          if(isUnc){/* 不可数名词不加量词 */}
          else if(isPlural)out+=plu(w==='the'?'这些':'一'+cls);
          else if(w==='the')out+=(headCN.indexOf(cls)>=0?'这':'这'+cls);  // 玻璃杯 不再加"杯"
          else out+='一'+cls;
        }
        detDone=true;continue;
      }
      // 这个词就是核心名词：直接用已算好的 headCN，
      // 保证与量词判断同源（swings→秋千，而不是动词义"荡秋千"）
      if(w===head){out+=headCN;continue}
      if(w==='baby'){
        if(next&&BABY_ANIMALS.has(next))continue;   // baby + 幼崽词 → 中文只需一个"小"
        if(/[小幼]/.test(headCN))continue;          // 名词中文已含"小"则不再叠加
        out+='小';continue;
      }
      if(ADJ[w]){
        let cn=ADJ[w];
        // 兄弟姐妹固定搭配：little sister → 小妹妹（而不是"小姐姐"）
        if(next&&KIN[next]&&KIN[next][w]!==undefined){out+=KIN[next][w];skipNext=true;continue}
        if(cn==='小'&&/[小幼]/.test(headCN))continue; // 避免"小小猫"
        if(cn==='大'&&/^大/.test(headCN))continue;     // 避免"大大楼"
        // 中文形容词本身以"…的/…色"结尾时不再叠加"的"（避免"有趣的的"）
        out+=/的$|色$/.test(cn)?cn:(cn+(SOFT.has(cn)?'':'的'));
        continue;
      }
      // 虚词（冠词、不定式 to）中文不出现，直接跳过；未收录的词才保留原文
      if(FUNC_CN[w]==='')continue;
      const cn=this.gloss(w);
      out+=(cn||w);
    }
    return out||words.join(' ');
  },
  // 兼容旧接口：字符串入参的名词短语翻译
  nounPhraseCN(phrase){return this.phraseCN(phrase)},
  // 介词短语 → 中文；forGo=true 表示跟在 go/come 后（去某地），语序不同
  prepPhraseCN(prep,np,forGo){
    if(!prep)return np||'';
    if(prep==='in'&&np==='床')return '在床上';   // in bed 是固定说法
    if(prep==='by')return '在'+(np||'')+'旁边';  // by the pond → 在池塘旁边（'沿着池塘吃'不自然）
    if(prep==='on'&&/^(我|你|他|她|它|我们|你们|他们)$/.test(np))return '在'+np+'身上';  // on me → 在我身上
    if(prep==='up')return '上'+(np||'');
    if(prep==='down')return '下'+(np||'');
    switch(prep){
      case 'over':return '越过'+(np||'');
      case 'under':return '在'+(np||'')+'下面';
      case 'near':return '在'+(np||'')+'旁边';
      case 'beside':return '在'+(np||'')+'旁边';
      case 'behind':return '在'+(np||'')+'后面';
      case 'around':return '绕着'+(np||'');
      case 'across':return '穿过'+(np||'');
      case 'through':return '穿过'+(np||'');
      case 'into':return '进'+(np||'')+'里';
      case 'onto':return '到'+(np||'')+'上';
      case 'in':return forGo?('进'+(np||'')+'里'):('在'+(np||'')+'里');
      case 'on':return forGo?('上'+(np||'')):('在'+(np||'')+'上');
      case 'at':return '在'+(np||'');
      case 'by':return '沿着'+(np||'');
      case 'with':return '和'+(np||'')+'一起';
      case 'to':return '去'+(np||'');
      case 'from':return '从'+(np||'');
      default:return (np||'');
    }
  },
  // 介词→中文（保留旧接口，供既有模板使用）
  prepCN(p){
    const map={by:'沿着',in:'在',on:'在',at:'在',over:'越过',under:'在下面',near:'在旁边',behind:'在后面',beside:'在旁边',into:'进',onto:'到',across:'穿过',through:'穿过',around:'绕着',from:'从',to:'去',with:'和'};
    return map[p]||'';
  },
  // 主语 → 中文：代词直接映射，其余走名词短语
  subjectCN(str){
    const map={i:'我',you:'你',he:'他',she:'她',it:'它',we:'我们',they:'他们',here:'这里',there:'那里',
      mom:'妈妈',dad:'爸爸',baby:'宝宝',mouse:'小老鼠',bear:'小熊',bunny:'小兔子',
      tom:'汤姆',mop:'莫普',polly:'波莉',puff:'泡芙',rex:'雷克斯'};
    const s=String(str||'').toLowerCase().trim();
    if(map[s])return map[s];
    // 多词人名整体对照：Aunt Bee → 蜜蜂阿姨
    // （逐词拼会变成"阿姨蜜蜂"，语序反过来就错了）
    if(PROPER_CN[s])return PROPER_CN[s];
    // 复数动物主语：penguins → 企鹅们
    if(s.endsWith('s')){
      const sg=s.slice(0,-1);
      if(map[sg])return map[sg]+'们';
    }
    return this.phraseCN(s);
  },
  // "read to X"里的 X：家人称呼去掉"的"更自然（我的妈妈 → 妈妈）
  familyCN(cn){
    return String(cn||'').replace(/^我的(?=[妈妈爸爸奶奶爷爷哥哥姐姐弟弟妹妹叔叔阿姨外公外婆])/,'');
  },
  // L1 逐词兜底：每个词独立翻译后拼接
  // 虚词按规则丢弃（冠词、不定式 to），专有名词保留，保证中文里不再夹英文
  joinL1(en){
    const raw=String(en||'').replace(/[^a-zA-Z'\s]/g,' ').split(/\s+/).filter(Boolean);
    const parts=[];
    for(let i=0;i<raw.length;i++){
      const orig=raw[i];
      const lw=orig.toLowerCase();
      const next=(raw[i+1]||'').toLowerCase();
      if(['the','a','an'].includes(lw))continue;          // 冠词不译
      if(lw==='to'&&this.isVerbToken(next))continue;      // 不定式 to 不译
      let cn=this.gloss(lw);
      if(cn)parts.push(cn);
      else if(/^[A-Z]/.test(orig))parts.push(orig);       // 未收录的专有名词保留
    }
    return parts.join('');
  },
  // 祈使句 → 中文（动词在句首）
  imperativeCN(tokens){
    const t=tokens.slice();
    const head=t[0];
    const base=this.lemma(head);
    const verbCN=this.gloss(head)||this.gloss(base)||this.gloss(this.lemma(head))||'';
    let rest=t.slice(1);
    // 动词短语整体对照优先：pick up the books → 把书捡起来
    // （逐词拼会得到"摘 这些书 起来"，既错动词又错语序）
    const colImp=this.collocCN(base,t.slice(1));
    if(colImp)return colImp;
    // 句末称呼语（Mop / Jill 之类）单独处理：Sit, Mop → 坐下，莫普
    let vocative='';
    if(rest.length&&/^[a-z]+$/.test(rest[rest.length-1])&&PROPER_CN[rest[rest.length-1]])vocative='，'+this.subjectCN(rest.pop());
    // 动词 + 小品词
    let particle='';
    if(rest.length&&['up','down','out','off','in','on'].includes(rest[0])){
      const pp={up:'起来',down:'下来',out:'出去',off:'下来',in:'进来',on:'上去'};
      particle=pp[rest[0]];rest=rest.slice(1);
    }
    if(!rest.length)return verbCN+particle+vocative;
    const pi=rest.findIndex(x=>['in','on','at','over','under','by','behind','with','into','around'].includes(x));
    if(pi>=0){
      const objs=rest.slice(0,pi);
      const np=this.phraseCN(rest.slice(pi+1));
      return verbCN+this.phraseCN(objs)+(np?this.prepPhraseCN(rest[pi],np):'')+vocative;
    }
    return verbCN+this.phraseCN(rest)+particle+vocative;
  },
  // 常见动词短语整体对照表
  // 有些短语逐词拼会出怪句（go out to play → "去出去玩"），这里整体对照
  collocCN(vb,restTokens){
    const TABLE={
      'go out to play':'出去玩','come out to play':'出来玩','go out':'出去','come here':'过来',
      'go home':'回家','go fast':'跑得快','come with us':'和我们一起来','come on the train':'坐火车来',
      'go on the train ride':'坐火车','go on a train ride':'坐火车','ride on the train':'坐火车',
      'blow up balloons':'吹气球','make the beds':'铺床','wash the dishes':'洗碗',
      'rake the leaves':'耙树叶','carry the bags':'搬袋子','feed the cat':'喂猫',
      'set the table':'摆餐具','clean the house':'打扫房子','eat the ice cream':'吃冰淇淋',
      'pick up the books':'把书捡起来','pick up the toys':'把玩具捡起来','pick some flowers':'摘一些花',
      'make a cake':'做蛋糕','make a card':'做卡片','read books with me':'和我一起看书',
      'play with the blocks':'一起搭积木','hide in the box':'躲在盒子里'
    };
    const key=String(vb||'')+' '+(restTokens||[]).join(' ');
    return TABLE[key]||'';
  },
  // 谓语 → 中文（不含句号）
  // subjCN 主语中文；pred 谓语词数组；also '也'（可空）
  predicateCN(subjCN,pred,also){
    also=also||'';
    const J=x=>(subjCN||'')+(also||'')+(x||'');
    if(!pred.length)return J('');
    const BE=new Set(['is','are','am','was','were','be']);
    const MODAL=new Set(['can','cannot','could','will','would']);
    const PREPS=['in','on','at','over','under','by','behind','near','beside','around','into','with','from','up','down'];
    const head=(pred[0]||'').toLowerCase();
    const base=this.verbBase(head);
    const vCN=this.gloss(head)||this.gloss(base)||'';
    const vv=vCN;   // 谓语动词的中文，下面各分支统一用 vv
    // 整短语优先：go out to play / wash the dishes 这类直接给地道中文
    const colWhole=this.collocCN(base,pred.slice(1));
    if(colWhole)return J(colWhole);
    // ① be 动词
    if(BE.has(head)){
      let rest=pred.slice(1);
      if(rest[0]==='not')return J('不'+this.joinL1(rest.slice(1).join(' ')));
      if(!rest.length)return J('是');
      // be + V-ing → 在 + 动词
      if(this.isVerbToken(rest[0])&&/ing$/.test(rest[0])){
        const vBase=this.verbBase(rest[0]);
        const vv=this.gloss(rest[0])||this.gloss(vBase)||'';
        const tail=rest.slice(1);
        // 裸动词补默认宾语：I am riding → 我在骑车
        if(!tail.length)return J('在'+vv+(DEFAULT_OBJ[vBase]||''));
        const pi=tail.findIndex(x=>PREPS.includes(x));
        const vFirst=['hide','fall','go','come','put','get'].includes(vBase);
        if(pi>=0){
          const np=this.phraseCN(tail.slice(pi+1));
          const pp=np?this.prepPhraseCN(tail[pi],np,vBase==='go'||vBase==='come'):'';
          return J(vFirst?(vv+pp):(pp+vv));
        }
        return J('在'+vv+this.phraseCN(tail));
      }
      // be + here / there → 在这里 / 在那里
      //   "Aunt Bee is here" 曾译成"阿姨蜜蜂是这里。"，就是漏了这一步
      if(rest.length===1&&(rest[0]==='here'||rest[0]==='there')){
        return J(rest[0]==='here'?'在这里':'在那里');
      }
      // be + 介词短语 → 在…（The cat is in the box → 猫在盒子里）
      if(PREPS.includes(rest[0])&&rest.length>1){
        const npLoc=this.phraseCN(rest.slice(1));
        if(npLoc)return J(this.prepPhraseCN(rest[0],npLoc));
      }
      // be + 形容词 → 很…
      const ADJONLY=['big','little','small','long','tall','short','fat','wet','cold','hot','good','fast','slow'];
      if(rest.length===1&&ADJONLY.includes(rest[0]))return J('很'+(this.gloss(rest[0])||rest[0]).replace(/的$/,''));
      return J('是'+this.phraseCN(rest));
    }
    // ② 情态动词
    if(MODAL.has(head)){
      let rest=pred.slice(1);
      let neg=(head==='cannot');
      if(rest[0]==='not'){neg=true;rest=rest.slice(1)}
      const can=neg?'不能':'能';
      if(!rest.length)return J(can);
      const vb=this.verbBase(rest[0]);
      const vv=this.gloss(rest[0])||this.gloss(vb)||'';
      let tail=rest.slice(1);
      // 情态动词 + 动词短语整体对照（can not go out to play → 不能出去玩）
      // 必须在下面的介词分支之前：否则会被拆成"不能去出去玩"
      const colCan=this.collocCN(vb,tail);
      if(colCan)return J(can+colCan);
      // can help V → 能帮忙V
      if(vb==='help'){
        const inner=this.clauseCN(tail.join(' '));
        return J('能帮忙'+(inner||'').replace(/。$/,''));
      }
      // can read to X → 能读给X听
      if(vb==='read'&&tail[0]==='to')return J('能读给'+this.familyCN(this.phraseCN(tail.slice(1)))+'听');
      // can see X go over Y → 能看见X越过Y
      const gIdx=tail.indexOf('go');
      if(vb==='see'&&gIdx>=0){
        const np1=this.phraseCN(tail.slice(0,gIdx));
        const pw=tail[gIdx+1];
        const np2=this.phraseCN(tail.slice(gIdx+2));
        return J(can+vv+np1+(pw&&np2?this.prepPhraseCN(pw,np2,true):''));
      }
      // can + V + with + X → 能和X一起V
      const wIdx=tail.indexOf('with');
      if(wIdx>=0){
        const objs=tail.slice(0,wIdx);
        const np=this.phraseCN(tail.slice(wIdx+1));
        return J(can+'和'+np+'一起'+vv+this.phraseCN(objs));
      }
      // can + V + fast/slow
      const aIdx=tail.findIndex(x=>['fast','slow','high','far','well'].includes(x));
      if(aIdx>=0){
        const AM={fast:'快',slow:'慢',high:'高',far:'远',well:'好'};
        const objs=tail.slice(0,aIdx).filter(x=>x!=='very');
        const adv=AM[tail[aIdx]];
        const vv2=FAST_VERB[vb]||vv;
        return J(can+vv2+this.phraseCN(objs)+'得'+(tail.includes('very')?'很':'')+adv);
      }
      // can + V +（介词短语）
      const pi=tail.findIndex(x=>PREPS.includes(x));
      if(pi>=0){
        const objsRaw=tail.slice(0,pi);
        // 动词自身重复时（hop, hop, hop）不算宾语，改译成"跳呀跳"
        const objs=objsRaw.filter(x=>this.verbBase(x)!==vb);
        const rep=objs.length<objsRaw.length;
        const np=this.phraseCN(tail.slice(pi+1));
        const pp=np?this.prepPhraseCN(tail[pi],np):'';
        // 位移/姿态类动词，中文习惯把地点放前面（在草地上跳）
        const VLAST=['hop','jump','walk','run','swim','fly','sit','stand','play','dance','read','eat','drink','sleep'];
        // up/down/onto/into/over 这类方向词必须动词在前：跳上楼梯
        const vLead=['up','down','onto','into','over','across','through'].includes(tail[pi]);
        if(rep)return J(can+pp+vv+'呀'+vv);
        if(vLead)return J(can+vv+pp+this.phraseCN(objs));
        return J(can+this.phraseCN(objs)+(VLAST.includes(vb)?(pp+vv):(vv+pp)));
      }
      // 只有真的"没有尾巴"时才补默认宾语（Tom can eat → 汤姆会吃饭）；
      // 否则会把 "draw a mom" 拼成"画画一个妈妈"
      return J(can+vv+(tail.length?'':(DEFAULT_OBJ[vb]||''))+this.phraseCN(tail));
    }
    // ③ like / love
    if(['like','likes','love','loves'].includes(head)||base==='like'||base==='love'){
      const isLove=base==='love';
      let rest=pred.slice(1);
      if(rest[0]==='to'){
        const vb=this.verbBase(rest[1]);
        const vv=this.gloss(rest[1])||this.gloss(vb)||'';
        const tail=rest.slice(2);
        // 喜欢和某人一起V
        const wIdx=tail.indexOf('with');
        if(wIdx>=0){
          const np=this.phraseCN(tail.slice(wIdx+1));
          return J('喜欢和'+np+'一起'+vv);
        }
        const pi=tail.findIndex(x=>PREPS.includes(x));
        // play 不放 vFirst："我喜欢在学校玩"比"我喜欢玩在学校"自然
        const vFirst=['hide','go','come'].includes(vb);
        if(pi>=0){
          const np=this.phraseCN(tail.slice(pi+1));
          const pp=np?this.prepPhraseCN(tail[pi],np,vb==='go'||vb==='come'):'';
          return J((isLove?'爱':'喜欢')+(vFirst?(vv+pp):(pp+vv)));
        }
        return J((isLove?'爱':'喜欢')+vv+(DEFAULT_OBJ[vb]||'')+this.phraseCN(tail));
      }
      return J((isLove?'爱':'喜欢')+this.phraseCN(rest));
    }
    // ④ have / has
    if(head==='have'||head==='has'||head==='had'||base==='have'){
      return J('有'+this.phraseCN(pred.slice(1)));
    }
    // ⑤ 否定：did not V / do not V / does not V
    if(head==='did'||head==='do'||head==='does'){
      let rest=pred.slice(1);
      let neg=false;
      if(rest[0]==='not'){neg=true;rest=rest.slice(1)}
      if(!rest.length)return J(neg?'没有':'做');
      const vv2=this.gloss(rest[0])||this.gloss(this.lemma(rest[0]))||'';
      return J((neg?'没有':'')+vv2+this.phraseCN(rest.slice(1)));
    }
    // ⑥ made X with Y → 用Y做了X
    if(base==='make'&&/[a-z]/.test(head)){
      const wIdx=pred.indexOf('with');
      if(wIdx>1){
        const obj=this.phraseCN(pred.slice(1,wIdx));
        const tool=this.phraseCN(pred.slice(wIdx+1));
        return J('用'+tool+'做'+obj);
      }
    }
    // ⑦ 普通实义动词
    let rest=pred.slice(1);
    // want to V → 想 V（"I want to go out to play" → 我想出去玩）
    if(base==='want'&&rest[0]==='to'){
      const inner=this.collocCN(this.verbBase(rest[1]),rest.slice(2))
        ||this.patternToCN(rest.slice(1).join(' '),null)
        ||this.clauseCN(rest.slice(1).join(' '));
      return J('想'+String(inner||'').replace(/。$/,''));
    }
    // go/come + out + to V（表目的，不是宾语！）
    //   She went out to play → 她出去玩了
    //   必须放在下面的"小品词+宾语"之前，否则 'to play' 会被当成宾语，
    //   拼成"她把玩去了出去"这种怪句
    if(rest[0]==='out'&&rest[1]==='to'&&this.isVerbToken(rest[2])){
      const pv=this.gloss(rest[2])||this.gloss(this.lemma(rest[2]))||'';
      return J('出去'+pv+'了');
    }
    // 动词 + 小品词 + 宾语 → 把宾语V起来
    if(rest.length&&['up','down','out','off'].includes(rest[0])&&rest.length>1){
      const pp={up:'起来',down:'下来',out:'出去',off:'下来'};
      const obj=this.phraseCN(rest.slice(1));
      return J('把'+obj+vv+pp[rest[0]]);
    }
    const pi=rest.findIndex(x=>PREPS.includes(x));
    if(pi>=0){
      const objs=rest.slice(0,pi);
      const np=this.phraseCN(rest.slice(pi+1));
      const forGo=['go','come','run','walk','swim','fly','ride'].includes(base);
      const vFirst=['hide','fall','put','get','put'].includes(base);
      const pp=np?this.prepPhraseCN(rest[pi],np,forGo):'';
      // with + 工具 → 用X V（I made it with the blocks → 我用这些积木做它）
      if(rest[pi]==='with'&&objs.length)return J('用'+np+vv+this.phraseCN(objs));
      if(objs.length){
        // 地点/方式状语在中文里放动词前：We read books at school → 我们在学校读书
        // 宾语若已被动词中文包含（sing 唱歌 + songs 歌），去掉重复
        const objCN=this.phraseCN(objs);
        const objOut=(objCN&&objCN.length>0&&vv.indexOf(objCN)>=0)?'':objCN;
        return J(pp+vv+objOut);
      }
      return J(vFirst?(vv+pp):(pp+vv));
    }
    // went 特殊：去了
    if(base==='go'||base==='come')return J(vv+(rest.length?this.phraseCN(rest):''));
    const obj=this.phraseCN(rest);
    return J(vv+obj+(/了$/.test(vv)?'':''));
  },
  // 通用"主语 + 谓语"引擎：模板未命中时按语法结构现场组装
  clauseCN(sentence){
    if(!sentence)return '';
    const raw=String(sentence).replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,' ').replace(/\s+/g,' ').trim();
    let s=raw.toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
    if(!s)return '';
    let prefix='';
    const mConj=s.match(/^(and|but|so)\s+(.+)$/);
    if(mConj){
      prefix=mConj[1]==='but'?'但是':(mConj[1]==='so'?'所以':'');
      s=mConj[2];
    }
    let tokens=s.split(' ').filter(Boolean);
    let also='';
    if(tokens.length>1&&tokens[tokens.length-1]==='too'){also='也';tokens=tokens.slice(0,-1)}
    if(!tokens.length)return '';
    let vi=-1;
    for(let i=0;i<tokens.length;i++){if(this.isVerbToken(tokens[i])){vi=i;break}}
    if(vi<0)return prefix+this.phraseCN(tokens)+'。';
    if(vi===0)return prefix+this.imperativeCN(tokens)+'。';
    const subjCN=this.subjectCN(tokens.slice(0,vi).join(' '));
    const body=this.predicateCN(subjCN,tokens.slice(vi),also);
    if(!body)return prefix+this.phraseCN(tokens)+'。';
    return prefix+body+'。';
  },
  // 对话句：「……」某某说
  // 支持 "Come here, Mop," Jill said / Jill said, "Get the stick."
  speechCN(sentence){
    const q=sentence.match(/[\u201c"]([^\u201d"]*)[\u201d"]/);
    if(!q)return '';
    const speech=q[1].replace(/[,.\s]+$/,'').trim();
    const tag=sentence.replace(q[0],' ').replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
    // 说话人
    let who='';
    const tm=tag.match(/([a-z]+)\s+said/)||tag.match(/said\s+([a-z]+)/);
    if(tm)who=this.subjectCN(tm[1]);
    // 引语里的称呼语（Come here, Mop → 过来，莫普）
    let voc='';
    const chunks=speech.split(',');
    if(chunks.length>1){
      const last=chunks[chunks.length-1].trim().toLowerCase();
      if(/^[a-z]+$/.test(last)&&(PROPER_CN[last]||['mom','dad','baby','bunny','bear'].includes(last))){
        voc='，'+this.subjectCN(last);
        chunks.pop();
      }
    }
    // 引语可能含多句
    const clauses=chunks.join(',').split(/[.!?]+/).map(x=>x.trim()).filter(x=>/[a-zA-Z]/.test(x));
    const parts=clauses.map(c=>{
      const cn=this.patternToCN(c,null)||this.clauseCN(c)||this.joinL1(c);
      return String(cn).replace(/。$/,'').replace(/！$/,'')+'。';
    });
    let speechCN=parts.join('');
    if(voc)speechCN=speechCN.replace(/。$/,voc+'。');
    return who?('「'+speechCN+'」'+who+'说。'):('「'+speechCN+'」');
  },
  // 句型→中文（L2 模板优先）
  patternToCN(sentence,vocab){
    if(!sentence)return '';
    // 可复用的"主语"片段：代词 / 所有格+名词 / the|a|an + 形容词* + 名词
    const SUBJ='(?:my|your|his|her|our|their|the|a|an|this|that|these|those)\\s+(?:(?:big|little|small|old|new|fat|soft|wet|long|short|yellow|red|blue|green|brown|black|white|funny|baby|nice|lovely|poor)\\s+)?[a-z]+s?|i|you|he|she|it|we|they|[a-z]+';
    const VERB='[a-z]+';
    const raw=String(sentence).replace(/\s+/g,' ').trim();
    // 匹配用的归一化串：标点（含连字符、中文引号）一律转成空格
    // 这样 Good-bye / “Stop!” / Pop! 都能归一到可匹配的形式
    const s=raw.toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
    const subj=w=>this.subjectCN(w);
    const NP=x=>this.phraseCN(x);
    // 0. 对话句（含引号）优先处理
    if(/[\u201c"]/.test(raw)){
      const sp=this.speechCN(raw);
      if(sp)return sp;
    }
    // 0b. 语气词 / 固定短语
    const FIXED={
      'pop':'砰！','choo choo':'呜——呜——','choo':'呜——','hello':'你好！',
      'good bye':'再见！','goodbye':'再见！','oh no':'哦，不！','happy birthday':'生日快乐！',
      'yum yum':'好吃好吃！','look at us':'看看我们！','look at me':'看看我！','me too':'我也是！'
    };
    if(FIXED[s])return FIXED[s];
    // 常见书名/短语（保证第一行书名行一定有中文）
    // 注意：TITLE_CN 的 key 是"去标点去空格的小写形式"
    const titleKey=s.replace(/[^a-z0-9]/g,'');
    if(TITLE_CN[titleKey])return TITLE_CN[titleKey]+'。';
    // 常见句型模板：越具体的模式越靠前
    const templates=[
      // 0. 固定动词短语（整体对照，避免逐词拼成"去玩出去"这类怪句）
      //    放在最前面：越具体的模式越靠前，避免被后面的通用"主+动+宾"模板吞掉
      {pat:/^(?:go|went|come|came) out to play$/,cn:()=>'出去玩。'},
      {pat:/^(?:go|went) out$/,cn:()=>'出去了。'},
      {pat:/^pick (?:up )?(?:the |a |an )?(.+)$/,cn:m=>'把'+NP(m[1])+'捡起来。'},
      {pat:/^pick up (.+)$/,cn:m=>'把'+NP(m[1])+'捡起来。'},
      // 钻进去：The ant went in the hat → 这只蚂蚁钻进这顶帽子
      // （走通用"主+动+介"会把动词甩到句尾："在这顶帽子里去了"）
      {pat:new RegExp('^('+SUBJ+') (?:went|go|goes|come|came) (?:in|into) (.+)$'),cn:m=>subj(m[1])+'钻进'+NP(m[2])+'。'},
      // be + 形容词：必须放在"主语 + is + …"之前，
      //   否则 My hat is big 会被通用模板吞成"我的帽子是大。"
      {pat:new RegExp('^('+SUBJ+') is (big|small|little|long|tall|short|fat|wet|cold|hot|good|fast|slow)$'),cn:m=>subj(m[1])+'很'+(this.gloss(m[2])||m[2]).replace(/的$/,'')+'。'},
      // 句末 ", too" → "也"必须放主语后面，不能跟着宾语
      //   Gramps can come with us, too → 爷爷也能和我们一起来
      {pat:new RegExp('^('+SUBJ+') can ('+VERB+') with (.+?),? too$'),cn:m=>subj(m[1])+'也能和'+NP(m[3])+'一起'+(this.gloss(m[2])||m[2])+'。'},
      // 有形状/大小形容词的 have/has：He has big legs → 他的腿很大
      // （若走通用 have 模板会拼成"他有 大 腿"＝他有大腿，语义完全错）
      {pat:new RegExp('^('+SUBJ+') (?:has|have) (big|small|little|long|short|fat|soft) (.+)$'),cn:m=>
        subj(m[1])+'的'+NP(m[3])+'很'+(this.gloss(m[2])||m[2]).replace(/的$/,'')+'。'},
      // 1. 祈使 / 动作句
      {pat:/^look at (.+)$/,cn:m=>'看'+NP(m[1])+'！'},
      {pat:/^look (.+)$/,cn:m=>'看'+NP(m[1])+'！'},
      {pat:/^come and see (.+)$/,cn:m=>'来看看'+NP(m[1])+'。'},
      {pat:/^come and play (.+)$/,cn:m=>'来玩'+NP(m[1])+'。'},
      {pat:/^come here(?:, (.+))?$/,cn:m=>'过来'+(m[1]?'，'+this.subjectCN(m[1]):'')+'。'},
      {pat:/^go away (.+)$/,cn:m=>NP(m[1])+'走开。'},
      {pat:/^look out (.+)$/,cn:m=>NP(m[1])+'小心！'},
      // 1b. 现在进行时（Mom is walking → 妈妈在走）
      // 必须放在"主语 + is + …"之前，否则会被译成"妈妈是走"
      {pat:new RegExp('^('+SUBJ+') (?:is|are|am) (\\w+ing)(.*)$'),cn:m=>{
        // ⚠️ 捕获组下标：SUBJ 是第 1 组，(?:is|are|am) 是非捕获组，
        //    所以 "动词 -ing" 在 m[2]、动词后面的尾巴在 m[3]。
        //    （历史 bug：这里曾误写成 m[3]/m[4]，取到空串，
        //      导致 "Mom is walking" 译成 "妈妈在。" 把动词整个丢掉）
        const verb=m[2];
        const vb=this.verbBase(verb);
        const tail=(m[3]||'').trim();
        // 先整体对照动词短语表：going on a train ride → 坐火车
        const colTail=this.collocCN(vb,tail.split(' ').filter(Boolean));
        if(colTail)return subj(m[1])+'在'+colTail+'。';
        const vv=this.gloss(verb)||this.gloss(vb)||'';
        // 裸动词补默认宾语，避免"我在骑。""我在吃。"这种半截话
        if(!tail)return subj(m[1])+'在'+vv+(DEFAULT_OBJ[vb]||'')+'。';
        const tk=tail.split(' ').filter(Boolean);
        const pi=tk.findIndex(x=>['in','on','at','under','behind','near','around','into','with'].includes(x));
        const vFirst=['hide','fall','go','come','put','get'].includes(vb);
        if(pi>=0){const np=NP(tk.slice(pi+1));const pp=this.prepPhraseCN(tk[pi],np);return subj(m[1])+(vFirst?(vv+pp):(pp+vv))+'。';}
        return subj(m[1])+'在'+vv+NP(tail)+'。';
      }},
      // 2. be 动词（here/there 开头的句子让位给下面的 here is/are 模板）
      // 保留 a/an/the 交给 phraseCN 处理，量词才不会被吃掉（这是猫 → 这是一只猫）
      {pat:/^this is (?:the )?(.+)$/,cn:m=>'这是'+NP(m[1])+'。'},
      {pat:/^that is (?:the )?(.+)$/,cn:m=>'那是'+NP(m[1])+'。'},
      {pat:/^these are (.+)$/,cn:m=>'这些是'+NP(m[1])+'。'},
      {pat:/^those are (.+)$/,cn:m=>'那些是'+NP(m[1])+'。'},
      {pat:new RegExp('^('+SUBJ+') is (.+)$'),cn:m=>{
        if(m[1]==='here'||m[1]==='there')return '';
        // 介词短语交给通用引擎（A cat is at the farm → 一只猫在这个农场，
        // 而不是"一只猫是 在 这个农场"）
        if(/^(?:at|in|on|under|by|near|behind|beside|over|around|with|from)\b/.test(m[2]))return '';
        return subj(m[1])+'是'+NP(m[2])+'。';
      }},
      {pat:new RegExp('^('+SUBJ+') are (.+)$'),cn:m=>{
        if(m[1]==='here'||m[1]==='there')return '';
        return subj(m[1])+'是'+NP(m[2])+'。';
      }},
      // 3. here is / here are
      {pat:/^here is (?:the |a |an )?(.+?) for the (.+)$/,cn:m=>'这是做'+NP(m[2])+'用的'+NP(m[1])+'。'},
      {pat:/^here are (?:the |a |an )?(.+?) for the (.+)$/,cn:m=>'这些是做'+NP(m[2])+'用的'+NP(m[1])+'。'},
      {pat:/^here is (?:the )?(.+)$/,cn:m=>'这是'+NP(m[1])+'。'},
      {pat:/^here are (?:the )?(.+)$/,cn:m=>'这些是'+NP(m[1])+'。'},
      {pat:/^here i am$/,cn:()=>'我在这里。'},
      // 4. have / has
      {pat:new RegExp('^('+SUBJ+') (?:have|has|had) (.+)$'),cn:m=>subj(m[1])+'有'+NP(m[2])+'。'},
      // 5. 情态动词
      {pat:/^mother (\w+) can (\w+)$/,cn:m=>{
        const short={duck:'鸭',hen:'鸡',cat:'猫',dog:'狗',pig:'猪',sheep:'羊',cow:'牛',horse:'马',bird:'鸟',fish:'鱼',rabbit:'兔',bear:'熊',monkey:'猴',frog:'蛙',duckling:'鸭',chick:'鸡',kitten:'猫',puppy:'狗'};
        return (short[m[1]]||NP(m[1]).replace(/子$/,''))+'妈妈会'+(this.gloss(m[2])||m[2])+'。';
      }},
      // can read to X
      {pat:new RegExp('^('+SUBJ+') can read to (.+)$'),cn:m=>subj(m[1])+'能读给'+this.familyCN(NP(m[2]))+'听。'},
      // can see X go over/in Y
      {pat:new RegExp('^('+SUBJ+') can see (.+?) go (over|in|on|under|around|across|through|into) (.+)$'),cn:m=>
        subj(m[1])+'能看到'+NP(m[2])+this.prepPhraseCN(m[3],NP(m[4]),true)+'。'},
      // can help V
      {pat:new RegExp('^('+SUBJ+') can help (.+)$'),cn:m=>{
        const inner=this.clauseCN(m[2])||this.joinL1(m[2]);
        return subj(m[1])+'能帮忙'+String(inner).replace(/。$/,'')+'。';
      }},
      // can + V + with + X
      {pat:new RegExp('^('+SUBJ+') can ('+VERB+') with (.+)$'),cn:m=>subj(m[1])+'能和'+NP(m[3])+'一起'+(this.gloss(m[2])||m[2])+'。'},
      // can + V + fast/slow（含 very）
      {pat:new RegExp('^('+SUBJ+') can not ('+VERB+') (very )?(fast|slow|high|far)$'),cn:m=>{
        const AM={fast:'快',slow:'慢',high:'高',far:'远'};
        return subj(m[1])+(FAST_VERB[this.verbBase(m[2])]||this.gloss(m[2])||m[2])+'不快。';
      }},
      {pat:new RegExp('^('+SUBJ+') can ('+VERB+') (very )?(fast|slow|high|far)$'),cn:m=>{
        const AM={fast:'快',slow:'慢',high:'高',far:'远'};
        const vv=FAST_VERB[this.verbBase(m[2])]||this.gloss(m[2])||m[2];
        return subj(m[1])+'能'+vv+'得'+(m[3]?'很':'')+AM[m[4]]+'。';
      }},
      {pat:new RegExp('^it can ('+VERB+') (very )?(fast|slow|high|far),? too$'),cn:m=>{
        const AM={fast:'快',slow:'慢',high:'高',far:'远'};
        const vv=FAST_VERB[this.verbBase(m[1])]||this.gloss(m[1])||m[1];
        return '它也能'+vv+'得'+(m[2]?'很':'')+AM[m[3]]+'。';
      }},
      {pat:new RegExp('^('+SUBJ+') can ('+VERB+')$'),cn:m=>subj(m[1])+'会'+(this.gloss(m[2])||m[2])+(DEFAULT_OBJ[this.verbBase(m[2])]||'')+'。'},
      // 6. like / love
      {pat:new RegExp('^('+SUBJ+') (?:like|likes|love|loves) to ('+VERB+')(.*)$'),cn:m=>{
        const isLove=/\blove/.test(m[0]);
        const vv=this.gloss(m[2])||m[2];
        const tail=m[3].trim();
        // 没有后续成分时让通用引擎处理：它会补默认宾语、优先取动词义
        //   （My grandpa likes to run → 我的爷爷喜欢跑步）
        if(!tail)return '';
        const wIdx=tail.split(' ').indexOf('with');
        if(wIdx>=0)return subj(m[1])+'喜欢和'+NP(tail.split(' ').slice(wIdx+1).join(' '))+'一起'+vv+'。';
        const tk=tail.split(' ').filter(x=>x&&x!=='too');   // 句末 too 不参与名词短语
        const pi=tk.findIndex(x=>['in','on','at','over','under','by','behind','near','around','into'].includes(x));
        const vb=this.verbBase(m[2]);
        if(pi>=0){
          const objs=tk.slice(0,pi);
          const np=NP(tk.slice(pi+1));
          const pp=this.prepPhraseCN(tk[pi],np);
          // play/sit/stand 不放 vFirst："在学校玩"比"玩在学校"自然
        const vFirst=['hide','go','come','jump','dig','climb','swing'].includes(vb);
          const objCN=NP(objs);
          return subj(m[1])+(isLove?'爱':'喜欢')+(vFirst?(vv+pp+objCN):(pp+vv+objCN))+'。';
        }
        return subj(m[1])+(isLove?'爱':'喜欢')+vv+NP(tail)+'。';
      }},
      {pat:new RegExp('^('+SUBJ+') (?:like|likes|love|loves) (.+)$'),cn:m=>{
        const isLove=/\blove/.test(m[0]);
        // "like to V" 让给上面的 to 模板 / 通用引擎处理，
        // 否则 'to swing' 会被当成名词短语 → "我喜欢秋千"
        if(/^to\s/.test(m[2]))return '';
        return subj(m[1])+(isLove?'爱':'喜欢')+NP(m[2])+'。';
      }},
      // 6b. want to V（I want to go out to play → 我想出去玩）
      // 必须放在 8c 前面，否则会被"主语+动词+宾语"误吞
      {pat:new RegExp('^('+SUBJ+') wants? to (.+)$'),cn:m=>{
        const inner=this.patternToCN(m[2],null)||this.clauseCN(m[2]);
        return subj(m[1])+'想'+String(inner||'').replace(/。$/,'')+'。';
      }},
      // 7. see / look
      {pat:new RegExp('^('+SUBJ+') can see (?:the |a |an )?(.+)$'),cn:m=>subj(m[1])+'能看到'+NP(m[2])+'。'},
      {pat:new RegExp('^('+SUBJ+') see (?:the |a |an )?(.+)$'),cn:m=>subj(m[1])+'看见'+NP(m[2])+'。'},
      // 8. 主语 + 动词 + 介词 + 地点（She walks by the pond → 她沿着池塘走）
      {pat:new RegExp('^('+SUBJ+') (\\w+) (by|in|on|at|over|under|near|behind|beside|into|onto|across|through|around) (.+)$'),cn:m=>{
        // be 动词 / 助动词在这一格里不是实义动词，否则
        //   "A cat is at the farm" 会被拼成"一只猫在这个农场是。"
        if(['is','are','am','was','were','be','can','cannot','could','will','would','do','does','did','have','has','had'].includes(m[2]))return '';
        const vv=this.gloss(m[2])||m[2];
        const np=NP(m[4]);
        const vb=this.verbBase(m[2]);
        // swim 不放 vFirst："在池塘里游泳"比"游泳在池塘里"自然
        const vFirst=['hide','fall','put','get','jump','fly','climb'].includes(vb);
        const pp=this.prepPhraseCN(m[3],np);
        return subj(m[1])+(vFirst?(vv+pp):(pp+vv))+'。';
      }},
      // 8b. 主语 + 动词 + and + 动词（She walks and walks → 她走啊走）
      {pat:new RegExp('^('+SUBJ+') (\\w+) and (\\w+)$'),cn:m=>{
        const vv=this.gloss(m[2])||m[2];
        const v2=this.lemma(m[3]);
        if(this.lemma(m[2])===v2)return subj(m[1])+vv+'啊'+vv+'。';
        return subj(m[1])+vv+'又'+(this.gloss(m[3])||m[3])+'。';
      }},
      // 8c. 主语 + 动词 + 宾语（We baked the pizza → 我们烤了披萨）
      {pat:new RegExp('^('+SUBJ+') (\\w+) (?:the |a |an )?(.+)$'),cn:m=>{
        const vb=this.verbBase(m[2]);
        if(!this.isVerbToken(m[2]))return '';
        // 不定式宾语（... to go / ... to play）交给 6b / 通用引擎处理，这里不吞
        if(/^to\s/.test(m[3]))return '';
        // can / is / have 等只作助动词，不是实义谓语，交给通用引擎
        if(['can','cannot','could','will','would','is','are','am','was','were','do','does','did','have','has','had'].includes(this.lemma(m[2])))return '';
        // 动词短语整体对照优先：blow up balloons → 吹气球（而非"吹向上气球"）
        const colObj=this.collocCN(vb,m[3].split(' ').filter(Boolean));
        if(colObj)return subj(m[1])+colObj+'。';
        const vv=this.gloss(m[2])||m[2];
        if(vb==='make'){
          const tk=m[3].split(' ');
          const w=tk.indexOf('with');
          if(w>0)return subj(m[1])+'用'+NP(tk.slice(w+1).join(' '))+'做'+NP(tk.slice(0,w).join(' '))+'。';
        }
        if(vb==='put'){
          const tk=m[3].split(' ');
          const pi=tk.findIndex(x=>['in','on','at','under','by','into'].includes(x));
          if(pi>0)return subj(m[1])+'把'+NP(tk.slice(0,pi).join(' '))+'放'+this.prepPhraseCN(tk[pi],NP(tk.slice(pi+1).join(' ')))+'。';
        }
        // 句中带介词短语时让通用引擎处理中文语序
        // （We read books at school → 我们在学校读书）
        if(m[3].split(' ').findIndex(x=>['in','on','at','under','by','behind','near','beside','around','into','with','for','to'].includes(x))>0)return '';
        return subj(m[1])+vv+NP(m[3])+'。';
      }},
      // （be + 形容词 已上移到模板头部，这里不再重复，避免被通用 be 模板抢先匹配）
      // 10. 疑问句
      {pat:/^what (?:is|are) this\??$/,cn:()=>'这是什么？'},
      {pat:/^what (?:is|are) (\w+)\??$/,cn:m=>(this.gloss(m[1])||m[1])+'是什么？'},
      {pat:/^where is (.+)\??$/,cn:m=>NP(m[1])+'在哪里？'},
      {pat:/^where are (.+)\??$/,cn:m=>NP(m[1])+'在哪里？'},
      {pat:/^can you (\w+)\??$/,cn:m=>'你会'+(this.gloss(m[1])||m[1])+'吗？'},
      {pat:/^do you like (\w+)\??$/,cn:m=>'你喜欢'+NP(m[1])+'吗？'},
      // 11. 系列/其余兜底
      {pat:/^out to play$/,cn:()=>'出去玩。'},
      {pat:/^flap,? flap,? fly$/,cn:()=>'拍拍翅膀飞。'},
      {pat:/^(\w+) that go fast$/,cn:m=>'跑得快的'+NP(m[1])+'。'}
    ];
    for(const t of templates){
      const m=s.match(t.pat);
      if(m){
        try{const r=t.cn(m);if(r)return r}catch(e){}
      }
    }
    // 12. 通用主谓引擎
    const gen=this.clauseCN(s);
    if(gen)return gen;
    // 13. 逐词兜底
    return this.joinL1(s);
  },

  // 书名整句翻译器（只在 TITLE_CN 对照表没命中时才走到这里）
  // ------------------------------------------------------------
  // 为什么单独做一层：书名是"缺主语的名词/动名词短语"，通用引擎按主谓句
  // 处理会拼出 "takingcare的这只狗" 这种英文粘连 + 语序错误的怪译。
  // 书名句必须整句翻译成自然中文，所以这里按书名常见的几种构式单独处理。
  titleCN(title){
    const raw=String(title||'').trim().replace(/[.!?]+$/,'');
    if(!raw)return '';
    const low=raw.toLowerCase().replace(/^(?:a|an|the)\s+/,'');
    // ① 固定动词短语 + 宾语：taking care of the dog → 照顾这只狗
    const PH={'taking care of':'照顾','take care of':'照顾','looking after':'照顾',
      'waiting for':'等待','riding on':'乘坐'};
    for(const k in PH){
      if(low.indexOf(k+' ')===0){
        const o=this.nounPhraseCN(low.slice(k.length+1));
        if(o&&!/[a-zA-Z]/.test(o))return PH[k]+o;
      }
    }
    // ② playing with the blocks → 一起玩积木（书名高频构式）
    if(low.indexOf('playing with ')===0){
      const o=this.nounPhraseCN(low.slice('playing with '.length));
      if(o&&!/[a-zA-Z]/.test(o))return '一起玩'+o;
    }
    // ③ trip/visit/walk/ride + to the X → 去X（A Trip to the Zoo → 去动物园）
    const m=low.match(/^(?:trip|visit|walk|ride|drive)\s+to\s+the\s+(.+)$/);
    if(m){const o=this.nounPhraseCN(m[1]);if(o&&!/[a-zA-Z]/.test(o))return '去'+o;}
    // ④ 整体当名词短语译一次（书名多为名词短语）
    const np=this.nounPhraseCN(low);
    if(np&&!/[a-zA-Z]/.test(np))return np;
    // ⑤ 通用引擎兜底
    return (this.patternToCN(raw,null)||this.joinL1(raw)||'').trim();
  },

  // 句子翻译：三层降级（L2模板 → 通用主谓引擎 → 逐词兜底）
  // 同时产出逐词释义，供"绘本原文"行点击查词使用
  translateSentence(en,vocab,pattern){
    if(!en)return{cn:'',words:[]};
    const rawWords=String(en).replace(/[^a-zA-Z'\s]/g,' ').split(/\s+/).filter(w=>w.length>0);
    const words=rawWords.map(w=>({word:w,cn:this.gloss(w)||''}));
    const cn=this.patternToCN(en,vocab)||this.joinL1(en);
    return{cn:cn||'',words};
  },
  // 整本书分析：词汇 / 句型 / 难度 / 句子切分 / 逐句中文翻译
  analyze(book){
    const vocab=this.extractVocab(book.rawText);
    const pattern=this.detectPattern(book.rawText);
    const theme=book.theme||this.detectTheme(vocab);
    const level=book.level||this.assessLevel(book.rawText,vocab);
    // 句子切分：传入书名，保证"书名行"被正确识别为第 1 句并**保留**在原文列里
    // （不拆分、不隐藏——书名行就是原文列的第一行，并显示中文翻译）
    const sentences=this.split(book.rawText,book.title);
    // 两套归一化：
    //   norm  —— 只去标点，用于查 TITLE_CN 书名对照表
    //   loose —— 再去掉冠词 a/an/the，用于判断"这一行是不是书名行"
    //            （原文常写 "Going on Vacation"，而书名字段是 "Going On A Vacation"）
    const norm=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const loose=t=>String(t||'').toLowerCase().replace(/\b(?:a|an|the)\b/g,'').replace(/[^a-z0-9]/g,'');
    const titleNorm=norm(book.title);
    const titleLoose=loose(book.title);
    // 兜底：书名行必须出现在"绘本原文"列的第 1 行（整句、不拆分）。
    // 若原文里本来就没有书名行（私有库/批量导入时书名在独立字段），
    // 这里把书名补到第 1 位，保证每一本书的第 1 行都是书名。
    const titleText=String(book.title||'').trim();
    if(titleText&&/[a-zA-Z]/.test(titleText)){
      const firstLoose=loose(sentences[0]||'');
      const isTitleLine=firstLoose&&(firstLoose===titleLoose||firstLoose.startsWith(titleLoose)||titleLoose.startsWith(firstLoose));
      if(!isTitleLine)sentences.unshift(titleText.replace(/[.!?]+$/,'').trim());
    }
    const sentenceTranslations=sentences.map((s,i)=>{
      const tr=this.translateSentence(s,vocab,pattern);
      // 第 1 句 = 书名行：优先用书名中文对照表，保证译名统一、自然
      if(i===0&&titleNorm){
        const sLoose=loose(s);
        if(sLoose&&(sLoose===titleLoose||sLoose.startsWith(titleLoose)||titleLoose.startsWith(sLoose))){
          // 先查 68 本对照表（保证基线库译名统一），未命中再走书名专用翻译器
          const tcn=TITLE_CN[titleNorm]||this.titleCN(s);
          tr.cn=(tcn||tr.cn||book.title).replace(/[。！!]$/,'')+'。';
        }
      }
      return tr;
    });
    return{...book,vocab,pattern,theme,level,sentences,sentenceTranslations,
      wordCount:book.rawText.split(/\s+/).length,analyzed:true,analysisVer:ANALYSIS_VERSION};
  }
};

// ==================== DEDUP ENGINE (去重引擎) ====================
const Dedup = {
  // 文本归一化：小写+去标点+分词
  normalize(text){
    return(text||'').toLowerCase().replace(/[^a-z\s']/g,'').split(/\s+/).filter(w=>w.length>0);
  },
  // Jaccard相似度：交集词数/并集词数
  jaccard(text1,text2){
    const w1=new Set(this.normalize(text1));
    const w2=new Set(this.normalize(text2));
    if(w1.size===0&&w2.size===0)return 1;
    if(w1.size===0||w2.size===0)return 0;
    let inter=0;
    w1.forEach(w=>{if(w2.has(w))inter++});
    return inter/(w1.size+w2.size-inter);
  },
  // 查找重复：返回 {level:'L1'/'L2'/'L3'/'none', match:book}
  // strictness: 'strict'(仅L2) / 'standard'(L2+L3>0.85) / 'loose'(L3>0.7)
  findDuplicate(book,books,strictness){
    strictness=strictness||(appData.dedup?appData.dedup.strictness:'standard')||'standard';
    const threshold=strictness==='loose'?0.7:0.85;
    for(const b of books){
      // L1: id完全相同
      if(book.id&&b.id===book.id)return{level:'L1',match:b};
      // L2: 书名+系列都相同（忽略大小写）
      if(book.title&&b.title&&book.series&&b.series){
        if(book.title.toLowerCase()===b.title.toLowerCase()&&book.series.toLowerCase()===b.series.toLowerCase()){
          return{level:'L2',match:b};
        }
      }
    }
    // L3: 原文相似度（仅standard/loose模式）
    if(strictness!=='strict'){
      for(const b of books){
        if(!book.rawText||!b.rawText)continue;
        const sim=this.jaccard(book.rawText,b.rawText);
        if(sim>=threshold)return{level:'L3',match:b,similarity:sim};
      }
    }
    return{level:'none'};
  },
  // 合并学习进度：把delBook的进度合并到keepBook
  mergeProgress(keepBook,delBook){
    if(!delBook)return keepBook;
    const hasProgress=delBook.readCount>0||(delBook.status&&delBook.status!=='unlearned');
    if(!hasProgress)return keepBook;
    keepBook.readCount=Math.max(keepBook.readCount||0,delBook.readCount||0);
    const rank={mastered:3,learning:2,unlearned:1};
    keepBook.status=(rank[keepBook.status]||0)>=(rank[delBook.status]||0)?keepBook.status:delBook.status;
    if(!keepBook.history)keepBook.history=[];
    if(delBook.history&&delBook.history.length>0)keepBook.history=[...keepBook.history,...delBook.history];
    const kLast=keepBook.lastRead?new Date(keepBook.lastRead):null;
    const dLast=delBook.lastRead?new Date(delBook.lastRead):null;
    if(dLast&&(!kLast||dLast>kLast))keepBook.lastRead=delBook.lastRead;
    return keepBook;
  },
  // 全库扫描：返回重复组数组
  scanAll(books){
    const groups=[];
    const used=new Set();
    for(let i=0;i<books.length;i++){
      if(used.has(books[i].id))continue;
      const group=[books[i]];
      for(let j=i+1;j<books.length;j++){
        if(used.has(books[j].id))continue;
        const dup=this.findDuplicate(books[j],group,'standard');
        if(dup.level!=='none'){
          group.push(books[j]);
          used.add(books[j].id);
        }
      }
      if(group.length>1){
        groups.push(group);
        group.forEach(b=>used.add(b.id));
      }
    }
    return groups;
  }
};

// ==================== CONTENT GENERATOR ====================
const Generator = {
  // 生成句的整句中文 —— 复用 Analyzer 的翻译引擎，失败返回空串
  cnOf(en){

  },
  generate(book,allBooks,learnedWords){
    const analyzed=book.analyzed?book:Analyzer.analyze(book);
    const vocab=analyzed.vocab;

    const newWords=vocab.filter(v=>!learnedWords||!learnedWords.has(v.word));
    const extensions=this.genExtensions(pattern,theme,vocab,knownWords);
    const script=this.genScript(theme,vocab,newWords,pattern,analyzed.sentences);
    const games=this.matchGames(theme,pattern,vocab);
    const related=this.findRelated(analyzed,allBooks);
    return{extensions,script,games,related,knownWords,newWords};
  },
  genExtensions(pattern,theme,vocab,knownWords){
    const ext=[];

    // 通用过滤函数：剔除不在 VOCAB_DB 或已在本书词表里的词

    const NO_FLY=new Set(['dog','cat','bear','puppy','rabbit','cow','pig','sheep','turtle','snake','ant','spider','fox','hen','chick']);
    // 会飞的动物
    const CAN_FLY=new Set(['bird','bee','owl','bat']);
    // 没有轮子的交通工具
    const NO_WHEELS=new Set(['boat','ship']);

    // Strategy 1: Pattern substitution（句型替换）— 仅处理单___模板
    if(pattern&&pattern.includes('___')){
      const slotCount=(pattern.match(/___/g)||[]).length;
      if(slotCount===1){
        // 单___: 安全替换
        const lowerPat=pattern.toLowerCase();
        const slotIdx=lowerPat.indexOf('___');
        const beforeSlot=lowerPat.slice(0,slotIdx).trim().split(/\s+/).pop()||'';
        const isVerbPosition=/^(can|do|does|did|will|would|should)$/.test(beforeSlot);
        const isPrepTo=beforeSlot==='to';
        // 「to」有两种身份，必须分开判断：
        //   like to / want to / love to … → 不定式标记，槽位要填【动词】
        //   go to / come to / point to …   → 介词，槽位要填【名词】
        // 旧代码一律当介词走地点名词池，于是生成 "I like to home / I like to kitchen"
        // 这种语法错误的英语 —— 家长会照着念，比不生成更糟。
        const toOwner=lowerPat.slice(0,slotIdx).trim().split(/\s+/).slice(-2)[0]||'';
        const isInfTo=isPrepTo&&/^(like|likes|want|wants|love|loves|try|tries|learn|learns|need|needs|hope|hopes|begin|begins|start|starts|forget|forgets|help|helps)$/.test(toOwner);
        // 检查___前2-3个词内是否已有冠词/代词（解决"the funny ___"中间隔形容词的问题）
        const wordsBeforeSlot=lowerPat.slice(0,slotIdx).trim().split(/\s+/).slice(-3);
        const hasDeterminerNearby=wordsBeforeSlot.some(w=>/^(a|an|the|my|your|his|her|our|their|this|that|these|those|some)$/.test(w));
        // === 修复①：槽位前 2-3 词内是否含介词（含 by/in/at/on/under/over/near 等），决定走地点名词池 ===
        const hasPrepNearby=wordsBeforeSlot.some(w=>PREP_WORDS.has(w));

        // === 核心修复①：根据槽位类型选不同词池 ===
        // 动词位(can/will/do...) → 走主题动词池
        // 介词位(by/in/at/on 后的宾语) → 走地点名词池（排除一切动词）
        // 其他名词位 → 走主题名词池（剔除"动作"主题）
        let pool;

    if(pattern&&pattern.includes('___')&&pattern.includes('This is')){

        else if(isNoun)fb={en:(this.isUncountable(n)?('What is this? It is '+n+'.'):('What is this? It is '+this.addArticle(n)+'.')),cn:'这是什么？是'+cnN+'。'};
