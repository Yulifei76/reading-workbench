  toggleTeachOutput(w){
    const idx=this.teachCheckinData.outputs.indexOf(w);
    if(idx>-1){this.teachCheckinData.outputs.splice(idx,1)}else{this.teachCheckinData.outputs.push(w)}
    document.querySelectorAll('#teach-output-words button').forEach(btn=>{
      btn.classList.toggle('btn-brand',this.teachCheckinData.outputs.includes(btn.textContent));
      btn.classList.toggle('btn-ghost',!this.teachCheckinData.outputs.includes(btn.textContent));
    });
  },
  teachNext(total){teachModeStep++;this.renderTeachStep(teachModeGen.script)},
  teachPrev(){teachModeStep--;this.renderTeachStep(teachModeGen.script)},
  closeTeach(){
    $('#teach-overlay').classList.remove('active');
    TTS.stop();
    // 恢复底部导航栏（仍在详情页时保持隐藏，否则恢复）
    const navBar=$('.bottom-nav');
    if(navBar)navBar.style.display=(currentPage==='detail')?'none':'';
  },
  // 【打卡归集】—— 修复"一天读多本，只留最后一本"（P0）
  // 旧代码 checkins[date]={...} 是整体覆盖：一天读 3 本，前 2 本记录被冲掉，
  // 打卡日历里"每天读了几本书、什么书"直接失真。改为按天归集 + 合并去重。
  recordCheckin(dateStr,payload){
    const c=appData.checkins[dateStr]||(appData.checkins[dateStr]={books:[],outputs:[],duration:0,mode:'',note:''});
    c.books=c.books||[];c.outputs=c.outputs||[];
    const bk=payload.book;
    if(bk){
      const ex=c.books.find(x=>x.title===bk.title);
      if(ex){ex.status=bk.status;ex.duration=(ex.duration||0)+(bk.duration||0);ex.times=(ex.times||1)+1;}
      else c.books.push({title:bk.title,status:bk.status,duration:bk.duration||0,times:1});
    }
    (payload.outputs||[]).forEach(w=>{if(!c.outputs.includes(w))c.outputs.push(w)});
    c.duration=(c.duration||0)+(payload.duration||0);
    if(payload.mode)c.mode=payload.mode;
    if(payload.note)c.note=payload.note;
    return c;
  },
  finishTeach(){
    const book=getBook(currentBookId);
    const data=this.teachCheckinData;
    book.readCount=(book.readCount||0)+1;
    book.lastRead=LDate.today();
    book.history=book.history||[];
    book.history.push({date:LDate.today(),action:'伴读完成',status:data.status,duration:5});
    if(data.status==='mastered')book.status='mastered';
    else if(book.status==='unlearned')book.status='learning';
    if(!appData.todayProgress.books.includes(book.id))appData.todayProgress.books.push(book.id);
    // 保存输出词汇
    if(data.outputs.length>0){
      appData.outputWords=appData.outputWords||[];
      data.outputs.forEach(w=>{
        const existing=appData.outputWords.find(ow=>ow.word===w);
        if(!existing){
          appData.outputWords.push({word:w,cn:'',theme:book.theme,status:'active',stars:1,lastReview:book.lastRead,nextReview:this.getNextReviewDate(1)});
        }
      });
      data.outputs.forEach(w=>{if(!appData.learnedWords.includes(w))appData.learnedWords.push(w)});
    }
    // 保存打卡记录（按当天归集，同一天读多本不再互相覆盖）
    this.recordCheckin(book.lastRead,{
      book:{title:book.title,status:data.status,duration:5},
      outputs:data.outputs,
      mode:'teach',
      duration:5,
      note:$('#teach-note')?$('#teach-note').value:''
    });
    // 连续打卡按"自然日去重"重算 —— 同一天读 2 本不会 +2
    recalcStreak();
    save();
    this.closeTeach();
    this.showPage('today');
    const msg=data.outputs.length>0?`🎉 伴读完成！输出${data.outputs.length}个词`:toast('🎉 伴读完成！记得明天复习哦');
    toast(data.outputs.length>0?`🎉 伴读完成！输出${data.outputs.length}个词`:msg);
  },
  // ===== Schedule Page =====

        :chunks.map((chunk,wi)=>`<div class="week-card">
        <div class="wc-header"><span>第${wi+1}周 · ${fmtDate(chunk[0].date)} ~ ${fmtDate(chunk[chunk.length-1].date)}</span><span style="font-size:11px;color:var(--text-muted)">${chunk.reduce((s,d)=>s+d.newBooks.length,0)}本新书</span></div>
        ${chunk.map(d=>{
          const isToday=d.date===today;
          // 今天用真实到期数据，未来用预演
          const reviews=isToday?Plan.dueReviewBooks():(d.reviewBooks||[]);
          const parts=[];
          d.newBooks.forEach(b=>parts.push('🆕 '+b.title));

  saveQuickCheckin(){
    const d=this.checkinData;
    if(!d.status){toast('⚠️ 请选择学习状态');return}
    if(!d.time){toast('⚠️ 请选择阅读时长');return}
    const todayStr=LDate.today();
    const book=getAnalyzedBook(currentBookId)||getAllBooks()[0];
    // 更新书的阅读记录
    if(book){
      book.readCount=(book.readCount||0)+1;
      book.lastRead=todayStr;
      book.history=book.history||[];
      book.history.push({date:todayStr,action:'打卡',status:d.status,duration:d.time,outputs:d.words});
      if(d.status==='mastered')book.status='mastered';
      else if(d.status==='learning'||d.status==='hard')book.status='learning';
    }
    // 更新输出词汇
    if(d.words.length>0){
      appData.outputWords=appData.outputWords||[];
      d.words.forEach(w=>{
        const existing=appData.outputWords.find(ow=>ow.word===w);
        if(!existing){
          appData.outputWords.push({word:w,cn:'',theme:book?book.theme:'',status:d.mode||'follow',stars:1,lastReview:todayStr,nextReview:this.getNextReviewDate(1)});
        }
      });
      // 同步到learnedWords
      d.words.forEach(w=>{if(!appData.learnedWords.includes(w))appData.learnedWords.push(w)});
    }
    // 保存打卡记录（按当天归集，同一天读多本不再互相覆盖）
    this.recordCheckin(todayStr,{
      book:book?{title:book.title,status:d.status,duration:d.time}:null,
      outputs:d.words,
      mode:d.mode,
      duration:d.time,
      note:d.note||''
    });
    // 更新今日进度
    if(book&&!appData.todayProgress.books.includes(book.id))appData.todayProgress.books.push(book.id);
    // 连续打卡按"自然日去重"重算 —— 同一天读 2 本不会 +2
    recalcStreak();
    save();
    this.closeQuickCheckin();
    this.renderCheckin();
    toast('🎉 打卡成功！'+(d.words.length>0?'输出'+d.words.length+'个词':''));
  },
  getNextReviewDate(stars){
    const intervals={1:1,2:2,3:4,4:7,5:15};

    const d=new Date();d.setDate(d.getDate()+days);
    return LDate.fmt(d);

  async runOCR(file,source){
    if(!file){toast('未选择图片');return}
    const statusEl=$('#ocr-status');
    statusEl.innerHTML='<div class="spinner"></div><div style="margin-top:8px;font-size:13px" id="ocr-progress">🔍 正在准备识别...</div>';
    try{
      // 按需加载 OCR 引擎：只有走到这一步才去下载 tesseract.js，
      // 首屏不再为它买单（原先写在 <head> 里同步加载，弱网下会白屏十几秒）。
      statusEl.querySelector('#ocr-progress').textContent='⏳ 正在加载 OCR 引擎（首次约需几秒）...';
      try{ await LibLoader.tesseract(); }
      catch(e){
        statusEl.innerHTML='<div style="padding:12px;color:var(--danger);font-size:13px;line-height:1.7">'
          +'⚠️ OCR 引擎加载失败，请检查网络后重试<br>'
          +'<span style="color:var(--text-muted)">也可以改用「书名匹配」或「Excel 导入」的方式添加绘本</span></div>';
        return;
      }
      // 图片预处理：通过canvas进行灰度化+对比度增强，提升识别率
      const processedImage=await this.preprocessImage(file);
      statusEl.querySelector('#ocr-progress').textContent='🔍 正在识别文字... 0%';
      const result=await Tesseract.recognize(processedImage,'eng',{
        logger:m=>{
          if(m.status==='recognizing text'){
            const el=statusEl.querySelector('#ocr-progress');
            if(el)el.textContent='🔍 正在识别文字... '+Math.round(m.progress*100)+'%';
          }
        }
      });
      let text=result.data.text||'';
      // 清理OCR噪点
      text=text.replace(/[^a-zA-Z\s.,!?'\-]/g,' ').replace(/\n{3,}/g,'\n\n').trim();
      // 分析识别质量
      const quality=this.checkOCRQuality(text);
      // 尝试从识别文本中提取可能的书名
      const titleGuess=this.guessTitleFromOCR(text);
      // 检查是否有预装书匹配
      const matchedBook=titleGuess?PRESET_BOOKS.find(b=>b.title.toLowerCase()===titleGuess.toLowerCase()||b.title.toLowerCase().includes(titleGuess.toLowerCase())):null;
      if(matchedBook){
        // 直接用预装书的完整原文
        statusEl.innerHTML=`<div style="color:var(--success);margin-bottom:8px">✅ 识别成功！匹配到《${matchedBook.title}》</div>`;
        this.showAddForm('ocr');
        $('#new-book-title').value=matchedBook.title;
        $('#new-book-series').value=matchedBook.series;
        $('#new-book-text').value=matchedBook.rawText;
        toast('✅ 匹配到预装绘本，已自动填充完整原文！');
      }else if(quality==='good'&&text.length>=20){
        // 识别成功，填充文本
        statusEl.innerHTML=`<div style="color:var(--success);margin-bottom:8px">✅ 识别成功！共${text.length}个字符</div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">识别内容预览：${text.slice(0,60)}...</div>`;
        this.showAddForm('ocr');
        $('#new-book-text').value=text;
        if(titleGuess)$('#new-book-title').value=titleGuess;
        toast('识别完成，请检查并补充书名');
      }else{
        // 识别质量差，引导用户使用书名匹配
        statusEl.innerHTML=this.renderOCRFallback(titleGuess,text);
      }
    }catch(err){
      statusEl.innerHTML=this.renderOCRFallback('','',[`识别失败：${err.message||'未知错误'}`]);
    }
  },
  // 检测OCR识别质量
  checkOCRQuality(text){
    if(!text||text.length<10)return 'bad';
    // 统计有效单词（长度>=2的词）
    const words=text.split(/\s+/).filter(w=>w.length>=2);
    // 统计碎片（单个字母）
    const fragments=text.split(/\s+/).filter(w=>w.length===1).length;
    // 有效单词占比
    const wordRatio=words.length/(words.length+fragments);
    // 如果有效单词占比低于60%，判定为质量差
    if(wordRatio<0.6)return 'bad';
    // 如果总词数少于5个，判定为质量差
    if(words.length<5)return 'bad';
    return 'good';
  },
  // 渲染OCR失败后的引导界面
  renderOCRFallback(titleGuess,rawText,errors){
    const errorHTML=errors&&errors.length>0?`<div style="color:var(--danger);margin-bottom:8px">${errors.map(e=>'⚠️ '+e).join('<br>')}</div>`:'';
    const previewHTML=rawText&&rawText.length>0?`<div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;padding:8px;background:var(--surface-muted);border-radius:6px">识别内容：${rawText.slice(0,80)}...</div>`:'';
    return `${errorHTML}
    <div style="color:var(--warning);margin-bottom:8px;font-weight:600">⚠️ 识别效果不理想</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">可能原因：拍的是封面/图片不清晰/光线不足</div>
    ${previewHTML}
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">🎯 推荐改用书名匹配（更准确）：</div>
    <input class="af-input" id="ocr-title-guess" placeholder="输入英文书名，如：At the Market" value="${titleGuess}" style="margin-bottom:8px" onkeyup="if(event.key==='Enter')UI.matchBookByTitle(this.value)">
    <button class="btn btn-brand btn-block" style="margin-bottom:8px" onclick="UI.matchBookByTitle($('#ocr-title-guess').value)">🔍 按书名匹配</button>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="UI.showISBNMatch()">📚 浏览可选书目</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="UI.showOCRImport()">📷 重新拍照</button>
    </div>`;
  },
  // 图片预处理：灰度化+对比度增强
  preprocessImage(file){
    return new Promise((resolve)=>{
      const reader=new FileReader();
      reader.onload=e=>{
        const img=new Image();
        img.onload=()=>{
          const canvas=document.createElement('canvas');
          // 缩放到合适尺寸（最大宽度1200px，保持比例）
          const maxWidth=1200;
          const scale=Math.min(1,maxWidth/img.width);
          canvas.width=img.width*scale;
          canvas.height=img.height*scale;
          const ctx=canvas.getContext('2d');
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          // 灰度化+对比度增强
          const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
          const data=imageData.data;
          for(let i=0;i<data.length;i+=4){
            const gray=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
            // 对比度增强：将灰度值向黑白两端拉伸
            const enhanced=gray<128?Math.max(0,gray-30):Math.min(255,gray+30);
            data[i]=data[i+1]=data[i+2]=enhanced;
          }
          ctx.putImageData(imageData,0,0);
          canvas.toBlob(blob=>resolve(blob),'image/png',0.9);
        };
        img.src=e.target.result;
      };
      reader.readAsDataURL(file);
    });
  },
  // 从OCR文本中猜测书名
  guessTitleFromOCR(text){
    const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>0&&l.length<30);
    // 找最短的行作为可能的书名
    if(lines.length===0)return '';
    const shortest=lines.reduce((a,b)=>a.length<=b.length?a:b);
    // 过滤掉句子（含空格超过3个词的不太可能是书名）
    const words=shortest.split(/\s+/);
    if(words.length<=4)return shortest;
    return '';
  },

  async runExcelImport(file){
    if(!file){toast('未选择文件');return}
    const statusEl=$('#excel-status');
    statusEl.innerHTML='<div class="spinner"></div><div style="margin-top:8px;font-size:13px">📊 正在读取Excel...</div>';
    try{
      // 按需加载 Excel 解析库：首次使用才下载，不再让所有用户为它阻塞首屏
      try{ await LibLoader.xlsx(); }
      catch(e){ statusEl.innerHTML='<div style="color:var(--danger)">⚠️ Excel 解析库加载失败，请检查网络后重试</div>'; return; }
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(rows.length===0){statusEl.innerHTML='<div style="color:var(--danger)">⚠️ Excel中没有数据</div>';return}
      // 校验必填列
      if(!rows[0].title&&!rows[0].Title){statusEl.innerHTML='<div style="color:var(--danger)">⚠️ 缺少必填列：title</div>';return}
      if(!rows[0].rawText&&!rows[0].RawText&&!rows[0].text&&!rows[0].Text){statusEl.innerHTML='<div style="color:var(--danger)">⚠️ 缺少必填列：rawText</div>';return}
      let added=0,failed=0;
      for(const row of rows){
        const title=(row.title||row.Title||'').trim();
        const text=(row.rawText||row.RawText||row.text||row.Text||'').trim();
        if(!title||!text){failed++;continue}
        const series=(row.series||row.Series||'自定义绘本').trim();
        const id='custom-'+Date.now()+'-'+added;
        const book={id,title,series,rawText:text,source:'private'};
        const analyzed=Analyzer.analyze(book);
        book.status='unlearned';book.readCount=0;book.lastRead=null;book.history=[];
        Object.assign(book,analyzed);
        appData.customBooks.push(book);
        added++;
      }
      save();
      statusEl.innerHTML=`<div style="color:var(--success);font-weight:600">✅ 导入成功：${added}本绘本</div>${failed>0?'<div style="color:var(--warning);font-size:12px;margin-top:4px">⚠️ '+failed+'本因数据不完整被跳过</div>':''}<button class="btn btn-brand btn-block" style="margin-top:10px" onclick="UI.showPage('library');UI.renderLibrary()">📚 查看绘本库</button>`;
      toast('✅ 成功导入'+added+'本绘本');
    }catch(err){
      statusEl.innerHTML='<div style="color:var(--danger)">⚠️ 读取失败：'+(err.message||'未知错误')+'</div>';
    }
  },

  _ensureOutputWords(){
    let changed=false;
    if(!appData.outputWords||!Array.isArray(appData.outputWords)){
      // 不存在则从 learnedWords 初始化 (requirement #9)
      const learned=appData.learnedWords||[];
      const todayStr=LDate.today();
      appData.outputWords=learned.map(w=>{
        const info=this._lookupWordInfo(w);
        return{word:w,cn:info.cn,theme:info.theme,status:'follow',stars:1,lastReview:todayStr,nextReview:this.getNextReviewDate(1)};
      });
      changed=true;
    }
    // 迁移字符串条目 (旧 recordOutput 推送的是字符串) 到对象形式
    for(let i=0;i<appData.outputWords.length;i++){
      if(typeof appData.outputWords[i]==='string'){
        const w=appData.outputWords[i];
        const info=this._lookupWordInfo(w);
        const todayStr=LDate.today();
        appData.outputWords[i]={word:w,cn:info.cn,theme:info.theme,status:'active',stars:1,lastReview:todayStr,nextReview:this.getNextReviewDate(1)};
        changed=true;
      }
    }
    if(changed)save();
  },
  _lookupWordInfo(word){
    // 先从已分析绘本的词汇中查 cn 和 theme
    const allBooks=getAllBooks();
    for(const b of allBooks){
      const ab=getAnalyzedBook(b.id);
      if(ab&&ab.vocab){
        const v=ab.vocab.find(x=>x.word===word);
        if(v)return{cn:v.cn,theme:v.theme||b.theme||'其他'};
      }
    }
    // 兜底：用 VOCAB_DB 和 THEME_KEYWORDS
    if(typeof VOCAB_DB!=='undefined'&&VOCAB_DB[word]){
      let theme='其他';
      if(typeof THEME_KEYWORDS!=='undefined'){
        for(const[t,kws]of Object.entries(THEME_KEYWORDS)){if(kws.includes(word)){theme=t;break}}
      }
      return{cn:VOCAB_DB[word],theme};
    }
    return{cn:'',theme:'其他'};
  },

              <button class="btn" style="flex:1;background:rgba(232,70,58,.15);color:var(--danger)" onclick="UI.reviewFeedback('${escapeWord}','unknown')">😢 没认出</button>

  reviewFeedback(wordId,action){
    const w=(appData.outputWords||[]).find(o=>o.word===wordId);
    if(!w){toast('⚠️ 词汇不存在');return}
    const today=LDate.today();
    let stars=w.stars||1;
    if(action==='known'){
      // 认出了：stars+1 (最高5)，间隔拉长
      stars=Math.min(5,stars+1);
      w.status='active';
    }else if(action==='unknown'){
      // 没认出：stars-1 (最低1)，缩短到1天后
      stars=Math.max(1,stars-1);
      w.status='follow';
      w.nextReview=this.getNextReviewDate(1);
    }
    // 'forgot'：stars不变，间隔不变（用当前 stars 的间隔）
    if(action!=='unknown'){
      w.nextReview=this.getNextReviewDate(stars);
    }
    w.stars=stars;
    w.lastReview=today;
    save();
    const msg=action==='known'?`✅ ${w.word} 掌握度+1`
            :action==='forgot'?`🤔 ${w.word} 继续保持`
            :`😢 ${w.word} 明天再复习`;
    toast(msg);
    this._reviewIdx++;
    this._showReviewCard();
  },
  closeReviewGame(){
    const m=$('#review-modal');
    if(m)m.remove();
    this._reviewQueue=null;
    this._reviewIdx=0;
  },
  _finishReview(){
    this.closeReviewGame();
    toast('🎉 复习完成！继续加油');
    this.renderVocab();

  updateBabyName(name){
    const trimmed=(name||'').trim();
    // 验证1：非空
    if(!trimmed){toast('⚠️ 昵称不能为空');return}
    // 验证2：长度限制（1-10字符）
    if(trimmed.length>10){toast('⚠️ 昵称最多10个字符');return}
    // 验证3：不含特殊符号（仅允许中文、字母、数字）
    if(/[<>\\\/&*?{}|$]/.test(trimmed)){toast('⚠️ 昵称不能包含特殊符号');return}
    appData.babyName=trimmed;save();toast('✅ 已更新昵称');
  },
  updateStartDate(date){
    // 验证1：非空
    if(!date){toast('⚠️ 请选择日期');return}
    const inputDate=new Date(date+'T00:00:00');
    // 验证2：有效日期
    if(isNaN(inputDate.getTime())){toast('⚠️ 日期格式无效');return}
    const today=new Date();today.setHours(0,0,0,0);
    // 验证3：不能晚于今天+1天（允许时区差异）
    if(inputDate>new Date(today.getTime()+86400000)){toast('⚠️ 开始日期不能晚于明天');return}
    // 验证4：不能早于2020年（合理下限）
    const minDate=new Date('2020-01-01T00:00:00');
    if(inputDate<minDate){toast('⚠️ 开始日期不能早于2020年');return}
    appData.startDate=date;save();toast('✅ 已更新开始日期');

    // 导出前查重

    if(groups.length>0){
      let totalDups=0;
      groups.forEach(g=>totalDups+=g.length-1);
      if(!confirm('⚠️ 基线库内有'+totalDups+'本重复绘本（'+groups.length+'组）\n\n建议先清理重复再导出。\n\n是否仍然导出？（重复绘本也会被导出）'))return;
    }
    const BL=window.BASELINE_BOOKS||{version:0,books:[]};
    const newVersion=Math.max(BL.version,appData.baselineVersion||0)+1;
    const today=LDate.today();
    const booksStr=blBooks.map(b=>{
      return '    {id:\''+b.id+'\',title:'+JSON.stringify(b.title)+',series:'+JSON.stringify(b.series)+',level:\''+b.level+'\',theme:'+JSON.stringify(b.theme)+',rawText:'+JSON.stringify(b.rawText)+'}';

// 基线库数据文件 (Baseline Books)
// ============================================================
// 用途：平台预置的绘本数据，由开发者维护
// 格式：每本书只有最原始的5个字段，词汇/句型/难度由Analyzer自动分析

// 对比：私有库书籍由用户通过"添加绘本"功能上传，存在localStorage
// ============================================================

window.BASELINE_BOOKS = {
  version: ${newVersion},
  updated: '${today}',
  books: [
${booksStr}
  ]
};`;
    const blob=new Blob([content],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='baseline_books.js';a.click();
    URL.revokeObjectURL(url);
    appData.baselineVersion=newVersion;
    save();
    toast('✅ 已导出 '+blBooks.length+' 本基线绘本（v'+newVersion+'）');

  async runBaselineExcel(file){
    if(!file){toast('未选择文件');return}
    const statusEl=$('#bl-excel-status');
    statusEl.innerHTML='<div class="spinner"></div><div style="margin-top:8px;font-size:13px">📊 正在读取Excel...</div>';
    try{
      // 按需加载 Excel 解析库（同 runExcelImport）
      try{ await LibLoader.xlsx(); }
      catch(e){ statusEl.innerHTML='<div style="color:var(--danger)">⚠️ Excel 解析库加载失败，请检查网络后重试</div>'; return; }
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(rows.length===0){statusEl.innerHTML='<div style="color:var(--danger)">⚠️ Excel中没有数据</div>';return}
      if(!rows[0].title&&!rows[0].Title){statusEl.innerHTML='<div style="color:var(--danger)">⚠️ 缺少必填列：title</div>';return}
      if(!rows[0].rawText&&!rows[0].RawText&&!rows[0].text&&!rows[0].Text){statusEl.innerHTML='<div style="color:var(--danger)">⚠️ 缺少必填列：rawText</div>';return}
      const parsed=[];
      for(const row of rows){
        const title=(row.title||row.Title||'').trim();
        const text=(row.rawText||row.RawText||row.text||row.Text||'').trim();
        if(!title||!text){parsed.push({title,rawText:text,series:'',status:'failed',reason:'数据不完整'});continue}
        const series=(row.series||row.Series||'').trim()||'未分类系列';
        const tempBook={title,series,rawText:text};
        const analyzed=Analyzer.analyze(tempBook);
        // 拦截点3：批量导入查重
        const allBooks=getAllBooks();
        const dup=Dedup.findDuplicate(tempBook,allBooks,'standard');
        if(dup.level!=='none'){
          parsed.push({...analyzed,status:'duplicate',reason:'与《'+dup.match.title+'》重复',dupLevel:dup.level,dupMatch:dup.match});
        }else{
          parsed.push({...analyzed,status:'success',reason:''});
        }
      }
      this._batchBooks=parsed;
      this.renderBatchResultList();
    }catch(err){
      statusEl.innerHTML='<div style="color:var(--danger)">⚠️ 读取失败：'+(err.message||'未知错误')+'</div>';
    }
  },
  // ===== 文本粘贴导入 =====
  showBaselineBatchText(){
    const html=`
      <div class="add-header">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px;opacity:.8" onclick="UI.showBaselineImportMenu()">←</span><div class="ah-title">📝 文本粘贴导入</div></div>
        <div style="font-size:12px;opacity:.8;margin-top:2px">用===分隔每本绘本</div>
      </div>
      <div class="add-form">
        <div class="card card-pad" style="margin-bottom:10px;background:#FEF3C7;border-color:#FCD34D">
          <div style="font-size:12px;font-weight:600;color:#92400E;margin-bottom:6px">📝 格式说明</div>
          <div style="font-size:11px;color:#B45309;line-height:1.6">
            每本绘本用 <code style="background:#fff;padding:1px 4px;border-radius:3px">===</code> 分隔<br>
            第一行：书名<br>
            第二行：系列<br>
            第三行起：英文原文
          </div>
        </div>
        <textarea class="af-input af-textarea" id="bl-batch-text" style="min-height:200px" placeholder="Over the River&#10;海尼曼GK第二辑&#10;We can go over the river. We can see a rabbit. We can see a bear.&#10;===&#10;Taking Care of the Dog&#10;海尼曼GK第二辑&#10;I can feed the dog. I can walk the dog."></textarea>
        <button class="btn btn-brand btn-block" onclick="UI.parseBatchText()">🔍 解析并分析</button>
        <div id="bl-batch-status" style="margin-top:12px"></div>
      </div>`;
    $('#page-basemgr').innerHTML=html;
  },
  parseBatchText(){
    const text=$('#bl-batch-text').value.trim();
    if(!text){toast('请粘贴文本');return}
    const blocks=text.split(/===+/).map(b=>b.trim()).filter(b=>b.length>0);
    if(blocks.length===0){toast('未识别到绘本，请用===分隔');return}
    const parsed=[];
    for(const block of blocks){
      const lines=block.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
      if(lines.length<3){parsed.push({title:lines[0]||'',rawText:'',series:'',status:'failed',reason:'行数不足3行'});continue}
      const title=lines[0];
      const series=lines[1]||'未分类系列';
      const rawText=lines.slice(2).join(' ');
      const tempBook={title,series,rawText};
      const analyzed=Analyzer.analyze(tempBook);
      const allBooks=getAllBooks();
      const dup=Dedup.findDuplicate(tempBook,allBooks,'standard');
      if(dup.level!=='none'){
        parsed.push({...analyzed,status:'duplicate',reason:'与《'+dup.match.title+'》重复',dupLevel:dup.level,dupMatch:dup.match});
      }else{
        parsed.push({...analyzed,status:'success',reason:''});
      }
    }
    this._batchBooks=parsed;
    this.renderBatchResultList();
  },
  // ===== 统一结果确认列表 =====
  renderBatchResultList(){
    const books=this._batchBooks||[];
    if(books.length===0){toast('没有可导入的绘本');return}
    const success=books.filter(b=>b.status==='success');
    const duplicate=books.filter(b=>b.status==='duplicate');
    const failed=books.filter(b=>b.status==='failed');
    const filter=this._batchFilter||'all';
    let filtered=books;
    if(filter==='success')filtered=success;
    else if(filter==='duplicate')filtered=duplicate;
    else if(filter==='failed')filtered=failed;
    const themeOptions=Object.keys(THEME_KEYWORDS).concat(['其他']);
    const html=`
      <div class="add-header">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px;opacity:.8" onclick="UI.showBaselineImportMenu()">←</span><div class="ah-title">📋 批量导入 · 共${books.length}本</div></div>
        <div style="font-size:12px;opacity:.8;margin-top:2px">✅成功${success.length} · ⚠️重复${duplicate.length} · ❌失败${failed.length}</div>
      </div>
      <div class="lib-filters" style="padding:8px 16px">
        <div class="lib-filter ${filter==='all'?'active':''}" onclick="UI._batchFilter='all';UI.renderBatchResultList()">全部 ${books.length}</div>

        <div class="lib-filter ${filter==='duplicate'?'active':''}" onclick="UI._batchFilter='duplicate';UI.renderBatchResultList()">⚠️ ${duplicate.length}</div>
        <div class="lib-filter ${filter==='failed'?'active':''}" onclick="UI._batchFilter='failed';UI.renderBatchResultList()">❌ ${failed.length}</div>
      </div>
      <div class="setting-group" id="batch-list">
        ${filtered.map((b,i)=>{
          const idx=books.indexOf(b);
          const checked=b.status==='success'?'checked':'';
          const icon=b.status==='success'?'✅':b.status==='duplicate'?'⚠️':'❌';
          const bgColor=b.status==='success'?'#fff':b.status==='duplicate'?'#FEF2F2':'#F9FAFB';
          const borderColor=b.status==='duplicate'?'#FECACA':'var(--border)';
          return`<div class="card card-pad" style="margin-bottom:8px;background:${bgColor};border-color:${borderColor}">
            <div style="display:flex;align-items:flex-start;gap:8px">
              <input type="checkbox" ${checked} style="margin-top:4px" data-idx="${idx}" ${b.status!=='success'?'':'checked'}>
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:600">${icon} ${b.title||'(无书名)'}</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:2px">
                  ${b.series||'无系列'} · L${b.level||'?'} · ${b.theme||'?'} · ${b.vocab?b.vocab.length:0}词
                  ${b.status==='duplicate'?'<br><span style="color:var(--danger)">'+b.reason+'</span>':''}
                  ${b.status==='failed'?'<br><span style="color:var(--warning)">'+b.reason+'</span>':''}
                </div>
                ${b.status==='success'?`
                  <div style="display:flex;gap:8px;margin-top:8px">
                    <select class="af-input" style="flex:1;padding:4px 8px" data-idx="${idx}" data-field="level">
                      ${['A','B','C','D'].map(l=>`<option value="${l}"${l===b.level?' selected':''}>L${l}</option>`).join('')}
                    </select>
                    <select class="af-input" style="flex:1;padding:4px 8px" data-idx="${idx}" data-field="theme">
                      ${themeOptions.map(t=>`<option value="${t}"${t===b.theme?' selected':''}>${t}</option>`).join('')}
                    </select>
                  </div>`:''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="padding:12px 16px;display:flex;gap:8px">
        <button class="btn btn-ghost" style="flex:1" onclick="UI.selectAllBatch(true)">全选成功项</button>
        <button class="btn btn-brand" style="flex:1" onclick="UI.confirmBatchImport()">确认导入 →</button>
      </div>
      <div style="height:16px"></div>`;
    $('#page-basemgr').innerHTML=html;
  },
  selectAllBatch(checked){
    const books=this._batchBooks||[];
    $$('#batch-list input[type=checkbox]').forEach(cb=>{
      const idx=parseInt(cb.dataset.idx);
      if(books[idx]&&books[idx].status==='success')cb.checked=checked;
    });
  },
  confirmBatchImport(){
    const books=this._batchBooks||[];
    let added=0,skipped=0;
    const ts=Date.now();
    $$('#batch-list input[type=checkbox]').forEach(cb=>{
      if(!cb.checked)return;
      const idx=parseInt(cb.dataset.idx);
      const b=books[idx];
      if(!b||b.status!=='success')return;
      // 读取覆盖值
      const levelSel=$(`select[data-idx="${idx}"][data-field="level"]`);
      const themeSel=$(`select[data-idx="${idx}"][data-field="theme"]`);
      const level=levelSel?levelSel.value:b.level;
      const theme=themeSel?themeSel.value:b.theme;
      const id='bl'+ts+'-'+String(added).padStart(2,'0');
      const book={
        id,title:b.title,series:b.series,rawText:b.rawText,
        level,theme,vocab:b.vocab,pattern:b.pattern,
        sentences:b.sentences,wordCount:b.wordCount,
        source:'baseline',status:'unlearned',readCount:0,lastRead:null,history:[],analyzed:true
      };
      appData.books.push(book);
      added++;
    });
    save();
    this._batchBooks=null;
    this._batchFilter='all';
    if(added>0){
      toast('✅ 导入成功'+added+'本'+(skipped>0?'，跳过'+skipped+'本':''));
      this.renderBaselineMgr();
    }else{
      toast('未选中任何绘本');
    }
  },
  // ===== 重新智能分析全库 =====
  reanalyzeAll(){
    if(!confirm('🧠 用最新算法重新分析所有基线绘本的级别/主题/词汇/句型？\n\n此操作会覆盖现有分析结果（学习进度保留）。'))return;
    const blBooks=appData.books.filter(b=>b.source==='baseline');
    if(blBooks.length===0){toast('基线库为空');return}
    let changed=0;
    blBooks.forEach(b=>{
      const oldLevel=b.level;
      const oldTheme=b.theme;
      // 重新分析(只算level和theme,保留进度)
      const analyzed=Analyzer.analyze({title:b.title,series:b.series,rawText:b.rawText});
      if(b.level!==analyzed.level)changed++;
      b.level=analyzed.level;
      b.theme=analyzed.theme;
      b.vocab=analyzed.vocab;
      b.pattern=analyzed.pattern;
      b.sentences=analyzed.sentences;
      b.wordCount=analyzed.wordCount;
      b.analyzed=true;
    });
    save();
    toast('✅ 已重新分析'+blBooks.length+'本，其中'+changed+'本级别有调整');
    setTimeout(()=>this.renderBaselineMgr(),500);
  },
  // ===== 拦截点4：手动查重扫描 =====
  scanDuplicates(){
    const allBooks=getAllBooks();
    const groups=Dedup.scanAll(allBooks);
    if(groups.length===0){
      const html=`
        <div class="add-header">
          <div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px;opacity:.8" onclick="UI.renderBaselineMgr()">←</span><div class="ah-title">🔍 查重扫描</div></div>
        </div>
        <div style="padding:40px 16px;text-align:center">
          <div style="font-size:48px;margin-bottom:12px">🎉</div>
          <div style="font-size:16px;font-weight:600;margin-bottom:4px">没有发现重复绘本</div>
          <div style="font-size:13px;color:var(--text-muted)">全库${allBooks.length}本绘本，无重复</div>
          <button class="btn btn-brand" style="margin-top:16px" onclick="UI.renderBaselineMgr()">返回</button>
        </div>`;
      $('#page-basemgr').innerHTML=html;
      return;
    }
    let totalDups=0;
    groups.forEach(g=>totalDups+=g.length-1);
    const html=`
      <div class="add-header">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px;opacity:.8" onclick="UI.renderBaselineMgr()">←</span><div class="ah-title">🔍 查重扫描</div></div>
        <div style="font-size:12px;opacity:.8;margin-top:2px">发现${groups.length}组重复 · 共${totalDups}本需处理</div>
      </div>
      <div class="setting-group">
        ${groups.map((group,gi)=>{
          return`<div class="card card-pad" style="margin-bottom:12px;background:#FEF2F2;border-color:#FECACA">
            <div style="font-size:13px;font-weight:600;color:#991B1B;margin-bottom:8px">重复组 ${gi+1}</div>
            ${group.map((b,bi)=>{
              const srcLabel=b.source==='baseline'?'📦 基线库':'🏠 私有库';
              const statusLabel={mastered:'✅',learning:'🔵',unlearned:'⬜'}[b.status]||b.status;
              return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;${bi>0?'border-top:1px solid #FECACA':''}">
                <div style="flex:1">
                  <div style="font-size:14px;font-weight:600">${b.title}</div>
                  <div style="font-size:11px;color:var(--text-muted)">${srcLabel} · ${b.series} · ${statusLabel} · ${b.readCount||0}次</div>
                </div>
                ${bi===0?'<span style="font-size:11px;color:var(--success);font-weight:600">保留</span>':
                  `<button class="btn btn-brand" style="padding:4px 10px;font-size:12px" onclick="UI.mergeDuplicate('${group[0].id}','${b.id}')">合并进度+删除</button>`}
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
      </div>
      <div style="padding:12px 16px">
        <button class="btn btn-ghost btn-block" onclick="UI.renderBaselineMgr()">完成</button>
      </div>
      <div style="height:16px"></div>`;
    $('#page-basemgr').innerHTML=html;
  },
  mergeDuplicate(keepId,delId){
    const keepBook=appData.books.find(b=>b.id===keepId)||appData.customBooks.find(b=>b.id===keepId);
    const delBook=appData.books.find(b=>b.id===delId)||appData.customBooks.find(b=>b.id===delId);
    if(!keepBook||!delBook){toast('未找到绘本');return}
    if(!confirm('合并《'+delBook.title+'》的学习进度到《'+keepBook.title+'》并删除前者？'))return;
    Dedup.mergeProgress(keepBook,delBook);
    // 从对应库删除
    appData.books=appData.books.filter(b=>b.id!==delId);
    appData.customBooks=appData.customBooks.filter(b=>b.id!==delId);
    save();
    toast('✅ 已合并进度并删除');
    this.scanDuplicates();
  }
};

// ==================== INIT ====================
// ==================== PWA：Service Worker 注册（唯一入口）====================
// 说明：历史上这里有两处注册（init() 内一处 + 文件末尾一处），功能重叠、互相覆盖日志，
//       其中文件末尾那处还挂了 controllerchange 自动刷新。现在收敛为一处，并解决三件事：
//   ① 带版本号注册（./sw.js?v=SW_VERSION）—— 强制浏览器重新拉取 sw.js，
//      避免"改了代码但用户永远拿到旧缓存"（这个坑已经踩过一次）；
//   ② 首次安装不触发刷新 —— 否则新用户第一次打开就被 reload 一次，体验很差；
//   ③ 老用户更新时自动刷新一次 —— 让新版本立刻生效。
const SW_VERSION='15';   // ⚠️ 必须与 sw.js 里 CACHE_NAME 的版本号保持一致，发版时一起改
function registerSW(){
  if(!('serviceWorker' in navigator))return;
  // 首访时 controller 为空；老用户/二次刷新时已有 controller。用它区分"首次安装"与"版本更新"
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js?v='+SW_VERSION).then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          // 先打标，再由 controllerchange 决定"什么时候刷新"——见下方说明。
          window.__updateToastShown=true;
          toast('📦 已更新到新版本');
        }
      });
    });
  }).catch(err=>console.warn('[PWA] Service Worker 注册失败：',err));
  // 控制器变更 = 新 SW 已接管。仅对"老用户"刷新，首访用户不刷新。
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController)return;
    if(window.__swRefreshing)return;
    window.__swRefreshing=true;
    // 刷新会清掉刚弹出的"已更新到新版本"提示（toast 显示 2 秒）。
    // 所以弹过提示就等 2.2 秒，让家长把这句话看完再接管；没弹过提示立即刷新。
    setTimeout(()=>window.location.reload(), window.__updateToastShown?2200:0);
  });
}

// ==================== 微信内置浏览器引导 ====================
// 为什么必须有：微信是本产品最主要的传播渠道——家长都是从微信点开链接的。
// 但微信内置浏览器里【没有"添加到桌面"入口】，Service Worker 行为在各版本也不一致
// （离线常常打不开）。也就是说：家长在微信里打开，根本装不上、也体验不到离线。
// 所以检测到微信环境时，顶部滑入一条可关闭的引导，明确告诉他"在浏览器中打开"。
function maybeShowWeChatGuide(){
  if(!Compat.isWeChat)return;
  // 用户主动关掉过就不再打扰（本浏览器记住）
  try{ if(localStorage.getItem('wxGuideDismissed')==='1')return; }catch(e){}
  const el=document.createElement('div');
  el.id='wx-guide';
  el.innerHTML='<div class="wx-guide-inner">'
    +'<div class="wx-guide-text">'
    +'<div class="wx-guide-title">请点右上角 ··· 在浏览器中打开</div>'
    +'<div class="wx-guide-sub">微信里无法“添加到桌面”，改用自带浏览器打开后可离线使用、不卡顿</div>'
    +'</div>'
    +'<button class="wx-guide-close" aria-label="关闭">✕</button>'
    +'</div>';
  document.body.appendChild(el);
  // 横幅是 position:fixed，不把内容顶下来就会压住 App 顶部（统计卡/头部）。
  // 这里按实际渲染高度把 body 内容整体下移，关闭时还原。
  const push=()=>{ document.body.style.paddingTop=el.getBoundingClientRect().height+'px' };
  push();
  window.addEventListener('resize',push);
  const close=()=>{
    el.classList.remove('show');
    document.body.style.paddingTop='';
    window.removeEventListener('resize',push);
    setTimeout(()=>el.remove(),320);
    try{ localStorage.setItem('wxGuideDismissed','1') }catch(e){}
  };
  el.querySelector('.wx-guide-close').addEventListener('click',close);
  // 下一帧再加 show 类，保证过渡动画能触发
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
}

function init(){
  try{
    // iOS 100vh 兜底：不支持 dvh 的旧浏览器用 JS 动态计算视口高度
    const setVH=()=>{document.documentElement.style.setProperty('--vh',window.innerHeight*0.01+'px')};
    setVH();window.addEventListener('resize',setVH);
    // PWA：注册 Service Worker（唯一定义在文件末尾 registerSW()，此处只调用）
    registerSW();
    // 云开发后端接入：后台拉起 CloudBase 登录（openid），成功后启用云端同步与激活码功能；
    // 失败不阻塞本地 App 使用（本地数据兜底）。API 暴露为 window.API。
    window.API=API;
    window._API_PROMISE=API.init().catch(e=>console.warn('[API] 云开发初始化未完成:',e.message));
    // 兼容性检测：localStorage不可用时直接提示
    if(!Compat.isUsable()){
      document.getElementById('app').innerHTML='<div style="padding:40px 20px;text-align:center;color:#52525B"><div style="font-size:40px;margin-bottom:12px">⚠️</div><div style="font-size:16px;font-weight:600">浏览器不支持本地存储</div><div style="font-size:13px;margin-top:8px;color:#9CA3AF">请关闭隐私模式/无痕浏览后重新打开<br>或尝试更新手机自带浏览器到最新版本</div></div>';
      return;
    }
    appData=Store.init();
    TTS.init();
    TTS.speed=appData.settings.speed;
    const today=LDate.today();
    if(appData.lastCheckin!==today){
      appData.lastCheckin=today;
      appData.todayProgress={books:[],listenMin:0};
      // 这里只是"新的一天"的占位记录，不代表打卡 —— 空记录在统计里会被自动排除
      if(!appData.checkins[today])appData.checkins[today]={books:[],outputs:[],duration:0};
      listenSeconds=0;
      save();
    }
    // 连续天数统一按自然日重算（同时修正历史版本累加出来的虚高值）
    recalcStreak();
    UI.render();
    // 初始化PWA安装提示监听（添加到桌面功能）
    UI.initInstallPrompt();
    // 微信内置浏览器：顶部引导"在浏览器中打开"（微信里装不上、离线不稳定）
    maybeShowWeChatGuide();
    // 首次打开时检测兼容性并提示
    const unsupported=Compat.getUnsupported();
    if(unsupported.length>0){
      setTimeout(()=>{
        if(unsupported.includes('语音发音')){
          toast('ℹ️ 本浏览器不支持手机自带语音，已自动切换到在线音频（需联网）');
        }else if(unsupported.length>0){
          toast('⚠️ 部分功能不可用：'+unsupported.join('、')+'。建议更新浏览器');
        }
      },1000);
    }
  }catch(e){
    console.error('Init error:',e);
    document.getElementById('app').innerHTML='<div style="padding:40px 20px;text-align:center;color:#52525B"><div style="font-size:40px;margin-bottom:12px">⚠️</div><div style="font-size:16px;font-weight:600">加载出错了</div><div style="font-size:13px;margin-top:8px;color:#9CA3AF">错误信息：'+(e.message||'未知错误')+'</div><div style="font-size:13px;margin-top:12px;color:#9CA3AF">请尝试以下方式：<br>1. 更新手机自带浏览器到最新版<br>2. 关闭隐私/无痕模式<br>3. 清除浏览器缓存后重试</div></div>';
  }
}
init();
