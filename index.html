  },
  // 句首大写
  capitalize(s){
    if(!s)return s;
    return s.charAt(0).toUpperCase()+s.slice(1);
  },
  // 不可数名词集合
  isUncountable(w){
    const UNCOUNTABLE=new Set(['milk','water','bread','rice','meat','soup','cheese','juice','snow','rain','hair','grass','sand']);
    return UNCOUNTABLE.has(w);
  },
  needsArticle(w){
    // 亲属称谓前不加a/an（用my）
    return['mom','dad','grandma','grandpa','family','baby','friend','mommy','daddy','sister','brother','aunt','uncle','cousin'].includes(w);
  },
  addArticle(w){
    if(this.needsArticle(w))return w;
    if(this.isUncountable(w))return w;
    // 复数名词不加 a/an（如 toys / blocks）
    if(/[a-z]+s$/.test(w)&&!/[sxzsh]{2}$/.test(w))return w;
    return/^[aeiou]/i.test(w)?'an '+w:'a '+w;
  },
  // === 修复③：从 pattern 提取名词；fallback 改为本书首词，不再硬编码 mom ===
  getNoun(pattern,vocab){
    const words=pattern.split(' ');
    for(const w of words){const lw=w.toLowerCase().replace(/[.!?,]/g,'');if(VOCAB_DB[lw]&&!STOP_WORDS.has(lw))return lw}
    // fallback 优先用本书词汇表首词，否则用 'book'
    return(vocab&&vocab[0]&&vocab[0].word)||'book';
  },
  getVerb(pattern){
    const words=pattern.split(' ');
    const verbs=['run','jump','walk','swim','fly','climb','sit','stand','eat','drink','sleep','cry','laugh','play','read','write','sing','dance','draw','see','look','listen','go','come','make','give','put','open','close','wave','hug','point','ride','drive','turn','bend','raise','clap','kick','wash','wear'];
    for(const w of words){const lw=w.toLowerCase().replace(/[.!?,]/g,'');if(verbs.includes(lw))return lw}
    return'run';
  },
  // ============================================================
  // 以下为第 2 步（P1-6 / P1-7）新增的辅助方法
  // ============================================================
  // 动词集合（与 genExtensions 内的 VERBS 同源，供新方法复用）
  VERB_WORDS:new Set(['run','jump','walk','swim','fly','climb','sit','stand','eat','drink','sleep','cry','laugh','play','read','write','sing','dance','draw','paint','bake','see','look','listen','go','come','make','give','put','get','open','close','wave','hug','point','ride','drive','turn','bend','raise','clap','kick','wash','wear','hide','help','dig','fall','set','clean','carry','feed','rake','skate','slide','hop','swing','hang','talk','build','cut','dream','crawl','dance','climb','write','eat']),
  // 能回答 "Who is this?" 的词 —— 只有"人"才行。
  // 旧代码对 family / pets / toys 也问"这是谁"，语义是错的（pets 不是一个人）。
  PERSON_WORDS:new Set(['mom','dad','mommy','daddy','grandma','grandpa','grandmother','grandfather','sister','brother','baby','friend','mother','father','aunt','uncle','teacher','girl','boy','dancer','driver','clown','children','kids','family','people']),

  // 只有复数形式的词（pants / pajamas / stairs）—— 不能还原成 pant / pajama / stair
  PLURAL_ONLY:new Set(['pants','trousers','shorts','jeans','clothes','pajamas','pyjamas','glasses','scissors','tights','series','news','gymnastics','stairs','binoculars','pliers','tongs']),
  // 名词还原单数：the toys → the toy（不可数名词原样返回）
  // ss/us/is 结尾不是复数（glass / bus / basis），原样返回，避免误删尾字母
  // 复数专用名词（pants / pajamas / stairs）原样返回，避免得到 "Here is the pant!"
  singular(w){
    const s=String(w||'').toLowerCase().trim();
    if(!s||this.isUncountable(s))return s;
    if(this.PLURAL_ONLY.has(s))return s;
    if(/(?:ss|us|is)$/.test(s))return s;
    if(s.endsWith('ies')&&s.length>4)return s.slice(0,-3)+'y';
    if(/(?:s|x|ch|sh)es$/.test(s))return s.slice(0,-2);
    if(s.endsWith('s'))return s.slice(0,-1);
    return s;
  },
  // 名词变复数（供游戏文案里的 {WS} 使用）
  // 先还原单数再变复数：否则 blocks（已复数）会被当成 s 结尾 → blockses
  pluralOf(w){
    const s=String(w||'').toLowerCase().trim();
    if(!s||this.isUncountable(s))return s;
    const b=this.singular(s);
    if(b.endsWith('y')&&!/[aeiou]y$/.test(b))return b.slice(0,-1)+'ies';
    if(/(?:s|x|ch|sh)$/.test(b))return b+'es';
    return b+'s';
  },
  // 精选名词表（P1-6 修复 B）：THEME_NOUNS_BY_THEME 的全部词 + NOUN_CN 的键。
  // 为什么需要：本书词表是按 VOCAB_DB 过滤出来的，里面混着形容词/副词
  // （funny / big / together / happy…）。旧写法取"第一个不是动词的词"，
  // 对 Playing Together 会取到 together，进而拼出 "I have three togethers!" 这种错英语。
  NOUN_WHITELIST:(()=>{
    const s=new Set();
    try{
      Object.values(THEME_NOUNS_BY_THEME).forEach(a=>{if(Array.isArray(a))a.forEach(w=>s.add(String(w).toLowerCase()))});
      Object.keys(NOUN_CN).forEach(w=>s.add(String(w).toLowerCase()));
    }catch(e){}
    return s;
  })(),
  // 非名词排除表（白名单漏网时兜底）：常见形容词/副词/感叹词/功能词
  NON_NOUN:new Set(['funny','big','little','too','said','happy','together','long','wet','fast','very','ready','want','got','hello','goodbye','choo','purr','pop','how','now','oh','yes','no','up','down','out','over','under','in','on','at','the','and','but','so','his','her','my','your','this','that','here','there','some','all','one','two','three']),
  // 从本书词表挑一个"名词"：先查精选名词表，命中就用；否则退回"排除动词与非名词"；
  // 都挑不到才取第一个像词的词（保底，不再产生副词复数）。
  themeNoun(vocab){
    const words=(vocab||[]).map(v=>String(v.word||'').toLowerCase()).filter(w=>/^[a-z]{3,}$/.test(w));
    const isVerb=w=>this.VERB_WORDS.has(w)||this.VERB_WORDS.has(this.singular(w));
    const isNounish=w=>!isVerb(w)&&!this.NON_NOUN.has(w)&&!this.PLURAL_ONLY.has(w);
    // ① 白名单里优先，但必须不是动词（排除 play 这类"动词兼名词"）
    const curated=words.filter(w=>(this.NOUN_WHITELIST.has(w)||this.NOUN_WHITELIST.has(this.singular(w)))&&isNounish(w));
    if(curated.length)return curated[0];
    // ② 退一步：任何"非动词、非功能词"的词
    const n=words.filter(isNounish);
    if(n.length)return n[0];
    // ③ 词表里实在没有名词 → 返回空串，调用方用静态文案兜底（宁可用通用句，也不给错英语）
    return '';
  },
  // 从本书词表挑一个"动词"，还原成原形
  // P1-6 修复 F：旧代码的 /ing$/ 兜底会把名词当动名词用
  //   （duckling → "I can duckling like a baby!"），
  //   现在要求"去掉 ing 后确实是动词"才算数（playing→play ✓，duckling→duckl ✗）。
  themeVerb(vocab){
    const words=(vocab||[]).map(v=>String(v.word||'').toLowerCase());
    const v=words.find(w=>this.VERB_WORDS.has(w));
    const gerund=words.find(w=>{
      if(!/ing$/.test(w))return false;
      const b=w.slice(0,-3);
      const b2=b.replace(/(.)\1$/,'$1');
      return this.VERB_WORDS.has(b)||this.VERB_WORDS.has(b+'e')||this.VERB_WORDS.has(b2);
    });
    const v2=v||words.find(w=>this.VERB_WORDS.has(this.singular(w)))||gerund;
    return v2?(Analyzer.verbBase(v2)||v2):'';
  },
  // 填充动态文案模板（{W} 名词单数 / {WS} 名词复数 / {V} 动词）；
  // 占位符填不满就返回空串，调用方回退到静态文案 —— 宁可用通用文案，也不给错话术。
  // 注意：{W} 一律用单数（"This is a block!" 而非 "This is a blocks!"），
  //       填完再做 a→an 修饰元音开头（"This is an apple!"）。
  fillTpl(tpl,vocab,theme){
    let s=String(tpl||'');
    if(!s)return '';
    const n=this.themeNoun(vocab),v=this.themeVerb(vocab);
    if(n){const ns=this.singular(n);s=s.split('{W}').join(ns).split('{WS}').join(this.pluralOf(ns));}
    if(v)s=s.split('{V}').join(v);
    if(/\{[WVS]+\}/.test(s))return '';
    s=s.replace(/\ba ([aeiouAEIOU])/g,'an $1');
    return s;
  },
  // 从本书词表挑一个能安全填进 pattern 槽位的词（区分动词槽 / 名词槽）
  slotWord(pattern,vocab){
    const p=String(pattern||'').toLowerCase();
    const idx=p.indexOf('___');
    if(idx<0)return '';
    const before=p.slice(0,idx).trim().split(/\s+/).pop()||'';
    const toOwner=p.slice(0,idx).trim().split(/\s+/).slice(-2)[0]||'';
    const needVerb=/^(?:can|do|does|did|will|would|should)$/.test(before)
      ||(before==='to'&&/^(?:like|likes|want|wants|love|loves|try|tries|learn|learns|need|needs|hope|hopes|begin|begins|start|starts|forget|forgets|help|helps)$/.test(toOwner));
    return needVerb?this.themeVerb(vocab):this.themeNoun(vocab);
  },
  // 用本书词汇把句型补成一句完整、正确的英文示范句（教案里家长照着念的就是这句）
  // P1-7 修复 E：
  //   ① 旧代码把 "the apples" 改写成 "an apples" —— the→an 这条规则用错了地方，
  //      正确规则是 "a + 元音开头 → an"（a apple → an apple），不该动 the；
  //   ② 多空位句型（"Come and see the ___ ___"）用同一个词填两个空，会得到
  //      "baby baby" / "bear bear" 这种重复错句 —— 改为取本书的真实句子
  //      （天然正确、且贴书），没有正文时才交给 safeDemo 兜底。
  patternDemo(pattern,vocab,sentences){
    const p=String(pattern||'').trim();
    if(!p||p.indexOf('___')<0)return '';
    const blanks=(p.match(/___/g)||[]).length;
    if(blanks>1){
      const sents=(sentences||[]).filter((s,i)=>i>0&&/[a-zA-Z]{2,}/.test(s));
      const pick=sents[1]||sents[0]||'';
      if(pick)return this.capitalize(String(pick).trim().replace(/[.!?]+$/,''))+'.';
      return '';
    }
    let w=this.slotWord(p,vocab);
    if(!w)return '';
    // 槽位前是 a/an/this/that/one，或 "This is / Here is / It is" → 名词必须单数
    //（否则会得到 "Here is a toys." 这种错句）
    const toks=p.split(/\s+/);
    const bi=toks.indexOf('___');
    const prev=(bi>0?toks[bi-1]:'').toLowerCase();
    const prev2=(bi>1?(toks[bi-2]+' '+toks[bi-1]).toLowerCase():'');
    const verbSlot=/^(?:can|to|do|does|did|will|would|should|could)$/.test(prev)
      ||/^(?:we|i|they|you|he|she|let's|let us|please)$/.test(prev);
    if(!verbSlot){
      const needSing=/^(a|an|this|that|one|each|every)$/.test(prev)||/^(this is|here is|it is)$/.test(prev2);
      if(needSing)w=this.singular(w);
    }
    let s=p.replace(/___/g,w);
    s=s.replace(/\ba ([aeiouAEIOU])/g,'an $1').replace(/\bA ([aeiouAEIOU])/g,'An $1');
    s=this.capitalize(s);
    if(!/[.!?]$/.test(s))s+='.';
    return s;
  },
  // 句型槽位填不上时的安全示范句（保证教案里永远有一句正确英文可念）
  //   themeNoun 可能是复数（blocks / beds），而 addArticle 对复数不加 a/an，
  //   直接拼会得到 "This is blocks." —— 这里先还原单数再配冠词。
  safeDemo(vocab,theme){
    const n=this.themeNoun(vocab);
    if(n){const s=this.singular(n);if(s)return 'This is '+this.addArticle(s)+'.';}
    return 'Let\'s read this book.';
  },

  // ============================================================
  // 六步教案生成（P1-7 修复）
  // 旧代码问题：
  //   ① 第 3 步的 enText 是用 "This is " 直接拼一串逗号分隔的新词表
  //      —— 语法错（This is + 词表）、引号不闭合，而且家长会照着念；
  //   ② 第 2 / 4 / 6 步是三句写死的占位话术，跟本书内容毫无关系。
  // 现在：每一步的英文都来自【本书句型 + 本书词汇】，不加引号、不拼接词表。
  // ============================================================
  genScript(theme,vocab,newWords,pattern,sentences){
    const tmpl=SCRIPT_TEMPLATES[theme]||SCRIPT_TEMPLATES['其他']||SCRIPT_TEMPLATES['日常生活'];
    const newWordList=newWords.map(w=>w.word).join('、');
    // 家长要念的英文示范句：优先"本书句型 + 本书词汇"，生成不出再用安全句
    const say=this.patternDemo(pattern,vocab,sentences)||this.safeDemo(vocab,theme);
    // 第 2 步"点读听音"：显示本书真正的第一句正文（点 🔊 就能听到这一句）
    const lines=(sentences||[]).filter((s,i)=>i>0&&/[a-zA-Z]{2,}/.test(s));
    const firstLine=lines.length?this.capitalize(String(lines[0]).trim().replace(/[.!?]+$/,''))+'.':say;
    const fill=(s)=>this.fillTpl(s,vocab,theme)||s;
    return[
      {step:1,name:'看图导入',en:'Observe',cn:'看封面，猜一猜',time:'1min',icon:'👀',enText:fill(tmpl.intro.en),cnText:tmpl.intro.cn,action:tmpl.intro.action,tip:'💡 先让孩子猜猜会发生什么，不要求用英文'},
      {step:2,name:'点读听音',en:'Listen',cn:'安静听英文',time:'2min',icon:'🔊',enText:firstLine,cnText:'把整本安静听一遍',action:'逐句播放，让孩子先熟悉语音语调',tip:'💡 这一步不用翻译，听就够了'},
      {step:3,name:'中文辅助',en:'Understand',cn:'理解绘本内容',time:'1min',icon:'💡',enText:say,cnText:'用中文讲讲这本书在发生什么（本课新词：'+newWordList+'）',action:'用中文讲一遍故事情节，不逐句翻译',tip:'💡 已学过的词不用翻译，让孩子直接听懂英文'},
      {step:4,name:'跟读模仿',en:'Repeat',cn:'跟我读一遍',time:'2min',icon:'🗣️',enText:firstLine,cnText:'跟着这一句大声读一遍',action:'妈妈先大声读一遍，再让宝宝跟读',tip:'💡 宝宝不说话也正常，坚持输入就好'},
      {step:5,name:'互动拓展',en:'Play',cn:'玩游戏+延伸',time:'3min',icon:'🎮',enText:fill(tmpl.interact.en),cnText:tmpl.interact.cn,action:tmpl.interact.action,tip:'💡 整合拓展句子+互动游戏+TPR动作，让孩子在玩中学'},
      {step:6,name:'鼓励输出',en:'Speak',cn:'记录孩子输出',time:'1min',icon:'⭐',enText:'Can you say: '+say,cnText:'问问宝宝今天学会了什么',action:'记录学习状态 + 孩子说出的词 + 妈妈笔记',tip:'💡 完成后自动打卡，更新词汇库和复习计划'}
    ];
  },

  // ============================================================
  // 游戏匹配（P1-6 修复）
  // 旧代码：GAME_LIB.filter(g => g.themes.includes(theme) && (匹配句型 || g.themes.includes(theme)))
  //   —— `&&` 右边那个条件与左边第一个条件完全等价，恒为真，
  //      整个函数退化成"按主题取数组前 3 个"，句型匹配完全没生效。
  //   加上游戏库只覆盖 8 个主题（实际有 动作/玩具/其他 共 23 本无对口游戏），
  //   结果是 23 本书匹配到 0 个游戏、家长点开"互动游戏"是空的。
  // 现在：
  //   ① 主题优先、句型作为同主题内的排序依据（rank = 主题×10 + 句型）；
  //      —— 句型不能压过主题，否则一本食物绘本会因为句型像"I can ___"
  //         而拿到"表情游戏"这种跟本书无关的推荐；
  //   ② 不足 3 个用通用游戏补齐，保证每本书都有 3 个游戏；
  //   ③ 文案按本书词汇生成（{W}/{V} 占位）。
  // ============================================================
  matchGames(theme,pattern,vocab){
    const pat=String(pattern||'').toLowerCase();
    const patHit=g=>Array.isArray(g.patterns)&&pat&&g.patterns.some(p=>{
      const head=String(p).split('___')[0].trim().toLowerCase();
      return head.length>2&&pat.indexOf(head)>=0;
    });
    const rank=g=>{
      const t=g.themes.includes(theme)?1:0;
      if(!t)return 0;                       // 主题不符一律不要（宁可给通用游戏）
      return 10+(patHit(g)?1:0);
    };
    let res=GAME_LIB.filter(g=>!g.themes.includes('*')&&rank(g)>0).sort((a,b)=>rank(b)-rank(a));
    // 不足 3 个时用通用游戏补齐 —— 保证每本书都有游戏可玩
    if(res.length<3)res=res.concat(GAME_LIB.filter(g=>g.themes.includes('*')&&res.indexOf(g)<0));
    return res.slice(0,3).map(g=>{
      const o={...g};
      if(o.tpl){const t=this.fillTpl(o.tpl,vocab,theme);if(t)o.steps=t;}
      delete o.tpl;delete o.patterns;
      return o;
    });
  },

  findRelated(book,allBooks){
    if(!allBooks)return[];
    const bookWords=book.vocab.map(v=>v.word);
    return allBooks.filter(b=>b.id!==book.id).map(b=>{
      const otherWords=(b.vocab||(b.analyzed?b.vocab:Analyzer.extractVocab(b.rawText))).map(v=>v.word);
      const shared=bookWords.filter(w=>otherWords.includes(w));
      const overlap=bookWords.length>0?Math.round(shared.length/bookWords.length*100):0;
      return{...b,sharedWords:shared,overlap};
    }).filter(b=>b.overlap>10).sort((a,b)=>b.overlap-a.overlap).slice(0,5);
  }
};

// ==================== SCHEDULER ====================
const Scheduler = {
  // 5因素加权：难度30% + 主题聚类25% + 词汇复用20% + 句型递进15% + 兴趣10%
  generate(allBooks,learnedWords){
    const analyzed=allBooks.map(b=>b.analyzed?b:Analyzer.analyze(b));
    // 难度递进 30%：Level A→B→C→D 顶层分组（四级分级体系）
    const byLevel={A:[],B:[],C:[],D:[]};
    analyzed.forEach(b=>{byLevel[b.level]=byLevel[b.level]||[];byLevel[b.level].push(b)});
    // 兴趣优先 10%（前向兼容：appData.interests = {theme: 喜爱次数}）
    const interests=appData.interests||{};
    const totalInterest=Object.values(interests).reduce((s,c)=>s+c,0)||1;
    const schedule=[];
    Object.keys(byLevel).sort().forEach(lvl=>{
      const books=byLevel[lvl];
      const byTheme={};
      books.forEach(b=>{byTheme[b.theme]=byTheme[b.theme]||[];byTheme[b.theme].push(b)});
      // 主题排序：主题聚类25%（已学词汇多的主题优先续学）+ 兴趣10%
      const themeOrder=Object.keys(byTheme).sort((t1,t2)=>{
        const learnedIn=theme=>{let c=0;byTheme[theme].forEach(b=>b.vocab.forEach(v=>{if(learnedWords&&learnedWords.has(v.word))c++}));return c};
        const w1=0.25*learnedIn(t1)+0.10*((interests[t1]||0)/totalInterest);
        const w2=0.25*learnedIn(t2)+0.10*((interests[t2]||0)/totalInterest);
        // 同分时主题书目多的优先（材料充足便于聚类）
        return w2-w1||byTheme[t2].length-byTheme[t1].length;
      });
      themeOrder.forEach(theme=>{
        // 主题内排序：难度30% + 词汇复用20% + 句型15%
        const ordered=this.orderBooks(byTheme[theme]);
        ordered.forEach(book=>{
          const existing=schedule.find(s=>s.theme===theme&&s.level===lvl);
          if(existing)existing.books.push(book);
          else schedule.push({level:lvl,theme,books:[book]});
        });
      });
    });
    return this.toWeeks(schedule);
  },
  // 主题内书本排序：难度30% + 词汇复用20% + 句型15%（贪心算法）
  orderBooks(books){
    if(books.length<=1)return [...books];
    const maxVocab=Math.max(...books.map(b=>b.vocab.length),1);
    const scheduled=[];
    const remaining=[...books];
    // 起步：最简单（词汇最少）的书先排
    remaining.sort((a,b)=>a.vocab.length-b.vocab.length);
    scheduled.push(remaining.shift());
    while(remaining.length>0){
      let bestIdx=0,bestScore=-Infinity;
      for(let i=0;i<remaining.length;i++){
        const b=remaining[i];
        const last=scheduled[scheduled.length-1];
        let score=0;
        // 难度递进 30%：词汇少=简单=先排
        score+=0.30*(1-b.vocab.length/maxVocab);
        // 词汇复用 20%：与上一本词汇重叠率高=紧邻排列
        const shared=b.vocab.filter(v=>last.vocab.some(lv=>lv.word===v.word)).length;
        score+=0.20*(shared/Math.max(b.vocab.length,1));
        // 句型递进 15%：重复率高=简单=先排（vocab/sentence 比值低）
        const uniqueRatio=b.vocab.length/Math.max(b.sentences.length,1);
        score+=0.15*(1-Math.min(uniqueRatio/3,1));
        if(score>bestScore){bestScore=score;bestIdx=i}
      }
      scheduled.push(remaining[bestIdx]);
      remaining.splice(bestIdx,1);
    }
    return scheduled;
  },
  toWeeks(themeGroups){
    const weeks=[];
    let currentWeek=[];
    let dayCount=0;
    // 跨主题追踪已排书目，用于复习书选择
    const scheduledBooks=[];
    themeGroups.forEach(tg=>{
      tg.books.forEach(book=>{
        // ⚠️ 这里原本会挑"词汇重叠率最高的 2 本"塞进 review 字段当"复习"，那是错的：
        // 需求要的"什么时候需要复习"是艾宾浩斯到期，跟词汇重叠完全是两回事。
        // 后果：家长以为系统已经安排了复习，于是错过真正到期的复习；或者同一天被要求
        // 读 3 本（1 新 + 2"复习"）直接放弃。现在"复习"的定义收敛到
        // Plan.dueReviewBooks()（全项目唯一到期算法），此处不再产出"复习"。
        const review=[];
        const day={book,review,isNew:true,theme:tg.theme,level:tg.level};
        scheduledBooks.push(book);
        currentWeek.push(day);
        dayCount++;
        if(dayCount>=5){
          currentWeek.push({isReview:true,books:scheduledBooks.slice(-5),theme:tg.theme});
          currentWeek.push({isRest:true,theme:tg.theme});
          weeks.push(currentWeek);
          currentWeek=[];
          dayCount=0;
        }
      });
    });
    if(currentWeek.length>0)weeks.push(currentWeek);
    return weeks;
  }
};

// ==================== PLAN（统一排课数据源）====================
// 为什么要有它：
//   旧版"排课"产出的是 {level,theme,books} 的周分组，**没有任何日期** —— 家长看完
//   "第1周·周一~周日"，依然不知道"今天读哪本"。
//   而首页"今日精读"又用另一套逻辑（flat.filter(未学).slice(0,2) + 到期复习），
//   两套互不认账：计划页说今天读 A，首页让你读 B。
//   现在统一为：Plan 产出**唯一**一份带日期的日程表，首页 / 计划页 / 打卡页都读它。
//
// 两个关键口径：
//   ① 日期是"滚动预测"：今天的安排 = 队列里前 N 本未读 + 今天真正到期的复习。
//      没读的书留在队首（漏读自动顺延），所以日期永远从今天起连续，不会因为
//      昨天没读就"跳过"一本书。
//   ② 一天排几本由家长的时间预算决定（dailyMinutes：≥15 分钟排 2 本，5/10 分钟排 1 本）。
//      排多了完不成、家长会直接放弃 —— 宁可少排，这点在走查报告里已经点明。
const Plan = {
  // 艾宾浩斯间隔（与旧 getTodayBooks 完全一致，保证"复习"的定义全项目唯一）
  INTERVALS:{learning:[2,4,7],mastered:[7,15,30]},
  PREVIEW_DAYS:28,   // 计划页预演窗口（4 周）
  REST_WEEKDAY:0,    // 周日 = 熏听 + 复习日，不排新书（一周节奏）
  _cache:null,
  _sig:'',
  // 每天新书数量：由时间预算推导
  perDay(){return this.dailyMinutes()>=15?2:1},
  dailyMinutes(){return (appData.settings&&appData.settings.dailyMinutes)||10},
  // 缓存签名：任何会影响排课的输入变了就失效（避免每次渲染都重跑贪心排序）
  signature(){
    const st=getAllBooks().map(b=>(b.status||'u')+(b.paused?'P':'-')+(b.lastRead||'')).join('');
    let h=0;
    for(let i=0;i<st.length;i++)h=(h*31+st.charCodeAt(i))|0;
    return [st.length,h,this.dailyMinutes()].join('|');
  },
  invalidate(){this._cache=null;this._sig=''},
  // 新书队列：沿用 Scheduler 的五因素贪心排序，但剔除"已掌握 / 已暂停"
  newQueue(){
    // 授权门（刻意做成"软墙"而非硬锁）：
    // 没有"新书"权限（试用结束且未激活）时，只保留复习，不再排新书。
    // 理由 —— 复习已学内容是家长已经付出的时间换来的，永远不该被收回；
    // 家长看到"今天没有新书，但可以复习"，比看到"App 被锁死"要体面得多。
    if(!LICENSE.featureOn(LICENSE.FEATURES.NEW_BOOKS))return [];
    const active=getAllBooks().filter(b=>!b.paused);
    const ordered=[];
    Scheduler.generate(active,getLearnedWordsSet()).forEach(week=>{
      week.forEach(d=>{if(d.book&&!ordered.some(x=>x.id===d.book.id))ordered.push(d.book)});
    });
    return ordered.filter(b=>b.status!=='mastered'&&b.status!=='learning');
  },
  // 某本书按遗忘曲线是否到期 —— **全项目唯一的到期判定入口**
  // 旧实现同一段逻辑散在 getTodayBooks 与计划页两处，且计划页用的是"词汇重叠"，
  // 与遗忘曲线完全是两回事，会把家长彻底带偏。现在只有这一个地方说了算。
  isDue(book,todayDate){
    if(!book||!book.lastRead)return false;
    if(book.status!=='learning'&&book.status!=='mastered')return false;
    const iv=this.INTERVALS[book.status]||this.INTERVALS.learning;
    const days=Math.floor((todayDate-new Date(book.lastRead+'T00:00:00'))/86400000);
    if(!(days>=0))return false;
    // 未到首个间隔 → 不复习；到或超过任一间隔 → 该复习。
    // 用 >= 而不是 ==：错过精确复习日仍然可以补复习，符合家长的真实使用场景。
    return days>=iv[0];
  },
  // 今天真正到期的复习（按每本书的 lastRead 实算，不是预测）
  dueReviewBooks(){
    const todayDate=new Date(LDate.today()+'T00:00:00');
    return getAllBooks()
      .filter(b=>!b.paused&&this.isDue(b,todayDate))
      // 越早读过、拖得越久的越先复习（lastRead 升序）
      .sort((a,b)=>String(a.lastRead).localeCompare(String(b.lastRead)));
  },
  // 构建带日期的日程表
  build(){
    const sig=this.signature();
    if(this._cache&&this._sig===sig)return this._cache;
    const perDay=this.perDay();
    const queue=this.newQueue();
    const future=queue.slice();
    const days=[];
    // 预测台账：每排上一本新书，就按 learning 间隔记下它"预计该复习"的日子。
    // 这只是预演（假设家长按计划读了），今天那一格会用真实到期数据覆盖。
    const ledger=[];
    for(let i=0;i<this.PREVIEW_DAYS;i++){
      const date=LDate.offset(i);
      const weekday=new Date(date+'T00:00:00').getDay();
      const isRest=weekday===this.REST_WEEKDAY;
      const newBooks=[];
      if(!isRest){
        for(let k=0;k<perDay&&future.length;k++){
          const b=future.shift();
          newBooks.push(b);
          this.INTERVALS.learning.forEach(iv=>ledger.push({book:b,dueIndex:i+iv}));
        }
      }
      const plannedReview=[];
      ledger.forEach(e=>{
        if(e.dueIndex===i
          &&!newBooks.some(n=>n.id===e.book.id)
          &&!plannedReview.some(r=>r.id===e.book.id))plannedReview.push(e.book);
      });
      days.push({date,weekday,isRest,newBooks,plannedReview});
    }
    // 今天用"真实到期"覆盖（真实优先于预测）；最近读过的会自然掉出到期列表
    const realDue=this.dueReviewBooks();
    if(days.length){
      days[0].reviewBooks=realDue.filter(b=>!days[0].newBooks.some(n=>n.id===b.id));
      days[0].isRealToday=true;
    }
    for(let i=1;i<days.length;i++)days[i].reviewBooks=days[i].plannedReview;
    const result={days,today:LDate.today(),perDay,queueTotal:queue.length};
    this._cache=result;
    this._sig=sig;
    return result;
  },
  // 首页 / 打卡页用：今天的安排（结构 {date,isRest,newBooks:[],reviewBooks:[]}）
  today(){
    const plan=this.build();
    const today=LDate.today();
    let d=plan.days.find(x=>x.date===today);
    if(!d){
      // 今天不在预演窗口内（队列已排完等）→ 只保留真实到期的复习
      d={date:today,weekday:new Date(today+'T00:00:00').getDay(),isRest:false,newBooks:[],reviewBooks:this.dueReviewBooks()};
    }
    const doneList=(appData.todayProgress&&appData.todayProgress.books)||[];
    const done=id=>doneList.includes(id);
    return{
      date:d.date,
      isRest:!!d.isRest,
      newBooks:(d.newBooks||[]).map(b=>({...b,isNew:true,done:done(b.id)})),
      reviewBooks:(d.reviewBooks||[]).map(b=>({...b,isNew:false,done:done(b.id)}))
    };
  }
};

// ==================== LICENSE（离线签名激活码）====================
// 需求 7「变现」的地基。为什么必须用非对称签名，而不是"内置一个密码"：
//   纯前端做不出"能卖的"激活码 —— 任何写在浏览器里的"正确密码"都能被 F12 看到、无限复制。
//   所以这里反过来：私钥只有你有（在你本地那个生成器里，永不上传），
//   App 里只内置【公钥】用来验签 —— 公钥泄露也没关系，它不能拿来造码。
//   效果：改动码里任何一位 → 验签失败；到期日焊在签名里 → 改不了；完全离线，零后端。
//   局限（这点必须对用户诚实）：**防不住转发** —— 一个码可以被多个家长用。
//     真正防转发只能上云端把码绑到微信 openid（第 6 步，验证有人愿意买之后再做）。
//
// 码的结构（72 字节 → base64url，长度固定 96 个字符）：
//   payload  8 字节 = [版本 1B][功能位 1B][到期日 uint16 BE][随机 ID 4B]
//   signature 64 字节 = ECDSA P-256 + SHA-256 的 raw r||s
//   到期日存的是"自 2024-01-01 起的天数"（uint16 够用到 2203 年），0 表示永久有效。
//
// ⚠️ BUILD_ROLE 由构建脚本注入：普通包 'user'，开发者包 'developer'。
//    开发者版本永久全功能、跳过所有校验 —— 这样你自己永远不受码限制，
//    而且不需要在代码里留"后门密钥"（留了就等于公开）。
const BUILD_ROLE = 'user';
const LICENSE = {
  // 公钥（验签用；对应私钥在你本地「许可证密钥」目录，切勿上传）
  PUBLIC_KEY_JWK: {"kty":"EC","crv":"P-256","x":"z6xUjjApc7biP9pfmsXnrItMSL9_WUr4C02Zm9gP4RM","y":"auNYt0Nr7dktTBsPgz-OBHuOvBFZjgt5AN9h9OjVG_E"},
  CODE_PREFIX: 'BC1-',
  PAYLOAD_LEN: 8,
  SIG_LEN: 64,
  EPOCH_UTC: Date.UTC(2024, 0, 1),
  // 功能位（激活码里 1 字节，最多 8 位）
  // 前 5 位是【对外可售】的功能；DEV 位是【开发者身份】，只给你自己的设备用。
  FEATURES: { NEW_BOOKS: 1, UPLOAD: 2, MULTICHILD: 4, REPORT: 8, CLOUD: 16, DEV: 32 },
  // ⚠️ 对外可售的全部功能 = 31，【故意不包含 DEV 位】。
  //    这样造码工具的 --features=all 永远不会顺带解锁开发者工具，
  //    家长拿到的"全功能码"就只是会员，不会变成开发者。
  //    改动这一行前请先想清楚：它决定家长拿到的是会员还是开发者。
  ALL_FEATURES: 31,
  // 商业策略集中在这里，改这几个数就能调整，不用去翻业务代码
  POLICY: {
    trialDays: 14,          // 试用天数
    trialFeatures: 31,      // 试用期给全功能（否则家长体验不到价值，也不会买）
    expiredFeatures: 0      // 到期后只留"复习已学 / 打卡 / 词汇库"这些不依赖功能位的能力
  },
  // ---- 编解码小工具 ----
  _b64u(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  _unb64u(str) {
    const s = str.replace(/-/g, '+').replace(/_/g, '/');
    const pad = '='.repeat((4 - (s.length % 4)) % 4);
    const bin = atob(s + pad);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },
  _hex(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += ('0' + bytes[i].toString(16)).slice(-2);
    return s;
  },
  // 把用户粘进来的码洗干净（允许带前缀、空格、换行、全角空格）
  // ⚠️ 这里【绝对不能】做 toUpperCase()：码体是 base64url，大小写是有意义的两个不同字符，
  //    一旦转大写，随机数据里原本的小写字母全被改写 → 100% 验签失败。
  //    手机输入法可能自动首字母大写，所以在输入框上用 autocapitalize="off" 从源头拦住。
  normalize(code) {
    return String(code == null ? '' : code)
      .replace(/[\s\u3000]/g, '')   // 去所有空白（含全角空格）
      .replace(/^bc1-/i, '');       // 去掉前缀（只认带"-"的完整前缀，避免误删正文）
  },
  // 天偏移 → 'YYYY-MM-DD'
  dayToDate(day) {
    if (day === 0) return '永久';
    const d = new Date(this.EPOCH_UTC + day * 86400000);
    const p = n => (n < 10 ? '0' : '') + n;
    return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());
  },
  // 'YYYY-MM-DD' 相差多少天
  daysBetween(from, to) {
    return Math.round((new Date(to + 'T00:00:00') - new Date(from + 'T00:00:00')) / 86400000);
  },
  // 解析码字符串（只拆结构，不做验签）
  parse(code) {
    const raw = this.normalize(code);
    if (!raw) return { ok: false, reason: '请先粘贴激活码' };
    let bytes;
    try { bytes = this._unb64u(raw) } catch (e) { return { ok: false, reason: '格式不对，请把整段码完整复制过来' } }
    const need = this.PAYLOAD_LEN + this.SIG_LEN;
    if (bytes.length !== need) return { ok: false, reason: '码的长度不对（应为 96 个字符，实为 ' + raw.length + ' 个），请确认没有漏复制' };
    const payload = bytes.slice(0, this.PAYLOAD_LEN);
    const sig = bytes.slice(this.PAYLOAD_LEN);
    return {
      ok: true,
      version: payload[0],
      features: payload[1],
      expireDay: (payload[2] << 8) | payload[3],
      id: this._hex(payload.slice(4, 8)),
      payload, sig
    };
  },
  // 验签（异步，走浏览器原生 Web Crypto，不依赖任何第三方库）
  async verifySignature(payload, sig) {
    if (!this.PUBLIC_KEY_JWK) return { ok: false, reason: '未内置公钥，无法验签' };
    if (!(window.crypto && crypto.subtle && crypto.subtle.verify)) {
      // 加密接口只在"安全上下文"可用：https 和 file:// 都算（file:// 已实测 crypto.subtle 存在），
      // 唯独 http:// 的域名下会被浏览器禁用 —— 这种情况给明确指引，别让家长以为码是坏的。
      return { ok: false, reason: '当前打开方式不支持激活校验：请用 https 链接打开（http:// 域名下浏览器会禁用加密接口）' };
    }
    try {
      const key = await crypto.subtle.importKey('jwk', this.PUBLIC_KEY_JWK, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, sig, payload);
      return { ok: !!ok };
    } catch (e) {
      return { ok: false, reason: '验签出错：' + ((e && e.message) || e) };
    }
  },
  // 完整校验：结构 → 验签 → 到期
  async validate(code) {
    const p = this.parse(code);
    if (!p.ok) return p;
    if (p.version !== 1) return { ok: false, reason: '这个码的版本不支持，请更新 App 后再试' };
    const v = await this.verifySignature(p.payload, p.sig);
    if (!v.ok) return { ok: false, reason: v.reason || '这个码无效或已被篡改' };
    const exp = this.dayToDate(p.expireDay);
    if (p.expireDay !== 0 && exp < LDate.today()) return { ok: false, reason: '这个码已于 ' + exp + ' 到期' };
    return { ok: true, features: p.features, expireDay: p.expireDay, expireDate: exp, id: p.id };
  },
  // 当前授权状态（首页/设置页/排课都读它）
  state() {
    if (BUILD_ROLE === 'developer') {
      return { role: 'developer', features: this.ALL_FEATURES, label: '开发者版 · 永久全功能', expired: false, daysLeft: null, isDevBuild: true };
    }
    const lic = (appData && appData.license) || null;
    if (lic && lic.code) {
      const exp = this.dayToDate(lic.expireDay);
      const never = lic.expireDay === 0;
      const expired = !never && exp < LDate.today();
      // 码里带 DEV 位 → 开发者身份：全功能开放 + 基线库管理入口可见。
      // 到期后同样降级 —— 不搞"永久开发者码"，和你卖出去的码受同一套到期约束。
      if (!expired && (lic.features & this.FEATURES.DEV) !== 0) {
        return {
          role: 'developer', features: this.ALL_FEATURES,
          label: never ? '开发者模式 · 永久有效' : '开发者模式 · 有效期至 ' + exp,
          expireDate: exp, expired: false, daysLeft: null,
          code: lic.code, id: lic.id, byDevCode: true
        };
      }
      return {
        role: expired ? 'expired' : 'vip',
        features: expired ? this.POLICY.expiredFeatures : (lic.features || 0),
        label: never ? '已激活 · 永久有效' : (expired ? '已到期（' + exp + '）' : '已激活 · 有效期至 ' + exp),
        expireDate: exp, expired, daysLeft: null, code: lic.code, id: lic.id
      };
    }
    // 未激活 → 试用期
    const start = (appData && appData.trialStart) || LDate.today();
    const used = this.daysBetween(start, LDate.today());
    const left = this.POLICY.trialDays - used;
    if (left > 0) {
      return { role: 'trial', features: this.POLICY.trialFeatures, label: '试用中 · 还剩 ' + left + ' 天', daysLeft: left, expired: false };
    }
    return { role: 'expired', features: this.POLICY.expiredFeatures, label: '试用已结束', daysLeft: 0, expired: true };
  },
  // 是否具备【开发者身份】：开发者构建（dist-dev）或 用带 DEV 位的码激活。
  // 全项目唯一的开发者判定入口 —— 付费功能和基线库入口都读它，
  // 别在别处再判一次（那就会出现"两套开发者判定"，迟早不一致）。
  isDev() { return this.state().role === 'developer' },
  featureOn(bit) { return (this.state().features & bit) !== 0 },
  // 激活（写进 appData 并让排课缓存失效）
  async activate(code) {
    const r = await this.validate(code);
    if (!r.ok) return r;
    appData.license = { code: this.normalize(code), features: r.features, expireDay: r.expireDay, activatedAt: LDate.today(), id: r.id };
    save();
    return r;
  },
  deactivate() { appData.license = null; save(); }
};

// 是否"开发者构建"：build.js 打包开发者版本时会把上面的 BUILD_ROLE 换成 'developer'。
// ⚠️ 判定逻辑统一收在 LICENSE.state() / LICENSE.isDev() 里，业务代码不要再直接引用它 ——
//    否则就会出现"两套开发者判定"。这里保留只是为了让 BUILD_ROLE 的含义可查。
const IS_DEV_BUILD = (BUILD_ROLE === 'developer');

// ── 两个"开发者"概念必须分开，绝不能混 ────────────────────────────────
// · IS_DEV_BUILD        → 决定【付费功能是否解锁】（永久全功能）。只认构建期注入的角色。
//                         绝不能用"本机打开"绕过它，否则家长在自己电脑上起个本地服务就白嫖了。
// · canManageBaseline()  → 决定【基线库管理这个内容维护工具是否显示】。
//                         它没有付费价值：导出的 baseline_books.js 只会落回开发者自己的电脑，
//                         家长拿到也别无用处。所以本机打开（双击文件 / localhost）也开放，
//                         方便随时录绘本；线上域名一律不显示，家长永远看不到这个入口。
// 注意 typeof 守卫：LICENSE 模块要能在纯 Node 环境里被抽取出来做单元测试（无 location）。
// 少了这个守卫，测试脚本会直接 ReferenceError —— 顺便也是给未来小程序/SSR 环境留的余地。
const IS_LOCAL_DEBUG = (typeof location !== 'undefined') && (
                        location.protocol === 'file:' ||
                        location.hostname === 'localhost' ||
                        location.hostname === '127.0.0.1' ||
                        location.hostname === '[::1]');
// 每次渲染时求值（而不是模块加载时算一次）——
// 这样用开发者激活码解锁后，不用刷新页面，「基线库管理」入口立刻就出来了。
// IS_DEV_BUILD 已包含在 LICENSE.isDev() 里，不再重复判断。
function canManageBaseline() { return IS_LOCAL_DEBUG || LICENSE.isDev() }


// ==================== COMPATIBILITY CHECK ====================
// 手机自带浏览器兼容性检测
const Compat={
  // 检测Web Speech API支持
  hasTTS:!!(window.speechSynthesis&&window.SpeechSynthesisUtterance),
  // 检测localStorage可用性
  hasStorage:(()=>{try{const t='__test';localStorage.setItem(t,'1');localStorage.removeItem(t);return true}catch(e){return false}})(),
  // 检测FileReader支持
  hasFileReader:!!window.FileReader,
  // 检测WebAssembly支持（Tesseract.js需要）
  hasWASM:(()=>{try{if(typeof WebAssembly==='object'&&typeof WebAssembly.instantiate==='function')return true}catch(e){}return false})(),
  // 检测async/await支持
  hasAsync:(()=>{try{new Function('return async()=>{}')();return true}catch(e){return false}})(),
  // 检测是否iOS Safari（需要特殊处理手势触发）
  isIOS:/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream,
  // 检测是否国产浏览器（华为/小米/OPPO/vivo/UC等）
  isCNBrowser:/HBPC|MiuiBrowser|OppoBrowser|VivoBrowser|UCBrowser|QQBrowser|Baidu|Sogou|LieBao/.test(navigator.userAgent),
  // 检测是否微信内置浏览器。
  // 为什么必须单独判定：微信 webview 里【没有"添加到桌面"入口】，而且 Service Worker
  // 行为在各版本微信里不一致（离线经常打不开）。而微信恰恰是这个产品最主要的传播渠道
  // —— 家长都是通过微信收到链接的。所以必须显式引导"在浏览器中打开"。
  isWeChat:/micromessenger/i.test(navigator.userAgent),
  // 综合检测：返回不兼容的功能列表
  getUnsupported(){
    const list=[];
    if(!this.hasTTS)list.push('语音发音');
    if(!this.hasStorage)list.push('数据保存');
    if(!this.hasFileReader)list.push('文件导入');
    if(!this.hasWASM)list.push('拍照OCR');
    if(!this.hasAsync)list.push('批量导入');
    return list;
  },
  // 是否基本可用（至少有storage和TTS）
  isUsable(){
    return this.hasStorage;
  }
};

// ==================== LIB LAZY LOADER ====================
// 按需加载重型第三方库（Tesseract.js 拍照OCR / xlsx Excel导入）。
//
// 为什么需要它：
//   这两个库原先以同步标签写在 head 里，会阻塞首屏渲染；jsdelivr 在国内
//   经常极慢甚至被墙，于是所有人打开首页都被它们拖住十几秒。
//   而实际只有"拍照导入"和"Excel 导入"两个边缘功能用得到，不该让 100% 用户买单。
//
// 策略：
//   ① 多 CDN 依次尝试（jsdelivr → unpkg → 字节跳动静态源），任一成功即停止；
//   ② 每个库只加载一次（用 Promise 缓存），并发调用共享同一个 Promise；
//   ③ 单次注入带超时，避免弱网下无限等待；
//   ④ 全部源失败时抛出可读错误，由调用方 toast 明确提示（不再静默失败）。
const LibLoader=(()=>{
  const CDNS={
    tesseract:[
      'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
      'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js',
      'https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/tesseract.js/5.0.4/tesseract.min.js'
    ],
    xlsx:[
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/xlsx/0.18.5/xlsx.full.min.js'
    ]
  };
  const cache={};   // 库名 → Promise；同时承担"只加载一次"和"并发共享"两个职责
  // 注入 <script> 并等待 onload/onerror，带超时
  function inject(url,timeout){
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=url;s.async=true;
      let done=false;
      const timer=setTimeout(()=>{if(!done){done=true;s.remove();reject(new Error('timeout'))}},timeout);
      s.onload=()=>{if(!done){done=true;clearTimeout(timer);resolve(url)}};
      s.onerror=()=>{if(!done){done=true;clearTimeout(timer);s.remove();reject(new Error('network'))}};
      document.head.appendChild(s);
    });
  }
  // 依次尝试 CDN 列表
  function load(name,timeout){
    if(cache[name])return cache[name];
    cache[name]=(async()=>{
      const urls=CDNS[name]||[];
      let lastErr=null;
      for(const u of urls){
        try{await inject(u,timeout);return u}
        catch(e){lastErr=e;console.warn('[LibLoader] 源失败，换下一个:',u,e&&e.message)}
      }
      cache[name]=null;   // 全部失败 → 清空缓存，允许用户稍后重试（而非永久失败）
      throw lastErr||new Error('load failed');
    })();
    return cache[name];
  }
  return {
    tesseract:(timeout=20000)=>load('tesseract',timeout),   // 拍照OCR；主包较大，给 20s
    xlsx:(timeout=15000)=>load('xlsx',timeout),             // Excel 导入
    // 供"设置/诊断"判断某库是否已经就绪
    isReady(name){return name==='tesseract'?typeof Tesseract!=='undefined':typeof XLSX!=='undefined'}
  };
})();

// ==================== AUDIO TTS (降级方案) ====================
// 当浏览器不支持Web Speech API时，用<audio>播放有道词典TTS MP3
// 有道TTS接口：https://dict.youdao.com/dictvoice?audio={text}&type=2 (type=2=美音)
// 优点：所有浏览器都支持<audio>播放MP3，无需WebAssembly
const AudioTTS={
  audio:null,
  queue:[],
  playing:false,
  speed:0.8,
  playBlocked:false,   // 上一次 play() 是否被浏览器"自动播放策略"拦下（供 TTS 补提示）
  init(){
    this.audio=new Audio();
    // 不设置crossOrigin，避免有道TTS接口不返回CORS头导致加载失败
    this.audio.onended=()=>{setTimeout(()=>this._playNext(),300)};  // 句间停顿300ms
    this.audio.onerror=(e)=>{console.warn('AudioTTS error',e);setTimeout(()=>this._playNext(),500)};
  },
  // 应用当前语速到audio元素（HTML5 playbackRate，所有浏览器支持）
  _applySpeed(){
    if(!this.audio)return;
    // 限制范围0.5-2.0，避免太慢没法播或太快听不清
    const rate=Math.max(0.5,Math.min(2.0,this.speed));
    this.audio.playbackRate=rate;
    this.audio.defaultPlaybackRate=rate;  // 影响后续加载的音频
  },
  speak(text,lang){
    if(!text||lang==='zh-CN')return;  // 中文TTS跳过（有道词典不支持中文TTS）
    if(!this.audio)this.init();       // 兜底：任何路径下先保证 audio 元素存在
    this.stop();
    const encoded=encodeURIComponent(text);
    const url=`https://dict.youdao.com/dictvoice?audio=${encoded}&type=2`;
    this.audio.src=url;
    this._applySpeed();  // 播放前应用语速
    this.audio.play().then(()=>{this.playBlocked=false}).catch(e=>{
      // 被自动播放策略拦下（静默不出声）：标记出来，由 TTS._switchToAudio 提示用户再点一次
      this.playBlocked=true;
      console.warn('AudioTTS play error',e);
    });
  },
  speakSequence(items,callback){
    this.queue=items.slice();
    this.callback=callback;
    this.playing=true;
    this._playNext();
  },
  _playNext(){
    // 防止stop后onended仍触发_playNext
    if(!this.playing&&this.queue.length===0)return;
    if(this.queue.length===0){this.playing=false;return}  // 队列空：结束，不再调用callback（callback是逐句的，不是结束时调）
    const item=this.queue.shift();
    // 安全调用callback（播放前高亮当前句）
    if(this.callback&&item)this.callback(item);
    if(item.lang==='zh-CN'){setTimeout(()=>this._playNext(),200);return}  // 中文跳过，200ms后下一句
    const encoded=encodeURIComponent(item.text);
    const url=`https://dict.youdao.com/dictvoice?audio=${encoded}&type=2`;
    this.audio.src=url;
    this._applySpeed();  // 播放前应用语速
    this.audio.play().catch(()=>setTimeout(()=>this._playNext(),500));  // 播放失败500ms后下一句
  },
  stop(){
    this.queue=[];
    this.playing=false;
    this.callback=null;  // 清理callback，防止onended触发旧回调
    if(this.audio){this.audio.pause();this.audio.currentTime=0}
  },
  // 实时调速：播放中也可立即生效
  setSpeed(s){
    this.speed=s;
    this._applySpeed();  // 立即应用到当前播放
  }
};

// ==================== TTS ====================
const TTS = {
  synth:window.speechSynthesis,
  voice:null,
  speed:0.8,
  queue:[],
  playing:false,
  // 是否使用AudioTTS降级方案
  useFallback:!Compat.hasTTS,
  /* ---------- P1-12 静默失败看门狗 ----------
   * 真实症状（安卓微信 / 部分国产浏览器）：
   *   window.speechSynthesis 和 SpeechSynthesisUtterance 两个对象【都在】，
   *   speak() 调用了也【不报错】，但就是【一声不出】。
   * 旧逻辑的漏洞：兼容性只看"接口存不存在" → hasTTS = true → 永远走手机自带语音、永不降级
   *   → 家长点句子毫无反应，只会以为"这软件坏了 / 我手机坏了"。
   * 现在的做法：每次朗读挂一个 1.8 秒看门狗，到点仍没收到 onstart 事件（=哑火）就记一次；
   *   累计 2 次（或用户主动点了设置页的"测试发音"）→ 自动切到在线音频发音，并明确告知用户。
   */
  silentStrikes:0,      // 累计"哑火"次数
  autoSwitched:false,   // 是否已被自动接管到在线音频
  _wdTimer:null,        // 看门狗定时器
  _wdId:0,              // 看门狗编号（防止旧朗读的 onerror 误杀新朗读的定时器）
  _wdOwner:0,           // 当前看门狗归属的编号
  _spokenOk:false,      // 最近一次朗读是否真的出声了（供"测试发音"读结果）
  _testPending:false,   // 正在跑"测试发音"（此时一次哑火即切换，不必等第二次）
  init(){
    // 上一次会话已判定手机自带语音哑火并被自动接管 → 本次直接沿用在线音频，
    // 免得家长每次打开都要"点两下才出声"（体验极差，还会以为软件坏了）。
    if(appData&&appData.settings&&appData.settings.ttsForceAudio){
      this.useFallback=true;this.autoSwitched=true;
    }
    if(this.useFallback){
      // 降级到AudioTTS：用<audio>播放有道词典TTS MP3
      console.warn('Web Speech API not available, using AudioTTS fallback');
      AudioTTS.init();
      return;
    }
    const setVoice=()=>{const vs=this.synth.getVoices().filter(v=>v.lang.startsWith('en'));this.voice=vs[0]||null};
    setVoice();
    if(this.synth.onvoiceschanged!==undefined)this.synth.onvoiceschanged=setVoice;
    // iOS Safari: 预热TTS引擎（需在用户手势中调用）
    if(Compat.isIOS){
      document.addEventListener('touchstart',()=>this.warmup(),{once:true});
    }
  },
  // 获取当前TTS引擎名称。
  // ① 要说清"为什么现在用这个引擎"，否则家长看到"音频降级"会以为软件坏了；
  // ② 一律用"手机自带语音"，不向家长甩 Web Speech API 这种术语 ——
  //    技术细节留给「兼容性自检」（UI.compatCheck）去展示，那里才是排查用的。
  getEngineName(){
    if(this.autoSwitched)return'在线音频（手机自带语音不出声，已自动切换）';
    if(this.useFallback)return Compat.hasTTS?'在线音频（手动选择 · 需联网）':'在线音频（本浏览器不支持手机自带语音）';
    return'手机自带语音（离线可用）';
  },
  // iOS预热：播放一个空utterance解锁TTS
  warmup(){
    if(!Compat.hasTTS)return;
    try{
      const u=new SpeechSynthesisUtterance('');
      u.volume=0;
      this.synth.speak(u);
    }catch(e){}
  },
  // 挂看门狗：speak() 之后 1.8s 内没触发 onstart 就判定"哑火"
  _armWatchdog(text,lang,u,keepError){
    const myId=++this._wdId;
    this._disarmWatchdog();          // 先杀掉上一次的（用户连点时只保留最新一次）
    this._spokenOk=false;
    let started=false;
    u.onstart=()=>{started=true;this._spokenOk=true;this._disarmWatchdog(myId)};
    // keepError=true 时不要覆盖调用方自己的 onerror（连读队列靠它推进）
    if(!keepError)u.onerror=()=>{started=true;this._disarmWatchdog(myId)};
    this._wdOwner=myId;
    this._wdTimer=setTimeout(()=>{
      this._wdTimer=null;
      if(myId!==this._wdOwner)return;   // 已经不是当前这次朗读了，忽略
      if(started)return;                // 出过声：正常，什么都不做
      this.silentStrikes++;
      // 连点两次都不出声，或用户主动点了"测试发音" → 立刻接管
      if(this.silentStrikes>=2||this._testPending)this._switchToAudio(text,lang);
    },1800);
  },
  // 关看门狗。传了 id 时，只有"当前归属"才允许关（防止旧朗读把新朗读的定时器杀掉）
  _disarmWatchdog(id){
    if(id!==undefined&&this._wdOwner!==id)return;
    if(this._wdTimer){clearTimeout(this._wdTimer);this._wdTimer=null}
    this._wdOwner=0;
  },
  // 自动接管：切到在线音频发音（有道 MP3），并把"这台设备要用在线音频"持久化下来
  _switchToAudio(text,lang){
    if(this.autoSwitched)return;
    this.autoSwitched=true;
    this.useFallback=true;
    this._disarmWatchdog();
    AudioTTS.init();
    AudioTTS.speed=this.speed;
    if(appData&&appData.settings&&typeof save==='function'){
      appData.settings.ttsForceAudio=true;
      try{save()}catch(e){}
    }
    if(typeof toast==='function')toast('🔊 手机自带语音不出声，已切换到在线音频（需联网）');
    // 立刻重播一次：正常应立刻出声；若被浏览器"自动播放策略"拦下，600ms 后补一句提示
    if(text){
      AudioTTS.speak(text,lang);
      setTimeout(()=>{
        if(AudioTTS.playBlocked&&typeof toast==='function')toast('👆 请再点一下句子，就能发声了');
      },600);
    }
  },
  // 设置页的"测试发音"：先分辨"到底能不能出声"，再决定要不要切换
  testSpeak(){
    const el=typeof $==='function'?$('#tts-test-status'):null;
    if(el)el.textContent='播放中…';
    this._testPending=true;
    this.speak('Hello! Let us read a book.');
    setTimeout(()=>{
      this._testPending=false;
      const el2=typeof $==='function'?$('#tts-test-status'):null;
      if(this.useFallback){if(el2)el2.textContent='✅ 在线音频（已自动切换）';return}
      if(this._spokenOk){
        if(el2)el2.textContent='✅ 发音正常';
        if(typeof toast==='function')toast('✅ 发音正常，点句子就能读出来');
      }else{
        if(el2)el2.textContent='⚠️ 未检测到声音';
        if(typeof toast==='function')toast('⚠️ 没听到声音？请先确认手机「媒体音量」没调到 0 或静音');
      }
    },2400);
  },
  // 手动切换发音引擎。
  // 为什么需要：部分安卓机的自带英文语音口音重/很难听，家长宁可费点流量用在线音频；
  // 反过来也有家长想省流量、想断网也能读，就要切回手机自带语音。给选择权，别替家长决定。
  toggleEngine(){
    this._disarmWatchdog();
    const toAudio=!this.useFallback;
    this.autoSwitched=false;          // 手动选择 ≠ 自动接管，标签要能区分
    this.silentStrikes=0;             // 手动切回手机自带语音后，重新开始累计哑火次数
    this.useFallback=toAudio;
    if(appData&&appData.settings&&typeof save==='function'){
      appData.settings.ttsForceAudio=toAudio;
      try{save()}catch(e){}
    }
    if(toAudio){
      AudioTTS.init();
      AudioTTS.speed=this.speed;
      if(typeof toast==='function')toast('🔊 已切换为在线音频发音（需要联网）');
    }else{
      if(typeof toast==='function')toast('📱 已切回手机自带语音（可离线使用）');
    }
    // 立刻试读一句，让家长马上听到效果
    this.speak('Hello! Let us read a book.');
    // 重渲染，让"当前发音引擎 / 切换提示"两行文字同步刷新
    if(typeof UI!=='undefined'&&UI.renderProfile)UI.renderProfile();
  },
  speak(text,lang){
    // P0-3: 离线降级策略 — Web Speech API 优先（离线可用）
    if(!text)return;
    // 中文TTS（之前直接跳过，现在支持）
    if(lang==='zh-CN'){
      if(Compat.hasTTS){
        try{
          this.synth.cancel();
          const u=new SpeechSynthesisUtterance(text);
          u.lang='zh-CN';
          u.rate=0.9;
          const zhVoice=this.synth.getVoices().find(v=>v.lang.startsWith('zh'));
          if(zhVoice)u.voice=zhVoice;
          this.synth.speak(u);
        }catch(e){}
      }
      return;
    }
    // 英文TTS: 优先 Web Speech API（同时挂看门狗，识别"接口在、却不出声"）
    if(!this.useFallback&&Compat.hasTTS){
      try{
        this.synth.cancel();
        const u=new SpeechSynthesisUtterance(text);
        u.lang=lang||'en-US';
        u.rate=this.speed;
        if(this.voice)u.voice=this.voice;
        this._armWatchdog(text,lang,u);
        this.synth.speak(u);
      }catch(e){
        console.warn('Web Speech API failed, falling back to AudioTTS',e);
        AudioTTS.speak(text,lang);
      }
    }else{
      // 次选：有道API（需联网）
      AudioTTS.speak(text,lang);
    }
  },
  speakSequence(items,callback){
    if(this.useFallback){
      // 降级到AudioTTS
      AudioTTS.speakSequence(items,callback);
      return;
    }
    if(!Compat.hasTTS||items.length===0)return;
    this.synth.cancel();
    this.queue=items.slice();
    this.playing=true;
    let first=true;
    const playNext=()=>{
      if(this.queue.length===0){this.playing=false;return}  // 队列空：结束，不调用callback
      const item=this.queue.shift();
      const u=new SpeechSynthesisUtterance(item.text);
      u.lang=item.lang||'en-US';
      u.rate=this.speed;
      if(this.voice&&u.lang.startsWith('en'))u.voice=this.voice;
      u.onend=()=>{setTimeout(playNext,400)};
      u.onerror=()=>playNext();
      // 只在第一句挂看门狗：手机自带语音若哑火，第一句就会暴露；后面几十句没必要逐句试探
      if(first){first=false;this._armWatchdog(item.text,item.lang,u,true)}
      this.synth.speak(u);
      // 播放前高亮当前句
      if(callback&&item)callback(item);
    };
    playNext();
  },
  stop(){
    this._disarmWatchdog();
    if(this.useFallback){AudioTTS.stop();return}
    this.synth.cancel();this.queue=[];this.playing=false;
  },
  setSpeed(s){
    this.speed=s;
    AudioTTS.speed=s;
  }
};

// ==================== ADAPTIVE ENGINE ====================
// 自适应学习引擎：难度自适应 + 兴趣追踪 + 输出追踪
const AdaptiveEngine = {
  // 难度自适应：连续3本掌握→升难度；2本困难→降难度
  updateDifficulty(book,action){
    appData.difficultyHistory=appData.difficultyHistory||[];
    // action: 'mastered' | 'struggling'
    appData.difficultyHistory.push({bookId:book.id,level:book.level,action,date:LDate.today()});
    // 只看最近5次记录
    appData.difficultyHistory=appData.difficultyHistory.slice(-5);
    const recent=appData.difficultyHistory;
    const last3=recent.slice(-3);
    const mastered3=last3.length===3&&last3.every(r=>r.action==='mastered'&&r.level===book.level);
    const last2=recent.slice(-2);
    const struggling2=last2.length===2&&last2.every(r=>r.action==='struggling'&&r.level===book.level);
    const order=['A','B','C'];
    const idx=order.indexOf(book.level);
    if(mastered3&&idx<2){
      appData.recommendedLevel=order[idx+1];
      return{adjust:'up',to:order[idx+1]};
    }
    if(struggling2&&idx>0){
      appData.recommendedLevel=order[idx-1];
      return{adjust:'down',to:order[idx-1]};
    }
    appData.recommendedLevel=book.level;
    return{adjust:'none',to:book.level};
  },
  // 兴趣追踪：用户标记喜欢/一般，按主题累计
  recordInterest(theme,liked){
    appData.interests=appData.interests||{};
    if(liked){
      appData.interests[theme]=(appData.interests[theme]||0)+1;
    }else{
      appData.interests[theme]=Math.max(0,(appData.interests[theme]||0)-1);
    }
    save();
  },
  // 输出追踪：记录孩子主动说的英文词
  recordOutput(word){
    if(!word||word.length<2)return;
    word=word.toLowerCase().trim();
    appData.outputWords=appData.outputWords||[];
    if(!appData.outputWords.includes(word)){
      appData.outputWords.push(word);
      save();
      // 如果该词在已学词汇中，标记为"已激活"
      if(appData.learnedWords&&appData.learnedWords.includes(word)){
        appData.activatedWords=appData.activatedWords||[];
        if(!appData.activatedWords.includes(word))appData.activatedWords.push(word);
      }
      return true;
    }
    return false;
  },
  // 获取自适应推荐：今日精读应该读哪个难度的书
  getRecommendedLevel(){
    return appData.recommendedLevel||'A';
  },
  // 获取孩子兴趣主题Top3
  getTopInterests(){
    const interests=appData.interests||{};
    return Object.entries(interests).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t])=>t);
  },
  // 获取输出统计
  getOutputStats(){
    const total=appData.outputWords?appData.outputWords.length:0;
    const activated=appData.activatedWords?appData.activatedWords.length:0;
    const learned=appData.learnedWords?appData.learnedWords.length:0;
    return{total,activated,learned,activationRate:learned>0?Math.round(activated/learned*100):0};
  },
  // 拓展自适应：根据掌握程度推荐策略
  getRecommendedStrategy(book){
    const knownCount=book.vocab.filter(v=>appData.learnedWords&&appData.learnedWords.includes(v.word)).length;
    const masteryRate=book.vocab.length>0?knownCount/book.vocab.length:0;
    if(masteryRate<0.3)return'diff1';  // 替换
    if(masteryRate<0.7)return'diff2';  // 变形
    return'diff3';  // 组合
  }
};

// ==================== REMINDER ENGINE ====================
// 智能提醒系统：复习提醒 + 进度预警 + 难度调整 + 里程碑庆祝
const ReminderEngine = {
  // 生成今日所有提醒
  getReminders(){
    const reminders=[];
    const today=LDate.today();
    const todayDate=new Date(today+'T00:00:00');
    // 1. 复习到期提醒
    const dueReviews=this.getDueReviews(todayDate);
    if(dueReviews.length>0){
      reminders.push({
        type:'review',
        icon:'🔄',
        priority:'high',
        title:'复习提醒',
        desc:`${dueReviews.length}本绘本到期复习：${dueReviews.slice(0,3).map(b=>b.title).join('、')}${dueReviews.length>3?'等':''}`
      });
    }
    // 2. 进度预警：连续N天未打卡
    const noCheckinDays=this.getNoCheckinDays(todayDate);
    if(noCheckinDays>=2){
      reminders.push({
        type:'streak',
        icon:'⏰',
        priority:'medium',
        title:'打卡提醒',
        desc:noCheckinDays>=3?`已${noCheckinDays}天未打卡，坚持每天读英语效果更好哦！`:'昨天没打卡，今天继续吧！'
      });
    }
    // 3. 难度调整提醒
    const recLevel=AdaptiveEngine.getRecommendedLevel();
    const masteredCount=(appData.books||[]).filter(b=>b.status==='mastered').length;
    if(recLevel!=='A'&&masteredCount>0){
      reminders.push({
        type:'level',
        icon:'📈',
        priority:'low',
        title:'难度建议',
        desc:`宝宝表现不错，推荐尝试Level ${recLevel}的绘本`
      });
    }
    // 4. 里程碑庆祝
    const milestone=this.checkMilestone();
    if(milestone){
      reminders.push({
        type:'milestone',
        icon:milestone.icon,
        priority:'high',
        title:'🎉 里程碑达成！',
        desc:milestone.desc,
        celebrate:true
      });
    }
    return reminders;
  },
  getDueReviews(todayDate){
    // 统一到 Plan.isDue —— 全项目只保留一个"该不该复习"的判定。
    // 原来这里自己又抄了一份间隔表，会出现"提醒说该复习了、计划页却没有它"（或反过来）
    // 这种自相矛盾，家长会彻底不信这个 App。
    return getAllBooks().filter(b=>!b.paused&&Plan.isDue(b,todayDate));
  },
  getNoCheckinDays(todayDate){
    if(!appData.lastCheckin)return 0;
    return Math.floor((todayDate-new Date(appData.lastCheckin+'T00:00:00'))/86400000);
  },
  // 里程碑检测：已标记完成的不再触发
  checkMilestone(){
    const milestones=appData.milestones||[];
    const masteredCount=(appData.books||[]).filter(b=>b.status==='mastered').length;
    const totalOutput=(appData.outputWords||[]).length;
    const learnedCount=(appData.learnedWords||[]).length;
    const checks=[
      {id:'m1',icon:'🎯',cond:masteredCount>=1,desc:'宝宝掌握第1本绘本！'},
      {id:'m2',icon:'📖',cond:masteredCount>=5,desc:'掌握5本绘本，词汇量稳步增长！'},
      {id:'m3',icon:'📚',cond:masteredCount>=10,desc:'掌握10本绘本，太棒了！'},
      {id:'m4',icon:'💬',cond:learnedCount>=20,desc:'累计学习20个词汇！'},
      {id:'m5',icon:'🌟',cond:learnedCount>=50,desc:'累计学习50个词汇！'},
      {id:'m6',icon:'🗣️',cond:totalOutput>=5,desc:'宝宝主动说出5个英文词！'},
      {id:'m7',icon:'🏆',cond:totalOutput>=20,desc:'宝宝主动说出20个英文词！'},
      {id:'m8',icon:'🔥',cond:appData.streak>=7,desc:'连续打卡7天！'},
      {id:'m9',icon:'⭐',cond:appData.streak>=30,desc:'连续打卡30天！'}
    ];
    for(const m of checks){
      if(m.cond&&!milestones.includes(m.id)){
        // 标记为已完成
        appData.milestones=appData.milestones||[];
        appData.milestones.push(m.id);
        save();
        return m;
      }
    }
    return null;
  }
};

// ==================== STORAGE ====================
const Store = {
  key:'eng_app_v1',
  load(){
    try{const d=localStorage.getItem(this.key);return d?JSON.parse(d):null}catch(e){return null}
  },
  save(data){
    try{localStorage.setItem(this.key,JSON.stringify(data))}catch(e){console.error('Storage error',e)}
  },
  init(){
    let data=this.load();
    // 基线库数据源
    const BL=window.BASELINE_BOOKS||{version:0,books:[]};
    if(!data){
      // 首次使用：分析基线库全部绘本
      const analyzedBooks=BL.books.map(b=>{
        const a=Analyzer.analyze(b);
        return{...a,source:'baseline',status:'unlearned',readCount:0,lastRead:null,history:[]};
      });
      data={
        books:analyzedBooks,
        customBooks:[],
        baselineVersion:BL.version,
        checkins:{},
        streak:0,
        lastCheckin:null,
        learnedWords:[],
        babyName:'小宝',
        startDate:LDate.today(),
        // 孩子档案：生日（用于后续按年龄约束推荐难度，当前先做记录）
        birthDate:null,
        // dailyMinutes = 家长每天能陪读多久，直接决定每天排 1 本还是 2 本
        settings:{speed:0.8,autoNext:true,dailyMinutes:10},
        todayProgress:{books:[],listenMin:0},
        isDev:false,
        // 授权（离线签名激活码，见 LICENSE 模块）
        license:null,                 // {code,features,expireDay,activatedAt,id}；null = 尚未激活
        trialStart:LDate.today(),     // 试用起始日：首次使用即定死。若每次拿"今天"兜底，就会变成永久试用
        dataVersion:7,
        // Adaptive Engine 数据
        interests:{},
        outputWords:[],
        activatedWords:[],
        difficultyHistory:[],
        recommendedLevel:'A',
        milestones:[],
        // 去重配置
        dedup:{enabled:true,strictness:'standard',ignoreCasePunct:true}
      };
      this.save(data);
    }else{
      // 版本检测+迁移
      const ver=data.dataVersion||1;
      let needSave=ver<7;

      // v1→v2: 分析所有书籍的vocab/pattern/level
      if(ver<2){
        data.books=(data.books||[]).map(b=>{
          if(!b.analyzed||!b.vocab||b.vocab.length===0){
            const a=Analyzer.analyze(b);
            return{...a,...b,vocab:a.vocab,pattern:a.pattern,theme:a.theme,level:a.level,sentences:a.sentences,wordCount:a.wordCount,analyzed:true};
          }
          return b;
        });
        data.customBooks=(data.customBooks||[]).map(b=>{
          if(!b.analyzed||!b.vocab||b.vocab.length===0){
            const a=Analyzer.analyze(b);
            return{...a,...b,vocab:a.vocab,pattern:a.pattern,theme:a.theme,level:a.level,sentences:a.sentences,wordCount:a.wordCount,analyzed:true};
          }
          return b;
        });
      }
      // v2→v3: 自适应引擎字段补全
      if(ver<3){
        if(!data.interests)data.interests={};
        if(!data.outputWords)data.outputWords=[];
        if(!data.activatedWords)data.activatedWords=[];
        if(!data.difficultyHistory)data.difficultyHistory=[];
        if(!data.recommendedLevel)data.recommendedLevel='A';
        if(!data.milestones)data.milestones=[];
      }
      // v3→v4: 基线库分离 + source标记
      if(ver<4){
        // 给已有书打source标记
        data.books=(data.books||[]).map(b=>{
          if(!b.source)b.source='baseline';
          return b;
        });
        data.customBooks=(data.customBooks||[]).map(b=>{
          if(!b.source)b.source='private';
          return b;
        });
        if(!data.baselineVersion)data.baselineVersion=0;
      }
      // v4→v5: 开发者权限字段
      if(ver<5){
        if(data.isDev===undefined)data.isDev=false;
      }
      // v5→v6: 计划模块（Plan）所需字段（dailyMinutes / paused 由字段补全区兜底）
      // v6→v7: 授权字段
      if(ver<7){
        if(data.license===undefined)data.license=null;
        // 老用户从"升级到本版本那天"开始算试用：不追溯惩罚（不能因为装得早就没得试），
        // 也不白送（不能因为数据老就永久免费）。
        if(!data.trialStart)data.trialStart=LDate.today();
      }

      // ===== 分析版本迁移（与 dataVersion 解耦，独立判断）=====
      // 只要本地缓存的分析版本号 != 当前 ANALYSIS_VERSION，就整体重算一遍。
      // 必须做这一步的原因：
      //   · 旧版本曾把"书名行"从原文列里拆出去，缓存中的 sentences[0] 是空串
      //     → 用户看到"绘本原文"第 1 行空白（见截图）
      //   · 旧缓存里的中文翻译是老引擎产物，不重算就永远看不到优化后的译文
      // 重算会：重新切句（书名行回到第 1 行且整句翻译）+ 重新生成全部中文翻译。
      // 学习进度（status / readCount / history）因为 {...b} 展开而完整保留。
      if(data.analysisVer!==ANALYSIS_VERSION){
        const reAnalyze=b=>{
          const a=Analyzer.analyze(b);
          return{...b,...a,analysisVer:ANALYSIS_VERSION};
        };
        data.books=(data.books||[]).map(reAnalyze);
        data.customBooks=(data.customBooks||[]).map(reAnalyze);
        data.analysisVer=ANALYSIS_VERSION;
        needSave=true;
      }

      // ===== 基线库更新检测 =====
      // 比较本地版本号和外部文件版本号，合并新书
      if(BL.version>0&&BL.version>(data.baselineVersion||0)){
        const existingIds=new Set(data.books.map(b=>b.id));
        let newCount=0,skipCount=0;
        BL.books.forEach(blBook=>{
          if(existingIds.has(blBook.id)){skipCount++;return}
          // 拦截点2：L2查重（书名+系列相同则跳过，保留用户进度）
          const dup=Dedup.findDuplicate(blBook,data.books,'standard');
          if(dup.level!=='none'){
            skipCount++;return;
          }
          const a=Analyzer.analyze(blBook);
          data.books.push({...a,source:'baseline',status:'unlearned',readCount:0,lastRead:null,history:[]});
          newCount++;
        });
        data.baselineVersion=BL.version;
        needSave=true;
        if(newCount>0&&typeof toast==='function'){
          setTimeout(()=>toast(`基线库更新：新增${newCount}本绘本${skipCount>0?'，跳过'+skipCount+'本重复':''}`),500);
        }
      }

      // 字段补全
      if(!data.settings)data.settings={speed:0.8,autoNext:true,dailyMinutes:10};
      if(!data.settings.dailyMinutes)data.settings.dailyMinutes=10;
      if(data.birthDate===undefined)data.birthDate=null;
      if(!data.todayProgress)data.todayProgress={books:[],listenMin:0};
      if(!data.learnedWords)data.learnedWords=[];
      if(!data.checkins)data.checkins={};
      if(!data.books)data.books=[];
      if(!data.customBooks)data.customBooks=[];
      if(!data.streak)data.streak=0;
      if(!data.babyName)data.babyName='小宝';
      if(!data.startDate)data.startDate=LDate.today();
      if(!data.dedup)data.dedup={enabled:true,strictness:'standard',ignoreCasePunct:true};
      // 授权字段兜底（迁移逻辑万一漏了，这里也保证不会出现"永久试用"）
      if(data.license===undefined)data.license=null;
      if(!data.trialStart)data.trialStart=LDate.today();
      data.dataVersion=7;
      if(needSave)this.save(data);
    }
    return data;
  }
};

function $(s,p){return(p||document).querySelector(s)}
function $$(s,p){return Array.from((p||document).querySelectorAll(s))}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
// 统一的保存入口。任何一次保存都可能改变排课的输入（状态 / 暂停 / 最后阅读日），
// 所以在这里统一让计划缓存失效 —— 不必在每一处改状态的地方都记得手动清缓存，
// 漏一处就会出现"改了书的状态但计划不更新"的怪 bug。
function save(){Store.save(appData);try{Plan.invalidate()}catch(e){}}
function getBook(id){return appData.books.find(b=>b.id===id)||appData.customBooks.find(b=>b.id===id)}
function getAnalyzedBook(id){
  const b=getBook(id);
  if(!b)return null;
  // 如果已分析但缺少核心字段（如句子级翻译 sentenceTranslations），强制重新分析
  // 避免旧版本 localStorage 数据缺少中文翻译导致"绘本原文"只显示英文
  // 完成度必须同时满足 4 个条件，缺一就重算：
  //   1) 已分析
  //   2) 分析版本号 == 当前引擎版本（引擎升级后旧数据必须重算）
  //      ← 之前漏了这个判断，导致旧缓存里 sentences[0]=''（书名行被拆掉）
  //        的数据被永久认定为"已完成"，原文列第 1 行永远是空白
  //   3) 句子级翻译齐全
  //   4) 句子数 > 0
  const sentenceCount=b.sentences?.length||0;
  const isCompleteAnalysis = b.analyzed
    && b.analysisVer === ANALYSIS_VERSION
    && Array.isArray(b.sentenceTranslations)
    && b.sentenceTranslations.length === sentenceCount
    && sentenceCount > 0;
  if(isCompleteAnalysis)return b;
  const analyzed=Analyzer.analyze(b);
  Object.assign(b,analyzed);
  // 重新分析后持久化到 Store，以免每次都重复分析
  if(typeof Store!=='undefined' && Store.save && appData) Store.save(appData);
  return b;
}
function getAllBooks(){return[...appData.books,...appData.customBooks]}
function getLearnedWordsSet(){return new Set(appData.learnedWords)}

  toggleListen(){
    if(listenTimer){
      clearInterval(listenTimer);listenTimer=null;
      appData.todayProgress.listenMin=listenSeconds;
      save();
      TTS.stop(); // P2: 停止熏听音频
      const btn=$('#listen-toggle-btn');
      if(btn)btn.textContent='▶ 开始熏听';
    }else{
      // P2: 熏听 = 计时 + TTS连读当天绘本
      listenTimer=setInterval(()=>{
        listenSeconds++;
        const el=$('#listen-time');
        const bar=$('#listen-fill');
        if(el)el.textContent=`${Math.floor(listenSeconds/60)}:${String(listenSeconds%60).padStart(2,'0')}`;
        if(bar)bar.style.width=Math.min(100,listenSeconds/1800*100)+'%';
      },1000);
      const btn=$('#listen-toggle-btn');
      if(btn)btn.textContent='⏸ 暂停';
      // 播放当天绘本音频循环
      this.startListenAudio();

  // P2-1: 熏听音频 — 播放当天绘本原文连读
  startListenAudio(){
    const todayBooks=this.getTodayBooks();
    // 兼容守卫：getTodayBooks 现在返回的是对象 {newBooks,reviewBooks}，
    // 而这里旧代码把它当数组用（todayBooks.newBooks 是 undefined，最终 b.id 直接抛错，
    // 结果就是点"开始熏听"必崩）。展开时兜一层，避免旧数据/旧调用再踩。
    const allBooks=[...(todayBooks.newBooks||[]),...(todayBooks.reviewBooks||[])];
    if(allBooks.length===0){
      toast('今日无绘本，熏听仅计时');
      return;
    }
    // 收集所有句子
    const items=[];
    allBooks.forEach(b=>{
      const book=getAnalyzedBook(b.id)||b;
      if(book.sentences){
        book.sentences.forEach(s=>items.push({text:s,lang:'en-US'}));
      }
    });
    if(items.length===0){toast('绘本无原文，熏听仅计时');return}
    // 循环播放
    const playLoop=()=>{
      TTS.speakSequence(items.slice(),()=>{
        // 播完后如果还在熏听,继续循环
        if(listenTimer)setTimeout(playLoop,2000);
      });
    };
    playLoop();
    toast('🎧 开始熏听：循环播放今日绘本原文');
  },
  stopListenTimer(){
    // Save & stop timer when leaving today page (avoid background leak)
    if(listenTimer){
      clearInterval(listenTimer);listenTimer=null;
      appData.todayProgress.listenMin=listenSeconds;
      save();
    }
  },
  // ===== Library Page =====

    if(!this._libSort)this._libSort='progress'; // 'progress'|'difficulty'|'name'|'recent'

  // 渲染三级折叠树
  renderLibraryTree(books){
    if(books.length===0)return`<div class="empty-state"><div class="es-icon">📚</div><div class="es-text">${this._libType==='private'?'私有库还没有绘本<br>点击右下角 + 添加你手里的绘本':'基线库正在加载...'}</div></div>`;
    // 按系列分组
    const bySeries={};
    books.forEach(b=>{
      const key=b.series||'未分类';
      if(!bySeries[key])bySeries[key]={name:key,books:[]};
      bySeries[key].books.push(b);
    });
    // 系列排序
    let seriesArr=Object.values(bySeries);
    const sortMap={progress:(a,b)=>(b.books.filter(x=>x.status==='unlearned').length)-(a.books.filter(x=>x.status==='unlearned').length),difficulty:(a,b)=>(a.books[0].level||'A').localeCompare(b.books[0].level||'A'),name:(a,b)=>a.name.localeCompare(b.name,'zh'),recent:(a,b)=>0};
    seriesArr.sort(sortMap[this._libSort]||sortMap.progress);
    // 确定展开的系列
    const expandedSeries=this._libExpand.series;
    return seriesArr.map(s=>{
      const sBooks=s.books;
      const sMastered=sBooks.filter(b=>b.status==='mastered').length;
      const sLearning=sBooks.filter(b=>b.status==='learning').length;
      const sUnlearned=sBooks.filter(b=>b.status==='unlearned').length;
      const sTotal=sBooks.length;
      const sPct=sTotal>0?Math.round(sMastered/sTotal*100):0;
      const isExpanded=(expandedSeries===s.name)||this._libSearch||this._libFilter!=='all';
      // 按级别分组
      const byLevel={A:[],B:[],C:[],D:[]};
      sBooks.forEach(b=>{const lv=b.level||'A';if(byLevel[lv])byLevel[lv].push(b);else(byLevel['A']).push(b)});
      const levelsPresent=['A','B','C','D'].filter(l=>byLevel[l].length>0);
      const levelDistStr=levelsPresent.map(l=>'L'+l+byLevel[l].length+'本').join(' · ');
      // 系列图标（根据来源混合度）
      const hasBaseline=sBooks.some(b=>b.source!=='private');
      const hasPrivate=sBooks.some(b=>b.source==='private');
      const sIcon=hasBaseline&&hasPrivate?'📚':hasBaseline?'📕':'📗';
      let html=`<div class="series-node${isExpanded?' expanded':''}" data-series="${s.name}">
        <div class="series-head" onclick="UI.toggleSeries('${s.name.replace(/'/g,"\\'")}')">
          <span class="series-icon">${sIcon}</span>
          <div class="series-info">
            <div class="series-name">${this.highlight(s.name)}</div>
            <div class="series-sub">${sMastered}/${sTotal} · ${levelDistStr}</div>
          </div>
          <div class="series-progress">
            <div class="sp-bar">
              <div class="sp-fill-m" style="width:${sMastered/sTotal*100}%"></div>
              <div class="sp-fill-l" style="width:${sLearning/sTotal*100}%"></div>
              <div class="sp-fill-u" style="width:${sUnlearned/sTotal*100}%"></div>
            </div>
            <div class="sp-text">${sPct}%</div>
          </div>
          <span class="series-arrow">▸</span>
        </div>`;
      if(isExpanded){
        html+=`<div class="series-children">`;
        levelsPresent.forEach(lv=>{
          const lBooks=byLevel[lv];
          const lMastered=lBooks.filter(b=>b.status==='mastered').length;
          const lLearning=lBooks.filter(b=>b.status==='learning').length;
          const lUnlearned=lBooks.filter(b=>b.status==='unlearned').length;
          const lTotal=lBooks.length;
          const lPct=lTotal>0?Math.round(lMastered/lTotal*100):0;
          const levelNames={A:'入门',B:'基础',C:'进阶',D:'提升'};
          // 过滤后判断级别是否需要展开
          const lExpanded=this._libExpand.levels[s.name]&&this._libExpand.levels[s.name].has(lv)||this._libSearch||this._libFilter!=='all';
          // 过滤级别内绘本
          let filteredBooks=lBooks;
          if(this._libFilter!=='all')filteredBooks=lBooks.filter(b=>b.status===this._libFilter);
          if(this._libSearch){
            const q=this._libSearch.toLowerCase();
            filteredBooks=lBooks.filter(b=>b.title.toLowerCase().includes(q)||(b.rawText||'').toLowerCase().includes(q));
          }
          // 绘本排序
          const bookSortMap={status:(a,b)=>{const r={unlearned:0,learning:1,mastered:2};return r[a.status]-r[b.status]},vocab:(a,b)=>(a.vocab?a.vocab.length:0)-(b.vocab?b.vocab.length:0),recent:(a,b)=>(b.lastRead||'').localeCompare(a.lastRead||''),name:(a,b)=>a.title.localeCompare(b.title)};
          filteredBooks.sort(bookSortMap[this._libBookSort]||bookSortMap.status);
          // 级别来源角标
          const lvHasBaseline=lBooks.some(b=>b.source!=='private');
          const lvHasPrivate=lBooks.some(b=>b.source==='private');
          const lvSrcIcon=lvHasBaseline&&lvHasPrivate?'🔀':lvHasBaseline?'📦':'🏠';
          html+=`<div class="level-node${lExpanded?' expanded':''}" data-level="${lv}" data-series="${s.name}">
            <div class="level-head" onclick="UI.toggleLevel('${s.name.replace(/'/g,"\\'")}','${lv}')">
              <div class="level-badge" data-level="${lv}">${lv}<span class="lb-src">${lvSrcIcon}</span></div>
              <div class="level-info">
                <div class="level-name">${levelNames[lv]}</div>
                <div class="level-sub">${lMastered}/${lTotal}本${this._libFilter!=='all'?' · '+filteredBooks.length+'匹配':''}</div>
              </div>
              <div class="level-progress">
                <div class="sp-bar">
                  <div class="sp-fill-m" style="width:${lTotal>0?lMastered/lTotal*100:0}%"></div>
                  <div class="sp-fill-l" style="width:${lTotal>0?lLearning/lTotal*100:0}%"></div>
                  <div class="sp-fill-u" style="width:${lTotal>0?lUnlearned/lTotal*100:0}%"></div>
                </div>
                <div class="sp-text">${lPct}%</div>
              </div>
              <span class="level-arrow">▸</span>
            </div>`;
          if(lExpanded){
            html+=`<div class="level-children">`;
            if(filteredBooks.length===0){
              html+=`<div style="padding:8px 12px 8px 48px;font-size:12px;color:var(--text-muted)">无匹配绘本</div>`;
            }else{
              filteredBooks.forEach(b=>{
                const isBookExpanded=this._libExpand.books[s.name]&&this._libExpand.books[s.name].has(b.id);
                html+=this.renderBookTreeRow(b,s.name,isBookExpanded);
              });
            }
            html+=`</div>`;
          }
          html+=`</div>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
      return html;
    }).join('');
  },
  // 渲染单本绘本行（收起态）+ 展开态信息卡片
  renderBookTreeRow(b,seriesName,isExpanded){
    const statusMap={mastered:['✅ 已掌握','mastered'],learning:['🔵 学习中','learning'],unlearned:['⬜ 未学','unlearned']};
    const[sl,scls]=statusMap[b.status]||statusMap.unlearned;
    const isSimple=this._libMode==='simple';
    const metaText=isSimple?'':`${b.vocab?b.vocab.length:0}词 · ${b.pattern||''}`;
    let html=`<div class="book-tree-row${isExpanded?' expanded':''}" data-book="${b.id}" onclick="UI.toggleBook('${seriesName.replace(/'/g,"\\'")}','${b.id}')">
      <div class="btr-bar ${scls}"></div>
      <div class="btr-info">
        <div class="btr-title">${this.highlight(b.title)}</div>
        ${isSimple?'':`<div class="btr-meta">${metaText}</div>`}
      </div>
      <span class="btr-status badge ${scls==='mastered'?'badge-success':scls==='learning'?'badge-accent':'badge-muted'}">${sl}</span>
      <span class="btr-arrow">▸</span>
    </div>`;
    if(isExpanded){
      const rawPreview=(b.rawText||'').slice(0,100)+(b.rawText&&b.rawText.length>100?'...':'');
      const srcLabel=b.source==='private'?'🏠 私有库':'📦 基线库';
      const lastReadText=b.lastRead?this.timeAgo(b.lastRead):'未读';
      html+=`<div class="book-info-card">
        <div class="bic-preview">📖 ${this.highlight(rawPreview)}</div>
        <div class="bic-data">
          <span class="bic-tag brand">📝 ${b.vocab?b.vocab.length:0}词</span>
          <span class="bic-tag">💬 ${b.pattern||'无'}</span>
          <span class="bic-tag">📚 已读${b.readCount||0}次</span>
          <span class="bic-tag">📅 ${lastReadText}</span>
          <span class="bic-tag">${srcLabel}</span>
        </div>
        <div class="bic-actions">
          <div class="bic-action" onclick="event.stopPropagation();UI.openBookForPreview('${b.id}')">📖 备课预习</div>
          <div class="bic-action primary" onclick="event.stopPropagation();UI.openBookForTeach('${b.id}')">👨‍👧 伴读上课</div>
          <div class="bic-action" onclick="event.stopPropagation();UI.openBook('${b.id}');UI.showPage('detail');UI.renderDetail()">📋 详情 →</div>
        </div>
      </div>`;
    }
    return html;
  },
  // 折叠交互：系列（同时只展开1个）
  toggleSeries(seriesName){
    if(this._libSearch||this._libFilter!=='all'){
      // 搜索/筛选模式下不自动折叠，手动切换
      if(this._libExpand.series===seriesName){this._libExpand.series=null;}
      else{this._libExpand.series=seriesName;}
    }else{
      this._libExpand.series=(this._libExpand.series===seriesName)?null:seriesName;
    }
    if(!this._libExpand.levels[seriesName])this._libExpand.levels[seriesName]=new Set();
    if(!this._libExpand.books[seriesName])this._libExpand.books[seriesName]=new Set();
    this.renderLibraryTreeUpdate();
  },
  // 折叠交互：级别（可同时展开多个）
  toggleLevel(seriesName,level){
    if(!this._libExpand.levels[seriesName])this._libExpand.levels[seriesName]=new Set();
    const set=this._libExpand.levels[seriesName];
    if(set.has(level))set.delete(level);else set.add(level);
    this.renderLibraryTreeUpdate();
  },
  // 折叠交互：绘本（最多展开2本，第3本自动收起第1本）
  toggleBook(seriesName,bookId){
    if(!this._libExpand.books[seriesName])this._libExpand.books[seriesName]=new Set();
    const set=this._libExpand.books[seriesName];
    if(set.has(bookId)){
      set.delete(bookId);
    }else{
      set.add(bookId);
      // 最多2本，超出时删除最早加入的
      if(set.size>2){
        const first=set.values().next().value;
        set.delete(first);
      }
    }
    this.renderLibraryTreeUpdate();
  },
  // 局部刷新树（不重渲染整个页面）
  renderLibraryTreeUpdate(){
    let books=getAllBooks();
    if(this._libType==='baseline')books=books.filter(b=>b.source!=='private');
    else if(this._libType==='private')books=books.filter(b=>b.source==='private');
    $('#book-list').innerHTML=this.renderLibraryTree(books);
  },
  // 高亮搜索关键词
  highlight(text){
    if(!this._libSearch||!text)return text||'';
    const q=this._libSearch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return(text||'').replace(new RegExp(q,'gi'),m=>`<mark style="background:#FEF3C7;padding:0 2px;border-radius:2px">${m}</mark>`);
  },
  // 时间ago
  timeAgo(dateStr){
    const d=new Date(dateStr);const now=new Date();
    const days=Math.floor((now-d)/86400000);
    if(days===0)return'今天';
    if(days===1)return'昨天';
    if(days<7)return days+'天前';
    if(days<30)return Math.floor(days/7)+'周前';
    return Math.floor(days/30)+'月前';
  },
  // 搜索联动：自动展开包含的系列和级别
  searchBooks(q){
    this._libSearch=q.trim()||null;
    if(this._libSearch){
      // 自动展开匹配的系列和级别
      let books=getAllBooks();
      if(this._libType==='baseline')books=books.filter(b=>b.source!=='private');
      else if(this._libType==='private')books=books.filter(b=>b.source==='private');
      const ql=this._libSearch.toLowerCase();
      const matchedBooks=books.filter(b=>b.title.toLowerCase().includes(ql)||(b.rawText||'').toLowerCase().includes(ql));
      // 自动展开匹配的系列
      const matchedSeries=[...new Set(matchedBooks.map(b=>b.series||'未分类'))];
      if(matchedSeries.length>0){
        this._libExpand.series=matchedSeries[0];
        matchedSeries.forEach(s=>{
          if(!this._libExpand.levels[s])this._libExpand.levels[s]=new Set();
          // 自动展开所有包含匹配绘本的级别
          matchedBooks.filter(b=>(b.series||'未分类')===s).forEach(b=>{
            const lv=b.level||'A';
            this._libExpand.levels[s].add(lv);
          });
        });
      }
    }
    this.renderLibraryTreeUpdate();
  },
  // 筛选联动：自动展开匹配路径
  filterBooks(filter){
    this._libFilter=filter;
    $$('.lib-filter').forEach(f=>f.classList.toggle('active',f.dataset.filter===filter));
    if(filter!=='all'){
      // 自动展开包含匹配绘本的系列和级别
      let books=getAllBooks();
      if(this._libType==='baseline')books=books.filter(b=>b.source!=='private');
      else if(this._libType==='private')books=books.filter(b=>b.source==='private');
      const matchedBooks=books.filter(b=>b.status===filter);
      const matchedSeries=[...new Set(matchedBooks.map(b=>b.series||'未分类'))];
      if(matchedSeries.length>0){
        this._libExpand.series=matchedSeries[0];
        matchedSeries.forEach(s=>{
          if(!this._libExpand.levels[s])this._libExpand.levels[s]=new Set();
          matchedBooks.filter(b=>(b.series||'未分类')===s).forEach(b=>{
            const lv=b.level||'A';
            this._libExpand.levels[s].add(lv);
          });
        });
      }
    }
    this.renderLibraryTreeUpdate();
  },
  // 模式切换
  toggleMode(){
    this._libMode=this._libMode==='detail'?'simple':'detail';
    this.renderLibrary();
  },
  // 排序切换
  cycleSort(){
    const order=['progress','difficulty','name','recent'];
    const idx=order.indexOf(this._libSort);
    this._libSort=order[(idx+1)%order.length];
    const labels={progress:'按进度',difficulty:'按难度',name:'按名称',recent:'按最近'};
    toast('系列排序：'+labels[this._libSort]);
    // 绘本排序也循环
    const bookOrder=['status','vocab','recent','name'];
    const bidx=bookOrder.indexOf(this._libBookSort);
    this._libBookSort=bookOrder[(bidx+1)%bookOrder.length];
    this.renderLibraryTreeUpdate();
  },
  // 打开绘本（设置currentBookId）
  openBook(id){
    currentBookId=id;currentTab='raw';
  },
  // 从绘本库信息卡片启动备课预习（避免与detail页的startPreview冲突）
  openBookForPreview(id){
    currentBookId=id;currentTab='raw';
    this.showPage('detail');this.renderDetail();
    setTimeout(()=>{if(typeof this.startPreview==='function')this.startPreview()},150);
  },
  // 从绘本库信息卡片启动伴读上课
  openBookForTeach(id){
    currentBookId=id;currentTab='raw';
    this.showPage('detail');this.renderDetail();
    setTimeout(()=>{if(typeof this.startTeachMode==='function')this.startTeachMode()},150);
  },

  patternToCN(p){const map={'This is my':'这是我的','This is':'这是','I can see':'我能看到','I see':'我看见','Look at':'看','I like to':'我喜欢','Here is':'这里是','Mom can':'妈妈能','Dad can':'爸爸能','The baby can':'宝宝能','I love':'我爱','We can':'我们能'};for(const[e,c]of Object.entries(map)){if(p.includes(e))return c+'___。'}return'___。'},

  // P1-2: TPR动作词动态生成
  genTPRActions(book){
    const TPR_LIB={
      run:{cn:'跑',action:'原地跑'},
      jump:{cn:'跳',action:'跳一下'},
      walk:{cn:'走',action:'走几步'},
      swim:{cn:'游泳',action:'做游泳动作'},
      fly:{cn:'飞',action:'张开双臂飞'},
      climb:{cn:'爬',action:'做爬行动作'},
      sit:{cn:'坐',action:'坐下来'},
      stand:{cn:'站',action:'站起来'},
      eat:{cn:'吃',action:'假装吃东西'},
      drink:{cn:'喝',action:'假装喝水'},
      sleep:{cn:'睡觉',action:'闭眼假装睡'},
      cry:{cn:'哭',action:'假装哭'},
      laugh:{cn:'笑',action:'哈哈大笑'},
      play:{cn:'玩',action:'做玩耍动作'},
      sing:{cn:'唱',action:'假装唱歌'},
      dance:{cn:'跳舞',action:'跳个舞'},
      draw:{cn:'画',action:'假装画画'},
      wave:{cn:'挥手',action:'挥挥手'},
      hug:{cn:'拥抱',action:'给一个拥抱'},
      point:{cn:'指',action:'用手指一指'},
      clap:{cn:'拍手',action:'拍拍手'},
      kick:{cn:'踢',action:'踢一下'},
      wash:{cn:'洗',action:'假装洗手'},
      wear:{cn:'穿',action:'假装穿衣'},
      ride:{cn:'骑',action:'假装骑车'},
      drive:{cn:'开',action:'假装开车'},
      turn:{cn:'转',action:'转一转'},
      bend:{cn:'弯',action:'弯弯腰'},
      raise:{cn:'举',action:'举起手'},
      touch:{cn:'摸',action:'摸一摸'},
      look:{cn:'看',action:'看一看'},
      open:{cn:'打开',action:'打开门'},
      close:{cn:'关上',action:'关上门'},
    };
    // 从绘本词汇中提取动作词
    const VERBS=new Set(Object.keys(TPR_LIB));
    const bookActionWords=(book.vocab||[]).filter(v=>VERBS.has(v.word));
    // 如果绘本动作词不足3个,从原文提取
    if(bookActionWords.length<3){
      const rawWords=(book.rawText||'').toLowerCase().replace(/[^a-z\s']/g,'').split(/\s+/).filter(w=>VERBS.has(w)&&w.length>0);
      const unique=[...new Set(rawWords)].filter(w=>!bookActionWords.find(v=>v.word===w));
      unique.forEach(w=>{bookActionWords.push({word:w,cn:VOCAB_DB[w]||''})});
    }
    // 如果还不够,用默认动作词
    if(bookActionWords.length<3){
      ['run','jump','clap','wave','point'].forEach(w=>{
        if(!bookActionWords.find(v=>v.word===w)&&VERBS.has(w)){bookActionWords.push({word:w,cn:TPR_LIB[w].cn})}
      });
    }
    return bookActionWords.slice(0,6).map(v=>{
      const tpr=TPR_LIB[v.word]||{cn:v.cn||'',action:'做动作'};
      return{en:v.word,cn:tpr.cn,action:tpr.action};
    });
  },

  cycleStatus(){
    const book=getBook(currentBookId);
    const order=['unlearned','learning','mastered'];
    const idx=order.indexOf(book.status);
    const prevStatus=book.status;
    book.status=order[(idx+1)%3];
    if(book.status==='mastered'){
      const analyzed=getAnalyzedBook(currentBookId);
      if(analyzed)analyzed.vocab.forEach(v=>{if(!appData.learnedWords.includes(v.word))appData.learnedWords.push(v.word)});
      // 难度自适应：标记掌握
      const adjust=AdaptiveEngine.updateDifficulty(book,'mastered');
      if(adjust.adjust==='up')setTimeout(()=>toast('🎉 宝宝连续掌握3本！推荐升级到Level '+adjust.to),500);
      else if(adjust.adjust==='down')setTimeout(()=>toast('💪 加油！推荐复习Level '+adjust.to+'的书'),500);
    }else if(book.status==='learning'&&prevStatus==='mastered'){
      // 从掌握退回学习中，标记困难
      AdaptiveEngine.updateDifficulty(book,'struggling');
    }
    save();
    this.renderDetail();
    toast('状态已更新：'+{unlearned:'未学',learning:'学习中',mastered:'已掌握'}[book.status]);
  },

  teachCheckinData:{status:'learning',outputs:[],note:''},
  setTeachStatus(s){
    this.teachCheckinData.status=s;
    ['mastered','learning','hard'].forEach(st=>{
      const el=$('#teach-status-'+st);if(el){
        el.classList.toggle('btn-brand',st===s);el.classList.toggle('btn-ghost',st!==s);
      }
    });
